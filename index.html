<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f6f0e7"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<title>Journey of Money</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f0e7}
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f6f0e7}
</style>
</head>
<body>
<iframe id="appFrame" src="./app-main.html?v=readability-20260818-1" title="Journey of Money"></iframe>
<script>
const criticalReadability = `
body{font-size:16px!important}
.eyebrow{font-size:11px!important;line-height:1.3!important}
.hero h1{font-size:36px!important;line-height:1.08!important;letter-spacing:-.02em!important}
.hero p{font-size:14px!important;line-height:1.58!important;color:#53655f!important}
.tile h3{font-size:19px!important;line-height:1.24!important}
.tile p{font-size:14px!important;line-height:1.55!important;color:#53655f!important}
.meta,.progress-pill{font-size:11px!important}
.chapter-hero h2{font-size:34px!important;line-height:1.08!important}
.chapter-hero p{font-size:14px!important;line-height:1.58!important;color:#53655f!important}
.chapter-meta,.finance-note{font-size:11px!important;line-height:1.45!important}
.map-head b{font-size:15px!important}.map-head small{font-size:11px!important}
.station-label{font-size:11px!important;line-height:1.3!important;max-width:132px!important;padding:8px 10px!important}
.station-row b{font-size:14px!important;line-height:1.35!important}
.station-row small{font-size:11.5px!important;line-height:1.42!important}
.lesson-progress,.lesson-stage{font-size:11px!important}
.lesson-card h2{font-size:33px!important;line-height:1.1!important}
.lesson-card p,.deep-copy,.deep-copy p{font-size:14px!important;line-height:1.65!important}
.learn-list{font-size:13.5px!important;line-height:1.62!important}
.concept,.example,.choice{font-size:14px!important;line-height:1.55!important}
.feedback{font-size:13px!important;line-height:1.5!important}
.cta,.btn{font-size:14px!important;line-height:1.2!important;min-height:50px!important}
.app{padding-bottom:98px!important}
.bottom-nav{height:92px!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:2px!important;padding:8px 4px calc(9px + env(safe-area-inset-bottom))!important}
.bottom-tab{min-width:0!important;padding:5px 1px!important;gap:4px!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;font-size:11.5px!important;line-height:1.08!important;font-weight:900!important;color:#4f625c!important}
.bottom-tab>span:last-child{display:block!important;max-width:100%!important;overflow:visible!important;text-overflow:clip!important;white-space:nowrap!important;font-size:11.5px!important;line-height:1.1!important}
.bottom-tab .tab-symbol{min-width:32px!important;height:30px!important;padding:0 6px!important;border-radius:10px!important;font-size:9.5px!important}
.bottom-tab.active{color:#17362f!important}
.brand b{font-size:13px!important}.brand small{font-size:10px!important}
@media(max-width:360px){.hero h1{font-size:33px!important}.tile h3{font-size:18px!important}.tile p{font-size:13.5px!important}.bottom-tab>span:last-child{font-size:10.5px!important}}
`;

function applyReadability(){
  const frame=document.getElementById('appFrame');
  try{
    const doc=frame.contentDocument || frame.contentWindow.document;
    if(!doc || !doc.head) return;
    let link=doc.getElementById('jom-readability-link');
    if(!link){
      link=doc.createElement('link');
      link.id='jom-readability-link';
      link.rel='stylesheet';
      link.href='./readability.css?v=20260818-2';
      doc.head.appendChild(link);
    }
    let style=doc.getElementById('jom-readability-critical');
    if(!style){
      style=doc.createElement('style');
      style.id='jom-readability-critical';
      style.textContent=criticalReadability;
      doc.head.appendChild(style);
    }else{
      style.textContent=criticalReadability;
    }
  }catch(e){console.warn('Readability injection failed',e)}
}

document.getElementById('appFrame').addEventListener('load',()=>{
  applyReadability();
  setTimeout(applyReadability,250);
  setTimeout(applyReadability,1200);
});

// Remove stale app caches/old workers once, then let the fresh page control itself.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(r=>r.unregister()))).catch(()=>{});
}
if('caches' in window){
  caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('journey-of-money-')).map(k=>caches.delete(k)))).catch(()=>{});
}
</script>
</body>
</html>
