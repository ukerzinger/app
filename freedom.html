    debts: {
      consumer: debts, consumerRate: debtRate, consumerInterest: debtInterest,
      consumerYearsLeft: debtYearsLeft, expensiveDebt,
      mortgage: mortgageDebt, mortgageRate, mortgageInterest, mortgageYearsLeft,
      total: debts + mortgageDebt, debtRatio,
      freedRateAfterPayoff: debtRate + mortgageRate
    },
    futureIncome: { sources: incomeSources, atTargetAge: incomeAt(targetAge), atPerpetuity: targetDetail.permIncome, perpetuityAge },
    protection: {
      liability: txt("liability", "no"), household: txt("household", "no"),
      legal: txt("legal", "no"), bu: txt("bu", "no"), life: txt("life", "no"),
      needsLifeCover
    },
    plan: {
      remainingCapital, requiredContribution, availableContribution, implementationGap,
      savingShareOfNet, surplusUsage, achievableCapital, coverage,
      possibleFreedomIncome, freedomHeadroom, shortHorizon,
      /** Bei sehr kurzem Zeitraum ist die Einmalsumme die ehrlichere Zahl. */
      lumpSumNeeded: shortHorizon ? remainingCapital : 0,
      reached: remainingCapital <= 0
    }
  };
}

function validateFreedomBlueprintInput(input) {
  const errors = [];
  const age = Number(input.age);
  const targetAge = Number(input.targetAge);
  if (!input.name?.trim()) errors.push("Bitte einen Namen eingeben.");
  if (!Number.isFinite(age) || age < 16 || age > 90) errors.push("Alter muss zwischen 16 und 90 liegen.");
  if (!Number.isFinite(targetAge) || targetAge <= age) errors.push("Zielalter muss über dem heutigen Alter liegen.");
  if (Number(input.expenses) < 0) errors.push("Ausgaben dürfen nicht negativ sein.");
  // Eine der beiden Angaben muss da sein — welche, entscheidet der gewählte Weg.
  if (input.cashflowMode === "sparrate") {
    if (!Number.isFinite(Number(input.affordableSaving))) {
      errors.push("Bitte angeben, was du monatlich zurücklegen kannst (Wohnen).");
    }
  } else if (!Number.isFinite(Number(input.expenses)) || Number(input.expenses) <= 0) {
    errors.push("Bitte deine monatlichen Ausgaben angeben (Wohnen).");
  }
  if (Number(input.withdrawal) <= 0) errors.push("Entnahmesatz muss größer als 0 % sein.");
  return errors;
}

function calculateFreedomBlueprint(input) {
  const age = Number(input.age) || 0;
  const targetAge = Number(input.targetAge) || 0;
  const years = Math.max(targetAge - age, 0);
  const net = Math.max(Number(input.net) || 0, 0);
  const expenses = Math.max(Number(input.expenses) || 0, 0);
  const passive = Math.max(Number(input.passive) || 0, 0);
  const reserve = Math.max(Number(input.reserve) || 0, 0);
  const debts = Math.max(Number(input.debts) || 0, 0);
  const pension = Math.max(Number(input.pension) || 0, 0);
  const companyPension = Math.max(Number(input.companyPension) || 0, 0);
  const privatePension = Math.max(Number(input.privatePension) || 0, 0);
  const futureOtherIncome = Math.max(Number(input.futureOtherIncome) || 0, 0);
  const cash = Math.max(Number(input.cash) || 0, 0);
  const depot = Math.max(Number(input.depot) || 0, 0);
  const otherAssets = Math.max(Number(input.otherAssets) || 0, 0);
  const realEstateEquity = Math.max(Number(input.realEstateEquity) || 0, 0);
  const existingReturn = Number(input.existingReturn) || 5;
  const withdrawal = Number(input.withdrawal) || 5;
  const savingReturn = Number(input.savingReturn) || 7;
  const inflation = Number(input.inflation) || 2;
  const inflationMode = input.inflationMode === "yes";

  const pensionIncome = pension + companyPension + privatePension + futureOtherIncome;
  const currentFreedom = expenses > 0 ? (passive / expenses) * 100 : 0;
  const inflationFactor = inflationMode ? Math.pow(1 + inflation / 100, years) : 1;
  const freedomTarget = net * inflationFactor;
  const freedomGap = Math.max(freedomTarget - pensionIncome, 0);
  const yearlyGap = freedomGap * 12;
  const targetCapital = withdrawal > 0 ? yearlyGap / (withdrawal / 100) : 0;
  const existingCapital = cash + depot + otherAssets + realEstateEquity;
  const existingFuture = existingCapital * Math.pow(1 + existingReturn / 100, years);
  const remainingCapital = Math.max(targetCapital - existingFuture, 0);
  const monthlyContribution = monthlySaving(remainingCapital, years, savingReturn);
  // Vergleich: reines Zurücklegen ohne Rendite (fehlendes Kapital / Monate).
  const monthlyContributionNoReturn = years > 0 ? remainingCapital / (years * 12) : remainingCapital;
  const emergencyMonths = expenses > 0 ? reserve / expenses : 0;
  const debtRatio = net > 0 ? (debts / (net * 12)) * 100 : 0;

  let security = 0;
  security += emergencyMonths >= 6 ? 10 : emergencyMonths >= 3 ? 7 : emergencyMonths >= 1 ? 3 : 0;
  security += input.liability === "yes" ? 10 : 0;
  security += input.bu === "yes" ? 20 : 0;
  security += brauchtHinterbliebenenschutz(input.family)
    ? (input.life === "yes" ? 10 : 0)
    : 10;
  security += input.household === "yes" ? 5 : 0;
  security += input.legal === "yes" ? 5 : 0;
  security = clamp((security / 60) * 100, 0, 100);

  let stability = 0;
  stability += debtRatio <= 10 ? 25 : debtRatio <= 30 ? 15 : debtRatio <= 60 ? 7 : 0;
  stability += existingCapital > 0 ? 20 : 0;
  stability += monthlyContribution > 0 && monthlyContribution < net * 0.2 ? 20 : monthlyContribution <= 0 ? 25 : 10;
  stability += reserve > 0 ? 15 : 0;
  stability += depot > 0 ? 20 : 5;
  stability = clamp(stability, 0, 100);

  let freedom = 0;
  freedom += clamp(currentFreedom, 0, 100) * 0.35;
  freedom += targetCapital > 0 ? clamp((existingFuture / targetCapital) * 100, 0, 100) * 0.45 : 45;
  freedom += pensionIncome > 0 && freedomTarget > 0
    ? clamp((pensionIncome / freedomTarget) * 100, 0, 100) * 0.20
    : 0;
  freedom = clamp(freedom, 0, 100);

  const totalScore = Math.round(security * 0.34 + stability * 0.33 + freedom * 0.33);
  const station = stationFromScore(totalScore);
  const reached = remainingCapital <= 0;
  const neededLife = brauchtHinterbliebenenschutz(input.family);
  const lifeNeed = neededLife ? Math.round((net * 12 * 8 + debts) / 10000) * 10000 : 0;

  const buAge = 40;
  const buYears = Math.max(targetAge - buAge, 0);
  const lostIncome = net * 12 * buYears;
  const investYears = Math.max(years, 30);
  const investMonthly = Math.max(monthlyContribution, 300);
  const noInvestFv = futureValueMonthly(investMonthly, investYears, 7);
  const noInvestPaid = investMonthly * 12 * investYears;
  const noInvestLoss = Math.max(noInvestFv - noInvestPaid, 0);

  const stepsToday = [];
  const stepsMonth = [];
  const stepsYear = [];
  const stepsLong = [];

  if (input.liability !== "yes") stepsToday.push("Privathaftpflicht abschließen oder prüfen");
  if (emergencyMonths < 3) stepsToday.push("Notgroschen auf mindestens 3 Monatsausgaben planen");
  if (monthlyContribution > 0) stepsMonth.push(`Spar-/Investmentrate von ca. ${euro(monthlyContribution)} einrichten`);
  if (input.bu !== "yes") stepsYear.push("Berufsunfähigkeit professionell prüfen");
  if (neededLife && input.life !== "yes") stepsYear.push(`Risikoleben für Familie prüfen: grob ${euro(lifeNeed)}`);
  stepsLong.push(`Zielkapital von ${euro(targetCapital)} systematisch aufbauen`);
  if (!stepsToday.length) stepsToday.push("Bestehende Verträge und Rücklagen dokumentieren");
  if (!stepsMonth.length) stepsMonth.push("Vermögensstrategie überprüfen und Rebalancing planen");

  return {
    name: String(input.name || "Teilnehmer").trim(),
    age,
    targetAge,
    years,
    net,
    expenses,
    passive,
    reserve,
    debts,
    pensionIncome,
    currentFreedom,
    freedomTarget,
    freedomGap,
    targetCapital,
    existingCapital,
    existingFuture,
    remainingCapital,
    monthlyContribution,
    monthlyContributionNoReturn,
    savingReturn,
    emergencyMonths,
    debtRatio,
    security: Math.round(security),
    stability: Math.round(stability),
    freedom: Math.round(freedom),
    totalScore,
    station,
    reached,
    neededLife,
    lifeNeed,
    lostIncome,
    pensionLoss: targetCapital,
    noInvestFv,
    noInvestPaid,
    noInvestLoss,
    investMonthly,
    investYears,
    existingReturn,
    withdrawal,
    stepsToday,
    stepsMonth,
    stepsYear,
    stepsLong,
    input
  };
}

exports.euro=euro;
exports.monthlySaving=monthlySaving;
exports.futureValueMonthly=futureValueMonthly;
exports.presentValueAnnuity=presentValueAnnuity;
exports.realReturnPct=realReturnPct;
exports.futureValueGrowing=futureValueGrowing;

exports.remainingLoanYears=remainingLoanYears;
exports.solveThreshold=solveThreshold;
exports.stationFromScore=stationFromScore;
exports.brauchtHinterbliebenenschutz=brauchtHinterbliebenenschutz;

exports.calculateFreedomBlueprint=calculateFreedomBlueprint;

define("freedom-blueprint-feasibility.js",function(module,exports,require){
/**
 * FREEDOM BLUEPRINT — Machbarkeitsprüfung und Engpassanalyse.
 *
 * Der Machbarkeitsstatus ist eine EIGENE Größe neben dem Freedom Blueprint Score. Er wird
 * nie mit ihm verrechnet: Der Score beschreibt, wo jemand steht. Der Status beantwortet
 * eine einzige Frage — ist das Ziel mit den heutigen Angaben erreichbar?
 *
 * Hier wird NICHT gerechnet. Alle Zahlen kommen aus calculateFreedomPlan().
 * Fachliche Herleitung: docs/freedom-blueprint/01_FACHKONZEPT.md, Abschnitt 5.
 */
const { FB_PLAN_DEFAULTS } = require("freedom-blueprint-engine.js");

const FB_STATUS = {
  GRUEN: "gruen",
  GELB: "gelb",
  ORANGE: "orange",
  ROT: "rot",
  BLAU: "blau"
};

/** Reihenfolge der Engpässe — fest verdrahtet nach §9 des Auftrags. */
const FB_BOTTLENECK_ORDER = [
  "datenqualitaet", "cashflow", "schutz", "konsumschulden", "ueberschuss",
  "einkommen-ausgaben", "zielhoehe-zeit", "dynamik", "rendite-risiko", "beratung"
];

const monate1 = (n) => (Number(n) || 0).toFixed(1).replace(".", ",");
const round10 = (n) => Math.round((Number(n) || 0) / 10) * 10;
/** Gerundet UND mit Tausenderpunkt — sonst steht neben "1.214 €" ein nacktes "1210 €". */
const eur = (n) => round10(n).toLocaleString("de-DE") + " €";

/**
 * Der Machbarkeitsstatus. Die Prüfreihenfolge ist bindend: Rot vor Blau vor Grün.
 * Ein Ziel, das rechnerisch finanziert ist, aber auf einem negativen Cashflow steht,
 * ist kein grünes Ziel.
 */
function assessFeasibility(plan, quality) {
  const c = plan.monthlyCashflow;
  const p = plan.plan;
  const a = plan.assets;
  const d = plan.debts;
  const D = FB_PLAN_DEFAULTS;

  const rotGruende = [];
  if (c.grossSurplus < 0) {
    rotGruende.push({
      id: "cashflow",
      text: `Deine Ausgaben liegen derzeit rund ${eur(Math.abs(c.grossSurplus))} über deinen Einnahmen.`
    });
  }
  if (a.emergencyMonths < 1) {
    rotGruende.push({
      id: "notgroschen",
      text: `Dein Notgroschen deckt derzeit ${monate1(a.emergencyMonths)} Monatsausgaben.`
    });
  }
  if (d.expensiveDebt) {
    rotGruende.push({
      id: "konsumschulden",
      text: `Deine Konsumschulden kosten rechnerisch ${d.consumerInterest} % im Jahr — mehr als die von dir angenommene Anlagerendite von ${plan.assumptions.savingReturnNominal} %.`
    });
  }
  if (plan.profile.years < D.redMinYears && p.remainingCapital > 0) {
    rotGruende.push({
      id: "zeit",
      text: `Bis zu deinem Zielalter bleiben nur ${plan.profile.years} Jahre. Für den fehlenden Betrag ist das ein sehr kurzer Zeitraum.`
    });
  }
  if (plan.currentSituation.net > 0
    && p.requiredContribution > D.redSavingShareOfNet * plan.currentSituation.net) {
    rotGruende.push({
      id: "sparquote",
      text: `Die notwendige Sparrate entspricht rund ${Math.round(p.savingShareOfNet * 100)} % deines Nettoeinkommens.`
    });
  }

  let status;
  let headline;
  let detail;

  if (rotGruende.length) {
    status = FB_STATUS.ROT;
    headline = "Zuerst das Fundament stabilisieren";
    detail = "Bevor du deine Freiheitsrate erhöhst, solltest du dein finanzielles Fundament stabilisieren. Sonst kann der Plan beim ersten Rückschlag abbrechen.";
  } else if (p.reached) {
    status = FB_STATUS.BLAU;
    headline = "Ziel rechnerisch bereits finanziert";
    detail = "Dein verfügbares Kapital könnte dein Ziel unter den gewählten Annahmen bereits finanzieren. Prüfe jetzt vor allem Liquidität, Entnahmestruktur, Risiken und die Verfügbarkeit der einzelnen Vermögenswerte.";
  } else if (p.implementationGap > 0) {
    status = FB_STATUS.ORANGE;
    headline = "Nur mit Veränderungen erreichbar";
    detail = `Für dein Ziel fehlen dir derzeit rund ${eur(p.implementationGap)} im Monat. Deine Vision ist nicht unmöglich, aber mit deinen heutigen Einstellungen noch nicht finanzierbar.`;
  } else if (p.surplusUsage > D.greenBufferShare) {
    status = FB_STATUS.GELB;
    headline = "Erreichbar, aber angespannt";
    detail = `Dein Ziel ist rechnerisch erreichbar, aber dein Plan ist empfindlich: Er bindet rund ${Math.round(p.surplusUsage * 100)} % deines frei verfügbaren Überschusses. Bereits eine unerwartete Ausgabe könnte die Umsetzung unterbrechen.`;
  } else {
    status = FB_STATUS.GRUEN;
    headline = "Mit heutigem Überschuss erreichbar";
    detail = `Dein Ziel ist mit deinen heutigen Angaben grundsätzlich erreichbar. Für deinen Freedom Blueprint benötigst du etwa ${eur(p.requiredContribution)} monatlich, verfügbar sind rechnerisch etwa ${eur(p.availableContribution)}.`;

    headline,
    detail,

function findBottlenecks(plan, quality) {
  const c = plan.monthlyCashflow;
  const p = plan.plan;
  const a = plan.assets;
  const d = plan.debts;
  const prot = plan.protection;
  const out = [];

  // `kategorie` steuert die Reihenfolge, `id` bleibt eindeutig — sonst tragen drei offene
  // Schutzthemen dieselbe Kennung und lassen sich weder anzeigen noch abhaken.
  const add = (kategorie, id, titel, text, schwere) =>
    out.push({ id, kategorie, titel, text, schwere });

  if (quality && quality.level !== "belastbar") {
    add("datenqualitaet", "datenqualitaet", "Angaben unvollständig",

        : "Einzelne Angaben beruhen auf Standardannahmen. Die Auswertung ist deshalb eine vorläufige Orientierung.",

  }
  if (c.grossSurplus < 0) {
    add("cashflow", "cashflow-negativ", "Negativer Cashflow",
      `Deine Ausgaben liegen rund ${eur(Math.abs(c.grossSurplus))} über deinem Einkommen. Bevor du zusätzlich investierst, braucht dein Plan zunächst einen positiven monatlichen Spielraum.`,
      "hoch");
  }
  if (a.emergencyMonths < FB_PLAN_DEFAULTS.emergencyMonthsTarget) {
    add("schutz", "notgroschen", "Notgroschen unter drei Monatsausgaben",
      `Dein Notgroschen deckt derzeit ${monate1(a.emergencyMonths)} Monatsausgaben. Bevor du die volle Freiheitsrate investierst, könnte ein Puffer von drei Monatsausgaben sinnvoll sein.`,
      a.emergencyMonths < 1 ? "hoch" : "mittel");
  }
  if (prot.bu !== "yes") {
    add("schutz", "arbeitskraft", "Arbeitskraft nicht abgesichert",
      "Dein Erwerbseinkommen trägt diesen ganzen Plan. Ob und in welcher Form eine Absicherung zu dir passt, sollte fachlich geprüft werden.",
      "hoch");
  }
  if (prot.needsLifeCover && prot.life !== "yes") {
    add("schutz", "familie", "Absicherung der Familie offen",
      "Es leben Menschen von deinem Einkommen. Ob eine Absicherung nötig ist und in welcher Höhe, lässt sich nur individuell klären.",
      "mittel");
  }
  if (d.expensiveDebt) {
    add("konsumschulden", "konsumschulden", "Teure Konsumschulden",
      `Deine Konsumschuld kostet rechnerisch ${d.consumerInterest} % im Jahr und damit mehr als die von dir angenommene Anlagerendite von ${plan.assumptions.savingReturnNominal} %. Prüfe deshalb, ob eine frühere Tilgung wirtschaftlich sinnvoller sein könnte.`,
      "hoch");
  }
  if (p.implementationGap > 0) {
    add("ueberschuss", "sparrate-nicht-finanzierbar", "Sparrate nicht finanzierbar",
      `Für dein Ziel wären monatlich etwa ${eur(p.requiredContribution)} erforderlich. Nach deinen heutigen Angaben stehen ungefähr ${eur(p.availableContribution)} zur Verfügung. Deine Umsetzungslücke beträgt damit rund ${eur(p.implementationGap)}.`,
      "hoch");
    add("einkommen-ausgaben", "einkommen-ausgaben", "Einkommen und Ausgaben",
      "Einkommen und laufende Ausgaben sind die beiden Stellschrauben, die du am ehesten selbst in der Hand hast.",
      "mittel");
    add("zielhoehe-zeit", "zielhoehe-zeit", "Zielhöhe und Zeitraum",
      `Bis zu deinem Zielalter bleiben ${plan.profile.years} Jahre. Mehr Zeit oder ein kleineres Freiheitsbudget verringern die notwendige Rate deutlich.`,
      "mittel");
  }
  if (d.freedRateAfterPayoff > 0 && (d.consumerYearsLeft != null || d.mortgageYearsLeft != null)) {
    const jahre = [d.consumerYearsLeft, d.mortgageYearsLeft].filter((n) => n != null);
    if (jahre.length) {
      add("dynamik", "freie-raten", "Später frei werdende Raten",
        `In rund ${Math.round(Math.min(...jahre))} Jahren endet eine deiner Finanzierungen. Ab dann stehen dir monatlich zusätzliche Mittel zur Verfügung.`,
        "niedrig");
    }
  }
  if (p.implementationGap > 0) {
    add("rendite-risiko", "rendite-risiko", "Rendite- und Risikoszenarien",
      "Eine andere Renditeannahme verändert die Rechnung, nicht die Wirklichkeit. Höhere mögliche Renditen gehen regelmäßig mit stärkeren Schwankungen und Verlustrisiken einher — prüfe deshalb zuerst Einkommen, Ausgaben, Zeit und Zielhöhe.",
      "niedrig");
  }
  add("beratung", "beratung", "Individuelle Prüfung",
    "Ob die Annahmen zu deiner Situation passen und welche Risiken du tragen kannst, lässt sich nur individuell klären.",
    "niedrig");

  const rang = (kat) => {
    const i = FB_BOTTLENECK_ORDER.indexOf(kat);
    return i < 0 ? FB_BOTTLENECK_ORDER.length : i;
  };
  return out
    .map((b, i) => ({ ...b, _i: i }))
    .sort((x, y) => rang(x.kategorie) - rang(y.kategorie) || x._i - y._i)
    .map(({ _i, ...b }) => b);
}

exports.findBottlenecks=findBottlenecks;
exports.FB_STATUS=FB_STATUS;
exports.FB_BOTTLENECK_ORDER=FB_BOTTLENECK_ORDER;

define("freedom-blueprint-scenarios.js",function(module,exports,require){
/**
 * FREEDOM BLUEPRINT — Szenarien und Was-wäre-wenn.

 */
const { calculateFreedomPlan, solveThreshold } = require("freedom-blueprint-engine.js");

/** Grenzen der Zielsuche. Werden im Ergebnis ausgewiesen, nicht still angewandt. */
const FB_SCENARIO_LIMITS = {
  incomeMax: 2000,      // € zusätzliches Nettoeinkommen pro Monat
  expenseCutMax: 0.4,   // Anteil der heutigen Ausgaben
  extraYearsMax: 15,    // zusätzliche Jahre bis zur Freiheit
  returnMin: 3,
  returnMax: 7
};

const num = (n) => (Number.isFinite(Number(n)) ? Number(n) : 0);

/** Ein Delta anwenden und komplett neu rechnen. */
function planWith(input, delta) {
  return calculateFreedomPlan({ ...(input || {}), ...(delta || {}) });
}

/** Die Kennzahlen, die jedes Szenario ausweist. */
function snapshot(plan, label, delta) {
  return {
    label,
    delta: delta || {},
    requiredContribution: plan.plan.requiredContribution,
    availableContribution: plan.plan.availableContribution,
    implementationGap: plan.plan.implementationGap,
    targetCapital: plan.freedomTarget.targetCapital,
    freedomNeed: plan.freedomTarget.freedomNeed,
    coverage: plan.plan.coverage,
    possibleFreedomIncome: plan.plan.possibleFreedomIncome,
    years: plan.profile.years,
    targetAge: plan.profile.targetAge,
    solved: plan.plan.implementationGap <= 1
  };
}

/** Der Rest-Engpass eines Deltas — Grundlage jeder Zielsuche. */
const gapWith = (input, build) => (x) => planWith(input, build(x)).plan.implementationGap - 1;

/* ── Szenario A · So wie heute ─────────────────────────────────────────── */

function scenarioToday(input, base) {
  const plan = base || calculateFreedomPlan(input);
  return {
    id: "A",
    titel: "So wie heute",
    frage: "Was passiert, wenn du nichts veränderst?",
    ergebnis: snapshot(plan, "Unverändert", {}),
    achievableCapital: plan.plan.achievableCapital,
    coverage: plan.plan.coverage,
    possibleFreedomIncome: plan.plan.possibleFreedomIncome,
    reached: plan.plan.reached
  };
}

/* ── Szenario B · Mehr Einkommen ───────────────────────────────────────── */

function scenarioIncome(input, base) {
  const plan = base || calculateFreedomPlan(input);
  const netBase = num(input.net);
  const build = (x) => ({ net: netBase + x });
  const noetig = plan.plan.implementationGap > 0
    ? solveThreshold(gapWith(input, build), 0, FB_SCENARIO_LIMITS.incomeMax)
    : 0;

  const stufen = [100, 250, 500, 1000, 2000]
    .filter((s) => s <= FB_SCENARIO_LIMITS.incomeMax)
    .map((s) => snapshot(planWith(input, build(s)), `+${s} € netto`, build(s)));

  return {
    id: "B",
    titel: "Mehr Einkommen",
    frage: "Was wäre nötig, wenn nur das Einkommen verändert wird?",
    noetig,
    unloesbar: noetig == null,
    grenze: FB_SCENARIO_LIMITS.incomeMax,
    stufen,
    hinweis: noetig == null
      ? `Selbst ${FB_SCENARIO_LIMITS.incomeMax} € zusätzliches Nettoeinkommen im Monat würden die Lücke nicht schließen. Einkommen allein löst dein Ziel nicht.`
      : noetig > 0
        ? `Wenn Einkommen die einzige Stellschraube sein soll, wären rund ${Math.round(noetig / 10) * 10} € zusätzliches monatliches Nettoeinkommen erforderlich.`
        : "Dein Ziel ist bereits ohne zusätzliches Einkommen finanzierbar."
  };
}

/* ── Szenario C · Ausgaben reduzieren ──────────────────────────────────── */

function scenarioExpenses(input, base) {
  const plan = base || calculateFreedomPlan(input);
  const expBase = num(input.expenses);
  const build = (x) => ({ expenses: Math.max(expBase - x, 0) });
  const maxCut = expBase * FB_SCENARIO_LIMITS.expenseCutMax;
  const noetig = plan.plan.implementationGap > 0
    ? solveThreshold(gapWith(input, build), 0, maxCut)
    : 0;

  const stufen = [0.05, 0.1]
    .map((q) => {
      const betrag = Math.round(expBase * q);
      return snapshot(planWith(input, build(betrag)), `−${Math.round(q * 100)} % (${betrag} €)`, build(betrag));
    });

  return {
    id: "C",
    titel: "Ausgaben reduzieren",
    frage: "Was wäre nötig, wenn nur die Ausgaben verändert werden?",
    noetig,
    unloesbar: noetig == null,
    grenze: maxCut,
    stufen,
    // Ausgaben senken wirkt doppelt: mehr Überschuss UND ein kleineres Freiheitsziel,
    // weil der Lebensstandard in der Freiheit an den heutigen Ausgaben hängt.
    hinweis: noetig == null
      ? `Auch eine Reduktion um ${Math.round(FB_SCENARIO_LIMITS.expenseCutMax * 100)} % deiner Ausgaben würde die Lücke nicht schließen.`
      : noetig > 0
        ? `Wenn Einkommen, Zielalter und Renditeannahme unverändert bleiben, müsstest du deine monatlichen Ausgaben rechnerisch um etwa ${Math.round(noetig / 10) * 10} € reduzieren. Weniger Ausgaben wirken doppelt: Es bleibt mehr übrig, und dein Freiheitsziel wird kleiner.`
        : "Dein Ziel ist bereits ohne Ausgabenkürzung finanzierbar.",
    warnung: "Konkrete Sparvorschläge sind hier nicht möglich, weil deine Ausgabenstruktur nicht erfasst wurde."
  };
}

/* ── Szenario D · Mehr Zeit ────────────────────────────────────────────── */

function scenarioTime(input, base) {
  const plan = base || calculateFreedomPlan(input);
  const alterBase = num(input.targetAge);
  const build = (x) => ({ targetAge: alterBase + Math.round(x) });
  const noetig = plan.plan.implementationGap > 0
    ? solveThreshold(gapWith(input, build), 0, FB_SCENARIO_LIMITS.extraYearsMax, { tolerance: 0.5 })
    : 0;
  const jahreNoetig = noetig == null ? null : Math.ceil(noetig);

  const stufen = [2, 5, 10].map((j) =>
    snapshot(planWith(input, build(j)), `Zielalter ${alterBase + j}`, build(j)));

  return {
    id: "D",
    titel: "Mehr Zeit",
    frage: "Was verändert mehr Zeit?",
    noetig: jahreNoetig,
    unloesbar: noetig == null,
    grenze: FB_SCENARIO_LIMITS.extraYearsMax,
    neuesZielalter: jahreNoetig == null ? null : alterBase + jahreNoetig,
    stufen,
    hinweis: noetig == null
      ? `Selbst ${FB_SCENARIO_LIMITS.extraYearsMax} zusätzliche Jahre würden die Lücke nicht schließen.`
      : jahreNoetig > 0
        ? `Mit ${jahreNoetig} zusätzlichen Jahren wäre dein Ziel bei sonst unveränderten Angaben finanzierbar — Freiheit ab Alter ${alterBase + jahreNoetig}.`
        : "Dein Ziel ist bereits im gewünschten Zeitraum finanzierbar."
  };
}

/* ── Szenario E · Rendite und Risiko ───────────────────────────────────── */

function scenarioReturn(input, base) {
  const plan = base || calculateFreedomPlan(input);
  const aktuell = num(input.savingReturn) || 7;

  const varianten = [
    { pct: 3, name: "Defensives Rechenszenario" },
    { pct: 5, name: "Ausgewogenes Rechenszenario" },
    { pct: 7, name: "Wachstumsorientiertes Rechenszenario" }
  ].map((v) => ({
    ...v,
    ergebnis: snapshot(planWith(input, { savingReturn: v.pct, existingReturn: v.pct }),
      `${v.pct} % p. a.`, { savingReturn: v.pct, existingReturn: v.pct })
  }));

  const stress = snapshot(
    planWith(input, { savingReturn: 1, existingReturn: 1 }),
    "Stressfall 1 % p. a.", { savingReturn: 1, existingReturn: 1 }
  );

  const bestes = varianten[varianten.length - 1].ergebnis;
  const reichtNicht = bestes.implementationGap > 1;

  return {
    id: "E",
    titel: "Rendite und Risiko",
    frage: "Was verändert eine andere Renditeannahme?",
    aktuell,
    varianten,
    stress,
    reichtNicht,
    hinweis: reichtNicht
      ? `Selbst im wachstumsorientierten Rechenszenario mit ${varianten[2].pct} % bleibt eine monatliche Umsetzungslücke von rund ${Math.round(bestes.implementationGap / 10) * 10} €. Mehr Risiko allein löst dein Problem daher nicht.`
      : `Mit deiner aktuellen Annahme von ${aktuell} % wird dein Ziel bei unveränderten Einzahlungen ${plan.plan.implementationGap > 1 ? "nicht erreicht" : "erreicht"}. Ein höheres Renditeziel könnte die Lücke rechnerisch verkleinern, ist aber regelmäßig mit stärkeren Schwankungen, Verlustrisiken und Unsicherheit verbunden. Prüfe deshalb zuerst Einkommen, Ausgaben, Zeit und Zielhöhe.`,
    risikohinweis: "Renditen sind Annahmen und keine Garantie. Höhere mögliche Renditen gehen regelmäßig mit stärkeren Schwankungen und Verlustrisiken einher. Ob eine höhere Risikostruktur zu dir passt, sollte individuell geprüft werden.",
    keineEmpfehlung: true
  };
}

/* ── Was jeder Wunsch kostet ───────────────────────────────────────────────
   Die Wunschbudgets senken den freien Überschuss und heben zugleich den Freiheitsbedarf.
   Beides steht bisher nur in den Zahlen. Der Satz, der daraus wird — „deine 150 € für
   Reisen kosten dich rechnerisch drei Jahre Freiheit" — ist der eigentliche Zielkonflikt.

   Gerechnet, nicht geschätzt: Für jeden Wunsch wird das früheste Freiheitsalter mit und
   ohne ihn gesucht. Die Differenz ist sein Preis in Jahren. */

const WUNSCH_FELDER = [
  { feld: "wishTravel", bereich: "reisen", label: "Reisen" },
  { feld: "wishMobility", bereich: "mobilitaet", label: "Mobilität" },
  { feld: "wishEducation", bereich: "bildung", label: "Bildung" },
  { feld: "wishNetwork", bereich: "netzwerk", label: "Netzwerk" },
  { feld: "wishContribution", bereich: "beitrag", label: "Beitrag" }
];

/**
 * Frühestes Freiheitsalter, bei dem die Umsetzungslücke geschlossen ist.
 * Gibt null zurück, wenn selbst mit 99 keine Lösung entsteht.
 */
function fruehestesFreiheitsalter(input) {
  const age = num(input.age);
  const von = Math.max(age + 1, 1);
  const bis = 99;
  const luecke = (alter) => planWith(input, { targetAge: Math.round(alter) }).plan.implementationGap - 1;
  // Ganze Jahre genügen — eine Nachkommastelle beim Alter wäre Scheingenauigkeit.
  const treffer = solveThreshold(luecke, von, bis, { steps: 12, tolerance: 0.9 });
  return treffer == null ? null : Math.round(treffer);
}

/**
 * Der Preis jedes Wunsches in Jahren Freiheit.
 * Nur für Wünsche mit spürbarem Budget — unter 25 € im Monat ist die Aussage Rauschen.
 */
function wishTradeoffs(input) {
  const gesetzt = WUNSCH_FELDER.filter((w) => num(input[w.feld]) >= 25);
  if (!gesetzt.length) return [];

  const mitAllen = fruehestesFreiheitsalter(input);
  return gesetzt.map((w) => {
    const ohne = fruehestesFreiheitsalter({ ...input, [w.feld]: 0 });
    const jahre = (mitAllen != null && ohne != null) ? mitAllen - ohne : null;
    return {
      bereich: w.bereich,
      label: w.label,
      budget: num(input[w.feld]),
      fruehestesMit: mitAllen,
      fruehestesOhne: ohne,
      jahreFrueher: jahre,
      text: jahre == null
        ? `Ob ${w.label} dein Freiheitsdatum verschiebt, lässt sich mit deinen Angaben nicht bestimmen.`
        : jahre <= 0
          ? `Deine ${Math.round(num(input[w.feld]))} € für ${w.label} verschieben dein Freiheitsdatum rechnerisch nicht.`
          : `Deine ${Math.round(num(input[w.feld]))} € für ${w.label} kosten dich rechnerisch ${jahre} ${jahre === 1 ? "Jahr" : "Jahre"} Freiheit.`
    };
  });
}

/** Alle Szenarien A bis E in fester Reihenfolge. */
function buildScenarios(input, base) {
  const plan = base || calculateFreedomPlan(input);
  return [
    scenarioToday(input, plan),
    scenarioIncome(input, plan),
    scenarioExpenses(input, plan),
    scenarioTime(input, plan),
    scenarioReturn(input, plan)
  ];
}


exports.default=({ buildScenarios, planWith, wishTradeoffs, fruehestesFreiheitsalter, FB_SCENARIO_LIMITS });

exports.planWith=planWith;
exports.scenarioToday=scenarioToday;
exports.scenarioIncome=scenarioIncome;
exports.scenarioExpenses=scenarioExpenses;
exports.scenarioTime=scenarioTime;
exports.scenarioReturn=scenarioReturn;
exports.fruehestesFreiheitsalter=fruehestesFreiheitsalter;
exports.wishTradeoffs=wishTradeoffs;
exports.buildScenarios=buildScenarios;
exports.FB_SCENARIO_LIMITS=FB_SCENARIO_LIMITS;

});
define("freedom-blueprint-routes.js",function(module,exports,require){
/**
 * FREEDOM BLUEPRINT — automatisch berechnete Lösungsrouten (Szenario F).
 *
 * Eine Route ist eine KOMBINATION mehrerer Stellschrauben, die so weit hochgedreht wird,
 * bis die Umsetzungslücke geschlossen ist. Der Punkt, an dem das geschieht, wird per
 * Zielsuche bestimmt — die Routen sind gerechnet, nicht getextet.
 *
 * Wenn eine Route auch bei vollem Hebel nicht schließt, wird das ausgewiesen und nicht
 * beschönigt. Die Deckelungen stehen im Ergebnis, damit niemand eine stille Kürzung
 * für ein Ergebnis hält.
 *
 * Fachliche Herleitung: docs/freedom-blueprint/01_FACHKONZEPT.md, Abschnitt 6.2.
 */
const { calculateFreedomPlan, solveThreshold } = require("freedom-blueprint-engine.js");
const { FB_SCENARIO_LIMITS } = require("freedom-blueprint-scenarios.js");

const num = (n) => (Number.isFinite(Number(n)) ? Number(n) : 0);
const round10 = (n) => Math.round((Number(n) || 0) / 10) * 10;

/**
 * Die drei Routen. `mix(t, basis)` bildet die Intensität t auf ein Eingabe-Delta ab.
 * t läuft von 0 (nichts verändert) bis tMax (voller Hebel).
 */
const ROUTEN = [
  {
    id: "ausgewogen",
    titel: "Deine ausgewogene Route",
    beschreibung: "Die Lücke verteilt sich auf Einkommen, Ausgaben und Zeit.",
    tMax: 1,
    mix: (t, b) => ({
      net: b.net + t * 800,
      expenses: Math.max(b.expenses - t * b.expenses * 0.2, 0),
      targetAge: b.targetAge + Math.round(t * 5)
    })
  },
  {
    id: "alltag",
    titel: "Deine Route mit möglichst wenig Veränderung im Alltag",
    beschreibung: "Ausgaben bleiben wie heute. Es wirken vor allem Zeit und eine jährlich steigende Sparrate.",
    tMax: 2,
    // Erste Hälfte: nur Zeit und Dynamik. Reicht das nicht, kommt Einkommen dazu.
    mix: (t, b) => ({
      savingIncrease: Math.max(num(b.savingIncrease), 3),
      targetAge: b.targetAge + Math.round(Math.min(t, 1) * FB_SCENARIO_LIMITS.extraYearsMax),
      net: b.net + Math.max(t - 1, 0) * FB_SCENARIO_LIMITS.incomeMax
    })
  },
  {
    id: "frueh",
    titel: "Deine Route mit Fokus auf frühe Freiheit",
    beschreibung: "Das Zielalter bleibt. Die Lücke wird über Einkommen und Ausgaben geschlossen, im Verhältnis zwei zu eins.",
    tMax: 1,
    mix: (t, b) => ({
      net: b.net + t * FB_SCENARIO_LIMITS.incomeMax,
      expenses: Math.max(b.expenses - t * b.expenses * FB_SCENARIO_LIMITS.expenseCutMax, 0)
    })
  }
];

/** Was sich gegenüber den Ausgangsangaben tatsächlich ändert — für die Anzeige. */
function veraenderungen(basis, delta) {
  const out = [];
  const dNet = Math.round(num(delta.net) - num(basis.net));
  const dExp = Math.round(num(basis.expenses) - num(delta.expenses));
  const dAge = Math.round(num(delta.targetAge) - num(basis.targetAge));
  const dInc = num(delta.savingIncrease) - num(basis.savingIncrease);

  if (dNet >= 10) out.push({ hebel: "einkommen", text: `${round10(dNet)} € mehr monatliches Nettoeinkommen`, wert: dNet });
  if (dExp >= 10) out.push({ hebel: "ausgaben", text: `${round10(dExp)} € geringere monatliche Ausgaben`, wert: dExp });
  if (dAge >= 1) out.push({ hebel: "zeit", text: `Zielalter um ${dAge} ${dAge === 1 ? "Jahr" : "Jahre"} verschieben`, wert: dAge });
  if (dInc >= 0.5) out.push({ hebel: "dynamik", text: `Sparrate jährlich um ${dInc} % erhöhen`, wert: dInc });
  return out;
}

/** Eine einzelne Route rechnen. */
function buildRoute(input, def) {
  const basis = {
    net: num(input.net), expenses: num(input.expenses),
    targetAge: num(input.targetAge), savingIncrease: num(input.savingIncrease)
  };
  const planFor = (t) => calculateFreedomPlan({ ...input, ...def.mix(t, basis) });
  const rest = (t) => planFor(t).plan.implementationGap - 1;

  const t = solveThreshold(rest, 0, def.tMax, { tolerance: 0.002 });
  const geloest = t != null;
  const tEnd = geloest ? t : def.tMax;
  const delta = def.mix(tEnd, basis);
  const plan = calculateFreedomPlan({ ...input, ...delta });

  return {
    id: def.id,
    titel: def.titel,
    beschreibung: def.beschreibung,
    geloest,
    veraenderungen: veraenderungen(basis, { ...basis, ...delta }),
    delta,
    freiheitsbeitrag: plan.plan.requiredContribution,
    verfuegbar: plan.plan.availableContribution,
    restluecke: plan.plan.implementationGap,
    zielkapital: plan.freedomTarget.targetCapital,
    zielalter: plan.profile.targetAge,
    jahre: plan.profile.years,
    renditeannahme: plan.assumptions.savingReturnNominal,
    hinweis: geloest
      ? `Mit dieser Kombination wären monatlich rund ${round10(plan.plan.requiredContribution)} € für deinen Freiheitsplan nötig — das liegt innerhalb dessen, was dir dann zur Verfügung stünde.`
      : `Auch bei vollem Hebel bleibt auf dieser Route eine Lücke von rund ${round10(plan.plan.implementationGap)} € im Monat. Diese Route allein trägt dein Ziel nicht.`,
    grenzen: {
      einkommenMax: FB_SCENARIO_LIMITS.incomeMax,
      ausgabenMaxAnteil: FB_SCENARIO_LIMITS.expenseCutMax,
      jahreMax: FB_SCENARIO_LIMITS.extraYearsMax
    }
  };
}

/**
 * Alle Routen. `preferences` stammt aus dem Coaching-Dialog und verändert ausschließlich
 * die REIHENFOLGE — niemals die Mathematik.
 *
 *   preferences.lever = "einkommen" | "ausgaben" | "zeit" | "budget" | "kombi" | "unklar"
 *   preferences.pace  = "vorsichtig" | "ausgewogen" | "ambitioniert" | "beratung"
 */
function buildRoutes(input, preferences) {
  // Ohne Umsetzungslücke gibt es nichts zu schließen. Trotzdem „Wege" anzubieten, auf
  // denen sich nichts ändert und die 0 € kosten, wäre eine Scheinauswahl — und für jemanden,
  // dessen Ziel bereits finanziert ist, schlicht verwirrend.
  if (calculateFreedomPlan(input).plan.implementationGap <= 1) return [];

  const alle = ROUTEN.map((def) => buildRoute(input, def));
  const pref = preferences || {};

  const punkte = (r) => {
    let p = 0;
    if (r.geloest) p += 100;
    if (pref.pace === "vorsichtig" && r.id === "alltag") p += 20;
    if (pref.pace === "ambitioniert" && r.id === "frueh") p += 20;
    if (pref.pace === "ausgewogen" && r.id === "ausgewogen") p += 20;
    if (pref.lever === "zeit" && r.id === "alltag") p += 15;
    if (pref.lever === "einkommen" && r.id === "frueh") p += 15;
    if (pref.lever === "ausgaben" && r.id === "frueh") p += 10;
    if (pref.lever === "kombi" && r.id === "ausgewogen") p += 15;
    // Weniger Eingriffe in den Alltag gelten bei Gleichstand als naheliegender.
    p -= r.veraenderungen.length;
    return p;
  };

  const sortiert = alle.sort((a, b) => punkte(b) - punkte(a));

  // Bei kleiner Lücke laufen zwei Mischungen auf dieselben Veränderungen hinaus. Dreimal
  // dasselbe als „drei Wege" anzubieten wäre eine Scheinauswahl — also einmal zeigen.
  const gesehen = new Set();
  return sortiert.filter((r) => {
    const signatur = r.veraenderungen.map((v) => `${v.hebel}:${Math.round(v.wert)}`).join("|")
      + `@${r.zielalter}`;
    if (gesehen.has(signatur)) return false;
    gesehen.add(signatur);
    return true;
  });
}


exports.default=({ buildRoutes, buildRoute });

exports.buildRoute=buildRoute;
exports.buildRoutes=buildRoutes;

});

  /* ── 13 · Zielalter zu nah ─────────────────────────────────────────── */
  if (plan.profile.years > 0 && plan.profile.years < 10 && p.remainingCapital > 0) {

      id: "zeit-knapp",
      ausloeser: "years < 10 bei offenem Kapitalbedarf",
      prioritaet: FB_COACH_PRIORITY.zeit + 1,
      kategorie: "zeit",

      begruendung: "Bei kurzen Zeiträumen trägt fast ausschließlich die Einzahlung, der Zinseszins kaum.",

      zeitraum: `${plan.profile.years} Jahre`
    }));

  if (plan.bridgePhase.exists) {

      id: "bruecke",
      ausloeser: "Freiheitsalter vor Beginn der späteren Einkünfte",
      prioritaet: FB_COACH_PRIORITY.zeit + 2,
      kategorie: "zeit",
      titel: "Dein Plan besteht aus zwei Phasen",
      text: `Von ${bp.fromAge} bis ${bp.toAge} musst du deinen Lebensunterhalt überwiegend aus eigenem Kapital finanzieren. Ab ${bp.toAge} reduzieren deine gesetzliche und private Rente die notwendige Entnahme auf rund ${eur(bp.monthlyNeedAfter)} im Monat.`,
      begruendung: `Die Überbrückung dauert ${bp.years} Jahre. Allein dafür ist ein Kapital von etwa ${eurK(plan.freedomTarget.bridgeCapital)} nötig.`,
      handlung: "Wenn diese Phase zu teuer wird, ist ein späteres Freiheitsalter der stärkste Hebel.",

      ausloeser: "Restlaufzeit einer Finanzierung bekannt",
      prioritaet: FB_COACH_PRIORITY.dynamik,

      titel: "In einigen Jahren wird Geld frei",

      begruendung: "Eine auslaufende Rate ist bereits eingeplantes Geld — sie muss nicht neu erarbeitet werden.",
      handlung: "Leg heute fest, wohin dieser Betrag später fließen soll, bevor er sich im Alltag verteilt.",
      betrag: d.freedRateAfterPayoff,
      zeitraum: `${Math.round(naechste)} Jahre`
    }));
  }

  if (a.homeEquity > 0 && a.homePlan !== "sell") {
    out.push(msg({
      id: "eigenheim-gebunden",
      ausloeser: "homeEquity > 0 && homePlan !== sell",
      prioritaet: FB_COACH_PRIORITY.ueberschuss + 2,
      kategorie: "vermoegen",
      titel: "Dein Eigenheim zählt nicht als Freiheitskapital",
      text: `${eurK(a.homeEquity)} Eigenkapital stecken in deinem Zuhause, das du behalten möchtest. Dieses Geld wurde nicht als Freiheitskapital angerechnet.`,
      begruendung: "Aus dem eigenen Dach über dem Kopf lässt sich keine monatliche Entnahme finanzieren. Es wirkt anders: Wenn es abbezahlt ist, sinkt dein Bedarf, weil die Miete wegfällt.",
      handlung: "Wenn du später verkaufen oder verkleinern willst, trag das im Bereich Wohnen ein. Sonst plane die eingesparte Miete bei den Ausgaben ein, die später wegfallen.",
      betrag: a.homeEquity
    }));
  }

  /* ── 16b · Vermietetes Objekt behalten ─────────────────────────────── */
  if (a.rentalEquity > 0 && a.rentalPlan !== "sell") {
    const miete = (plan.futureIncome.sources.find((s) => s.id === "realEstateRent") || {}).amount || 0;
    out.push(msg({
      id: "vermietung-behalten",
      ausloeser: "rentalEquity > 0 && rentalPlan !== sell",
      prioritaet: FB_COACH_PRIORITY.ueberschuss + 2,
      kategorie: "vermoegen",
      titel: miete > 0 ? "Deine Mieteinnahmen sind eingerechnet" : "Deine Mieteinnahmen fehlen noch",
      text: miete > 0
        ? `${eurK(a.rentalEquity)} Eigenkapital stecken in vermieteten Objekten, die du behalten möchtest. Das Kapital selbst zählt nicht mit, aber ${eur(miete)} Miete im Monat sind als spätere Einnahme eingerechnet.`
        : `${eurK(a.rentalEquity)} Eigenkapital stecken in vermieteten Objekten, die du behalten möchtest. Eine Mieteinnahme hast du bisher nicht eingetragen, deshalb taucht davon nichts in der Rechnung auf.`,
      begruendung: "Bei einer Immobilie, die du behältst, ist nicht der Wert entscheidend, sondern was sie dir Monat für Monat einbringt.",
      handlung: miete > 0
        ? "Prüfe, ob der Betrag netto gerechnet ist, also nach Verwaltung, Rücklage und Steuern."
        : "Trag im Bereich Wohnen ein, welche Miete nach Kosten übrig bleibt und ab welchem Alter du damit rechnest.",
      betrag: miete > 0 ? miete : a.rentalEquity
    }));
  }

  /* ── 17 · Ziel erreichbar ──────────────────────────────────────────── */
  if (feasibility && feasibility.status === FB_STATUS.GRUEN) {
    out.push(msg({
      id: "erreichbar",
      ausloeser: "Status grün",
      prioritaet: FB_COACH_PRIORITY.ueberschuss,
      kategorie: "ueberschuss",
      titel: "Dein Überschuss reicht",
      text: `Dein heutiger Überschuss reicht rechnerisch aus. Entscheidend ist jetzt nicht mehr die Mathematik, sondern die konsequente Umsetzung von rund ${eur(p.requiredContribution)} im Monat.`,
      begruendung: "Zwischen einer machbaren Rate und einer tatsächlich fließenden Rate liegt in der Praxis der größte Teil der Wegstrecke.",
      handlung: "Richte einen Dauerauftrag am Gehaltstag ein, nicht am Monatsende.",
      betrag: p.requiredContribution
    }));
  }

  /* ── 18 · Kapital reicht bereits ───────────────────────────────────── */
  if (feasibility && feasibility.status === FB_STATUS.BLAU) {
    out.push(msg({
      id: "kapital-reicht",
      ausloeser: "Status blau",
      prioritaet: FB_COACH_PRIORITY.ueberschuss,
      kategorie: "vermoegen",
      titel: "Rechnerisch bist du da",
      text: `Dein verfügbares Kapital von ${eurK(a.investable)} könnte dein Ziel unter den gewählten Annahmen bereits finanzieren. Prüfe jetzt vor allem Liquidität, Entnahmestruktur, Risiken und die Verfügbarkeit der einzelnen Vermögenswerte.`,
      begruendung: "Ein rechnerisch gedecktes Ziel sagt nichts darüber, ob das Kapital im richtigen Moment verfügbar ist.",
      handlung: "Prüfe deine Annahmen einmal im Jahr und lass die Entnahmestruktur fachlich gegenrechnen.",
      betrag: a.investable,
      grenze: "Steuern und Produktkosten sind in dieser Rechnung nicht enthalten und verringern die tatsächlich verfügbare Entnahme."
    }));
  }

  /* ── 19 · Übergang in die Beratung ─────────────────────────────────── */
  out.push(msg({
    id: "beratung",
    ausloeser: "immer",
    prioritaet: FB_COACH_PRIORITY.beratung,
    kategorie: "beratung",
    titel: "Wo eine individuelle Prüfung sinnvoll ist",
    text: "Du kennst jetzt deine Richtung. Ein qualifizierter Finanzberater kann mit dir prüfen, ob die Annahmen zu deiner Situation passen, welche Risiken du tragen kannst und wie aus der Modellrechnung eine konkrete Umsetzung wird.",
    begruendung: "Dieses Tool rechnet mit Annahmen. Deine Verträge, deine Steuersituation und deine Risikotragfähigkeit kennt es nicht.",
    handlung: "Nimm deinen Blueprint als Gesprächsgrundlage mit.",
    hinweis: disclosure("keine-produktempfehlung").text
  }));

  return out.sort((x, y) => x.prioritaet - y.prioritaet);
}

define("freedom-blueprint-milestones.js",function(module,exports,require){
/**
 * FREEDOM BLUEPRINT — Meilensteine und zeitliche Umsetzung.
 *
 * Zwei Dinge: die langfristigen Meilensteine mit Zielwert, heutigem Stand und — nur wenn
 * mathematisch ableitbar — einem Datum. Und der 90-Tage-Plan, der aus der tatsächlichen
 * Situation entsteht und keine Aufgaben zeigt, die für diesen Menschen irrelevant sind.
 *
 * GRUNDREGEL: Ein Datum wird nur genannt, wenn es sich aus Kapital, Rate und Rendite
 * ergibt. Sonst steht dort „noch nicht bestimmbar" — das ist ehrlicher als eine Zahl.
 */
const { futureValueGrowing } = require("freedom-blueprint-engine.js");

const round10 = (n) => Math.round((Number(n) || 0) / 10) * 10;
const round1k = (n) => Math.round((Number(n) || 0) / 1000) * 1000;
const eur = (n) => `${round10(n).toLocaleString("de-DE")} €`;
const eurK = (n) => `${round1k(n).toLocaleString("de-DE")} €`;
/**
 * Beträge unter 10.000 € auf 10 €, darüber auf 1.000 € runden.
 * Ein Notgroschen von 1.500 € darf nicht als „2.000 €" erscheinen — bei kleinen Summen
 * ist die grobe Rundung keine Vermeidung von Scheingenauigkeit, sondern ein falscher Wert.
 */
const betrag = (n) => (Math.abs(Number(n) || 0) < 10000 ? eur(n) : eurK(n));

/**
 * Jahre, bis das Kapital einen Zielwert erreicht — mit vorhandenem Kapital, laufender Rate
 * und Renditeannahme. Gibt null zurück, wenn es mit der heutigen Rate nie erreicht wird.
 */
function yearsToCapital(target, plan, maxYears = 60) {
  const start = plan.assets.investable;
  const pmt = plan.plan.availableContribution;
  const rE = plan.assumptions.existingReturn;
  const rS = plan.assumptions.savingReturn;
  const inc = plan.assumptions.savingIncrease;
  if (target <= start) return 0;
  if (pmt <= 0 && rE <= 0) return null;

  const kapitalNach = (j) =>
    start * Math.pow(Math.max(1 + rE / 100, 1e-6), j) + futureValueGrowing(pmt, j, rS, inc);

  if (kapitalNach(maxYears) < target) return null;
  let lo = 0;
  let hi = maxYears;
  for (let k = 0; k < 60 && hi - lo > 0.02; k++) {
    const m = (lo + hi) / 2;
    if (kapitalNach(m) >= target) hi = m; else lo = m;
  }
  return hi;
}

/** Aus Jahren ein Jahr machen — `now` ist übergebbar, damit Tests reproduzierbar bleiben. */
function jahrIn(jahre, now) {
  if (jahre == null) return null;
  const basis = (now instanceof Date ? now : new Date()).getFullYear();
  return basis + Math.round(jahre);
}

/**
 * Die persönlichen Meilensteine. Jeder trägt Zielwert, heutigen Stand, geplantes Datum
 * und die nächste Handlung. Erreichte Meilensteine bleiben sichtbar — sie zeigen Fortschritt.
 */
function buildMilestones(plan, { now } = {}) {
  const a = plan.assets;
  const d = plan.debts;
  const p = plan.plan;
  const ziel = plan.freedomTarget.targetCapital;
  const ausgaben = plan.currentSituation.expenses;
  const entnahme = plan.assumptions.withdrawal;
  const out = [];

  const kapitalFuerPassiv = (anteil) => entnahme > 0
    ? (anteil * ausgaben * 12) / (entnahme / 100) : null;

  const add = (o) => {
    const jahre = o.erreicht ? 0 : (o.jahre !== undefined ? o.jahre : yearsToCapital(o.zielwert, plan));
    out.push({
      id: o.id,
      titel: o.titel,
      zielwert: o.zielwert,
      zielwertText: o.zielwertText || betrag(o.zielwert),
      stand: o.stand,
      standText: o.standText || betrag(o.stand),
      anteil: o.zielwert > 0 ? Math.min(o.stand / o.zielwert, 1) : 0,
      erreicht: !!o.erreicht,
      jahre: jahre,
      jahr: o.erreicht ? null : jahrIn(jahre, now),
      datumBestimmbar: o.erreicht || jahre != null,
      naechsteHandlung: o.handlung
    });
  };

  add({
    id: "notgroschen",
    titel: "Notgroschen vollständig",
    zielwert: a.emergencyTarget,
    stand: a.reserve,
    erreicht: a.reserve >= a.emergencyTarget,
    // Der Notgroschen wächst aus dem Überschuss, nicht aus der Rendite.
    jahre: a.reserve >= a.emergencyTarget ? 0
      : (p.availableContribution > 0 ? a.reserveShortfall / p.availableContribution / 12 : null),
    handlung: a.reserve >= a.emergencyTarget
      ? "Halte den Puffer auf einem getrennten Konto und rühre ihn nur im Ernstfall an."
      : `Noch ${eur(a.reserveShortfall)} auf ein getrenntes Konto legen.`
  });

  if (d.consumer > 0) {
    add({
      id: "konsumschulden",
      titel: "Konsumschulden abgebaut",
      zielwert: d.consumer,
      zielwertText: "vollständig getilgt",
      stand: 0,
      standText: `noch ${eurK(d.consumer)} offen`,
      erreicht: false,
      jahre: d.consumerYearsLeft,
      handlung: d.consumerYearsLeft == null
        ? "Trag Rate und Zinssatz deiner Schulden ein, damit das Ende der Laufzeit berechenbar wird."
        : `Bei ${eur(d.consumerRate)} monatlich und ${d.consumerInterest} % Zins läuft die Finanzierung noch rund ${Math.round(d.consumerYearsLeft)} Jahre.`
    });
  }

  add({
    id: "erste-10k",
    titel: "Erste 10.000 € investierbares Kapital",
    zielwert: 10000,
    stand: a.investable,
    erreicht: a.investable >= 10000,
    handlung: a.investable >= 10000
      ? "Erledigt. Der nächste Schritt ist Regelmäßigkeit, nicht Höhe."
      : "Automatisiere den ersten Betrag, auch wenn er klein ist."
  });

  for (const q of [0.25, 0.5, 0.75]) {
    add({
      id: `ziel-${Math.round(q * 100)}`,
      titel: `${Math.round(q * 100)} % des Zielkapitals`,
      zielwert: ziel * q,
      stand: a.investable,
      erreicht: a.investable >= ziel * q,
      handlung: `Zwischenstand auf dem Weg zu ${eurK(ziel)}.`
    });
  }

  for (const q of [0.25, 0.5]) {
    const kap = kapitalFuerPassiv(q);
    if (kap == null) continue;
    add({
      id: `passiv-${Math.round(q * 100)}`,
      titel: `Passive Einkünfte decken ${Math.round(q * 100)} % deiner Ausgaben`,
      zielwert: kap,
      stand: a.investable,
      erreicht: a.investable >= kap,
      handlung: `Dafür ist bei ${entnahme} % Entnahme ein Kapital von rund ${eurK(kap)} nötig.`
    });
  }

  add({
    id: "freiheit",
    titel: "Freiheitsziel erreicht",
    zielwert: ziel,
    stand: a.investable,
    erreicht: p.reached,
    handlung: p.reached
      ? "Jetzt zählen Entnahmestruktur, Liquidität und eine jährliche Überprüfung."
      : `Dafür fehlen dir aus heutiger Sicht noch ${eurK(p.remainingCapital)}.`
  });

  return out;
}

/**
 * Der 90-Tage-Plan. Jeder Schritt hat einen Auslöser — es erscheint nichts, was zur
 * Situation dieses Menschen nicht passt. Wenn ein Block dadurch leer bliebe, wird er mit
 * einer echten, zur Lage passenden Aufgabe gefüllt, nicht mit einer Floskel.
 */
function buildActionPlan(plan, { feasibility, quality } = {}) {
  const a = plan.assets;
  const c = plan.monthlyCashflow;
  const d = plan.debts;
  const p = plan.plan;
  const prot = plan.protection;

  const tage7 = [];
  const tage30 = [];
  const tage90 = [];
  const monate12 = [];

  /* ── 7 Tage — sehen, was ist ─────────────────────────────────────────── */
  // Der wichtigste Schritt und zugleich der schwerste. Deshalb steht hier, WIE es geht —
  // und der Hinweis, dass es dafür ein eigenes Werkzeug gibt.
  tage7.push({
    text: plan.currentSituation.expensesAbgeleitet
      ? "Deine tatsächlichen Monatsausgaben einmal ermitteln — bisher sind sie nur abgeleitet."
      : "Deine tatsächlichen Monatsausgaben der letzten drei Monate prüfen.",
    grund: "Der geschätzte Wert weicht fast immer ab, und alles Weitere hängt daran. "
      + "Am schnellsten geht es über die Kontoauszüge dreier Monate. Wer es genauer will, "
      + "nimmt dafür ein Haushaltsbuch — in der Finanz-Suite ist genau das der nächste Schritt."
  });
  if (quality && quality.missing.length) {
    tage7.push({ text: `Fehlende Angaben ergänzen: ${quality.missing.join(", ")}.`, grund: "Ohne sie bleibt die Auswertung eine vorläufige Orientierung." });
  }
  if (a.reserve < a.emergencyTarget) {
    tage7.push({ text: "Ein getrenntes Konto für den Notgroschen einrichten.", grund: "Getrenntes Geld wird seltener ausgegeben." });
  }
  tage7.push({ text: "Renteninformation, Versicherungsunterlagen und Depotauszüge an einem Ort sammeln.", grund: "Was auffindbar ist, kann geprüft werden." });

  // Die erste Rate ist nie höher als nötig. Wer sein Ziel bereits finanziert hat, bekommt

  const ersteRate = Math.min(p.availableContribution, p.requiredContribution);
  if (c.grossSurplus < 0) {
    tage30.push({ text: `Den negativen Spielraum von rund ${eur(Math.abs(c.grossSurplus))} schließen, bevor investiert wird.`, grund: "Ohne Überschuss trägt kein Plan." });
  } else if (ersteRate >= 10) {
    tage30.push({ text: `${eur(ersteRate)} monatlich per Dauerauftrag automatisieren — am Gehaltstag, nicht am Monatsende.`, grund: "Automatisierte Beträge überstehen schwache Monate." });
  } else if (p.reached) {
    tage30.push({ text: "Klären, aus welchen Töpfen die Entnahme später kommen soll und in welcher Reihenfolge.", grund: "Ab jetzt entscheidet nicht mehr das Ansparen, sondern die Struktur der Entnahme." });
    tage30.push({ text: `Liquidität für die ersten Jahre der Freiheit getrennt halten, statt alles investiert zu lassen.`, grund: "Wer im falschen Moment verkaufen muss, verliert mehr als jede Rendite bringt." });
  }
  if (p.implementationGap > 0) {
    tage30.push({ text: `Prüfen, wie die fehlenden ${eur(p.implementationGap)} entstehen können — über Einkommen, Ausgaben, Zeit oder eine Kombination.`, grund: "Das ist die eigentliche Entscheidung deines Blueprints." });
  }
  if (d.expensiveDebt) {
    tage30.push({ text: `Die Konsumschuld mit ${d.consumerInterest} % Zins gegen deine Renditeannahme rechnen.`, grund: "Ersparte Zinsen sind sicher, erwartete Renditen nicht." });
  }
  if (prot.bu !== "yes") {
    tage30.push({ text: "Absicherung der Arbeitskraft fachlich prüfen lassen.", grund: "Dein Einkommen finanziert diesen ganzen Plan." });
  }

  /* ── 90 Tage — die gewählte Route in Gang setzen ─────────────────────── */
  if (p.implementationGap > 0) {
    tage90.push({ text: "Die gewählte Route beginnen: Gehaltsgespräch vorbereiten, zusätzliche Einnahmequelle starten oder das Monatsbudget dauerhaft anpassen.", grund: "Eine Route, die nicht begonnen wird, verändert nichts." });
  }
  if (p.availableContribution > 0 && p.implementationGap > 0) {
    tage90.push({ text: `Sparrate auf den ersten Zielbetrag von ${eur(p.availableContribution)} bringen und dort halten.`, grund: "Ein tragfähiger Betrag schlägt einen ehrgeizigen." });
  }
  if (p.reached) {
    tage90.push({ text: "Die Tragfähigkeit über die gesamte Entnahmephase fachlich durchrechnen lassen, nicht nur bis zum Freiheitsjahr.", grund: "Ein Kapital, das heute reicht, muss auch dreißig Jahre Entnahme aushalten." });
    tage90.push({ text: "Prüfen, welche Vermögenswerte im Ernstfall wirklich kurzfristig verfügbar sind.", grund: "Rechnerisch verfügbar und tatsächlich verfügbar sind nicht dasselbe." });
  }
  if (a.reserve < a.emergencyTarget) {
    tage90.push({ text: `Notgroschen auf ${eurK(a.emergencyTarget)} auffüllen.`, grund: "Drei Monatsausgaben sind die Grenze, ab der ein Rückschlag den Plan nicht mehr beendet." });
  }
  tage90.push({ text: "Die passende Risikostruktur fachlich klären, bevor größere Beträge fließen.", grund: "Welches Risiko zu dir passt, entscheidet nicht die Rechnung." });
  tage90.push({ text: "Ersten Blueprint-Review durchführen.", grund: "Nach drei Monaten zeigt sich, ob die Rate im Alltag hält." });

  /* ── 12 Monate — nachziehen ──────────────────────────────────────────── */
  monate12.push({ text: "Einkommen, Ausgaben und Vermögen aktualisieren und den Blueprint neu rechnen.", grund: "Alle drei Größen verändern sich schneller als das Ziel." });
  monate12.push({ text: `Fortschritt mit dem Sollwert vergleichen: erwartet wären nach einem Jahr rund ${eurK(a.investable + ersteRate * 12)}.`, grund: "Ein Sollwert macht Abweichung sichtbar, bevor sie groß wird." });
  if (p.implementationGap > 0) {
    monate12.push({ text: "Sparrate erhöhen, sobald Einkommen steigt oder eine Rate ausläuft.", grund: "Steigerungen aus neuem Geld tun im Alltag am wenigsten weh." });
  }
  monate12.push({ text: "Ziel und Annahmen überprüfen — Zielalter, Freiheitsbudget, Renditeannahme.", grund: "Ein Ziel, das nie überprüft wird, war nie eine Entscheidung." });

  return [
    { id: "tage7", titel: "In den nächsten 7 Tagen", schritte: tage7 },
    { id: "tage30", titel: "In den nächsten 30 Tagen", schritte: tage30 },
    { id: "tage90", titel: "In den nächsten 90 Tagen", schritte: tage90 },
    { id: "monate12", titel: "In 12 Monaten", schritte: monate12 }
  ];
}


exports.default=({ buildMilestones, buildActionPlan, yearsToCapital });

exports.yearsToCapital=yearsToCapital;
exports.buildMilestones=buildMilestones;

define("freedom-blueprint-plan.js",function(module,exports,require){
/**
 * FREEDOM BLUEPRINT — das vollständige Ergebnisobjekt.
 *
 * Diese Datei rechnet selbst nichts. Sie ruft die Bausteine in der richtigen Reihenfolge
 * auf und setzt daraus genau die Struktur zusammen, die §22 des Entwicklungsauftrags
 * verlangt. Ein einziger Einstiegspunkt für Cockpit, Auswertung, PDF und Beraterübergabe —
 * damit alle vier dieselben Zahlen sehen.
 *
 *   buildFreedomBlueprint(input, options) → { profile, vision, …, calculationMeta }
 */
const { calculateFreedomPlan, FB_ENGINE_VERSION, euro } = require("freedom-blueprint-engine.js");
const { toPlanInput } = require("freedom-blueprint-state.js");
const { assessFeasibility, findBottlenecks } = require("freedom-blueprint-feasibility.js");
const { buildScenarios, wishTradeoffs } = require("freedom-blueprint-scenarios.js");
const { buildRoutes } = require("freedom-blueprint-routes.js");
const { buildCoaching } = require("freedom-blueprint-coach.js");
const { buildMilestones, buildActionPlan } = require("freedom-blueprint-milestones.js");
const { disclosuresForResult } = require("freedom-blueprint-disclosures.js");

const hat = (v) => v !== undefined && v !== null && String(v).trim() !== "";
const zahl = (v) => { const n = Number(v); return Number.isFinite(n) ? n : null; };

/* ── Datenqualität (Fachkonzept §7) ──────────────────────────────────────
   Ohne diese Prüfung würde die Engine aus Standardannahmen scheinbar präzise Sätze
   bauen. Der Vertrauensstatus steuert, wie bestimmt formuliert werden darf. */

/** Pflichtangaben. Fehlt eine davon, ist keine belastbare Aussage möglich. */
const PFLICHT = [
  { id: "age", label: "dein Alter" },
  { id: "targetAge", label: "dein Zielalter" },
  { id: "net", label: "dein Nettoeinkommen" }
];

/**
 * Die Lebenshaltung darf auf ZWEI Wegen entstehen: als Ausgaben oder als Sparrate.
 * Wer den zweiten Weg wählt, hat nichts vergessen — er hat anders geantwortet.
 */
function lebenshaltungFehlt(v) {
  return v.cashflowMode === "sparrate" ? !hat(v.affordableSaving) : !hat(v.expenses);
}

/**
 * Angaben, deren Fehlen die Aussage abschwächt, sie aber nicht unmöglich macht.
 * `wirkung` beschreibt, was ihr Fehlen mit dem Ergebnis macht — der Nutzer soll nicht nur
 * lesen, dass etwas fehlt, sondern warum es zählt.
 */
const WICHTIG = [
  { id: "pension", label: "deine gesetzliche Rente", wirkung: "Ohne sie rechnen wir mit 0 € Rente — dein Zielkapital fällt dadurch deutlich zu hoch aus." },
  { id: "reserve", label: "dein Notgroschen", wirkung: "Ohne ihn können wir nicht beurteilen, ob dein Plan einen Rückschlag übersteht." },
  { id: "cash", label: "dein Bargeldvermögen", wirkung: "Es zählt zu dem Kapital, das dir bereits entgegenarbeitet." },
  { id: "depot", label: "dein Depot", wirkung: "Es zählt zu dem Kapital, das dir bereits entgegenarbeitet." }
];

function assessDataQuality(input) {
  const v = input || {};
  const fehlendPflicht = PFLICHT.filter((f) => !hat(v[f.id]));
  if (lebenshaltungFehlt(v)) {
    fehlendPflicht.push(v.cashflowMode === "sparrate"
      ? { id: "affordableSaving", label: "was du monatlich zurücklegen kannst" }
      : { id: "expenses", label: "deine Monatsausgaben" });
  }
  const fehlendWichtig = WICHTIG.filter((f) => !hat(v[f.id]));

  const unplausibel = [];
  const age = zahl(v.age);
  const targetAge = zahl(v.targetAge);
  const net = zahl(v.net);
  const expenses = zahl(v.expenses);
  if (age != null && (age < 16 || age > 90)) unplausibel.push("Alter außerhalb 16 bis 90");
  if (age != null && targetAge != null && targetAge <= age) unplausibel.push("Zielalter liegt nicht über dem heutigen Alter");
  // >= statt >: Bei genau dem Dreifachen ist die Angabe schon auffällig genug.
  if (net != null && net > 0 && expenses != null && expenses >= net * 3) unplausibel.push("Ausgaben mindestens dreimal so hoch wie das Nettoeinkommen");
  if (age != null && targetAge != null && targetAge > age && targetAge - age < 3) unplausibel.push("nur wenige Jahre bis zum Zielalter");
  if (net != null && net > 0 && expenses != null && expenses === 0) unplausibel.push("Ausgaben mit 0 € angegeben");

  let level = "belastbar";
  if (fehlendPflicht.length || unplausibel.length) level = "unzureichend";
  else if (fehlendWichtig.length) level = "vorlaeufig";

  const TEXT = {
    belastbar: "belastbare Orientierung",
    vorlaeufig: "vorläufige Orientierung",
    unzureichend: "wesentliche Daten fehlen"
  };

  /** Herkunft je Feld — steuert die Kennzeichnung im PDF und in der Beraterübergabe. */
  const herkunft = {};
  for (const key of [...PFLICHT, ...WICHTIG].map((f) => f.id)) {
    herkunft[key] = hat(v[key]) ? "input" : "unknown";
  }
  for (const key of ["existingReturn", "savingReturn", "withdrawal", "inflation",
    "pensionStartAge", "debtInterest", "mortgageInterest"]) {
    herkunft[key] = hat(v[key]) ? "input" : "default";
  }

  return {
    level,
    levelText: TEXT[level],
    missing: [...fehlendPflicht, ...fehlendWichtig].map((f) => f.label),
    /** Fehlende Angabe samt ihrer Wirkung — für Coaching und Beraterblatt. */
    missingEffects: fehlendWichtig.map((f) => ({ id: f.id, label: f.label, wirkung: f.wirkung })),
    missingRequired: fehlendPflicht.map((f) => f.id),
    implausible: unplausibel,
    fieldSources: herkunft
  };
}

/* ── Vision ─────────────────────────────────────────────────────────────── */

const WUNSCH_BEREICHE = [
  { id: "wohnen", label: "Wohnen", wunsch: "v_wohnenWunsch", jahr: "v_wohnenJahr" },
  { id: "reisen", label: "Reisen", wunsch: "v_reisenWunsch", jahr: "v_reisenJahr", budget: "v_reisenBudget" },
  { id: "mobilitaet", label: "Mobilität", wunsch: "v_mobiWunsch", jahr: "v_mobiJahr", budget: "v_mobiBudget" },
  { id: "bildung", label: "Bildung", wunsch: "v_bildungWunsch", jahr: "v_bildungJahr", budget: "v_bildungBudget" },
  { id: "netzwerk", label: "Netzwerk", wunsch: "v_netzWunsch", jahr: "v_netzJahr", budget: "v_netzBudget" },
  { id: "beitrag", label: "Beitrag", wunsch: "v_beitragWunsch", jahr: "v_beitragJahr", budget: "v_beitragBudget" }
];

function buildVision(values) {
  const v = values || {};
  return {
    leitsatz: hat(v.v_vision) ? String(v.v_vision).trim() : "",
    wuensche: WUNSCH_BEREICHE
      .filter((b) => hat(v[b.wunsch]))
      .map((b) => ({
        bereich: b.id,
        label: b.label,
        wunsch: String(v[b.wunsch]).trim(),
        jahr: zahl(v[b.jahr]),
        budget: b.budget ? (zahl(v[b.budget]) || 0) : 0
      }))
  };
}

/**
 * Eindeutige, reproduzierbare Kennung aus Name, Zeitpunkt und den prägenden Zahlen.
 * Bewusst ohne Zufall: Derselbe Stand am selben Tag ergibt dieselbe Kennung, damit ein
 * erneut erzeugtes PDF nicht wie ein zweiter Plan aussieht.
 */
function blueprintId(input, now) {
  const d = now instanceof Date ? now : new Date();
  const datum = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
  const roh = [input.name, input.age, input.targetAge, input.net, input.expenses].join("|");

  for (let i = 0; i < roh.length; i++) h = ((h << 5) + h + roh.charCodeAt(i)) >>> 0;

  const bottlenecks = findBottlenecks(plan, quality);

    futureIncome: plan.futureIncome,
    freedomTarget: plan.freedomTarget,

const CODE_PRAEFIX = "FB1.";

/** Unicode-sicheres Base64 — btoa allein scheitert an Umlauten. */
function nachBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let roh = "";
  for (const b of bytes) roh += String.fromCharCode(b);
  return btoa(roh).replace(/=+$/, "");
}
function ausBase64(code) {
  const roh = atob(code.replace(/-/g, "+").replace(/_/g, "/"));
  const bytes = Uint8Array.from(roh, (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function handoffToCode(handoff) {
  if (!handoff || !handoff.freigegeben) return "";
  return CODE_PRAEFIX + nachBase64(JSON.stringify(handoff));
}

/**
 * Code → Datensatz. Gibt bei ungültiger Eingabe null zurück statt zu werfen —
 * ein vertippter Code ist ein Alltagsfall, kein Programmierfehler.
 */
function codeToHandoff(code) {
  const s = String(code || "").trim().replace(/\s+/g, "");
  if (!s.startsWith(CODE_PRAEFIX)) return null;
  try {
    const daten = JSON.parse(ausBase64(s.slice(CODE_PRAEFIX.length)));
    return daten && daten.blueprintId ? daten : null;
  } catch (_) {
    return null;
  }
}

/** Ein Pflichthinweis als ruhiger Kasten — nie nur klein in der Fußzeile. */
function hinweisBox(bp, id) {
  const d = bp.disclosures.find((x) => x.id === id);
  if (!d) return "";
  return `<p class="fbr-hinweis"><b>${esc(d.titel)}</b> ${esc(d.text)}</p>`;
}

/* ── Seite 1 · Meine Vision ─────────────────────────────────────────────── */

function seiteVision(bp) {
  const leitsatz = bp.vision.leitsatz;
  return `
    <div class="fbr-hero" style="--fbr-bild:url('${bildBasis()}city-evening.jpg?v=${FB_MAP_BUILD}')">
      <div class="fbr-hero-inner">
        <p class="fbr-kicker">Meine Vision</p>
        <h2 class="fbr-titel">Das ist die Stadt, die du entworfen hast.</h2>
        ${leitsatz ? `<p class="fbr-leitsatz">„${esc(leitsatz)}“</p>` : ""}
        <p class="fbr-text">${esc(bp.profile.name)}, du hast zehn Bereiche deines Lebens
        beschrieben. Auf den nächsten Seiten steht, was daraus folgt: was deine Freiheit
        kostet, ob sie mit deinen heutigen Angaben erreichbar ist, welche Wege es gibt —
        und was du in den nächsten neunzig Tagen tun kannst.</p>
        ${hinweisBox(bp, "bildungstool")}
      </div>
    </div>`;
}

/* ── Seite 2 · Mein Leben in Zahlen ─────────────────────────────────────── */

function seiteZahlen(bp) {
  const c = bp.monthlyCashflow;
  const s = bp.currentSituation;
  const negativ = c.freeSurplus < 0;
  const max = Math.max(s.net + s.otherIncome, 1);
  const breite = (n) => `${pct((Math.abs(n) / max) * 100)}%`;

  const zeilen = [
    { label: "Was hereinkommt", hinweis: "Nettoeinkommen und sonstige laufende Einnahmen", wert: s.net + s.otherIncome, art: "ein" },
    {
      label: "Was dein Leben kostet",
      // Eine abgeleitete Zahl darf nicht aussehen wie eine eingetragene.
      hinweis: s.expensesAbgeleitet
        ? "abgeleitet: dein Einkommen minus dem, was du zurücklegen kannst"
        : "alle laufenden Ausgaben zusammen",
      wert: -s.expenses, art: "aus"
    },
    { label: "Rechnerischer Überschuss", hinweis: "was ohne weitere Vorsätze übrig bleibt", wert: c.grossSurplus, art: "summe" },
    { label: "Schon verplant", hinweis: "deine Budgets für Reisen, Mobilität, Bildung, Netzwerk und Beitrag", wert: -c.plannedSurplus, art: "aus" },
    { label: "Frei verfügbar", hinweis: "das ist der Betrag, mit dem deine Freiheit gebaut wird", wert: c.freeSurplus, art: "frei" }
  ];

  return `
    <div class="fbr-inner">
      <p class="fbr-kicker">Mein Leben in Zahlen</p>
      <h2 class="fbr-titel">${negativ
    ? "Am Monatsende bleibt nichts übrig."
    : `Am Ende bleiben dir ${euro(c.freeSurplus)} im Monat.`}</h2>

      <div class="fbr-fluss">
        ${zeilen.map((z) => `
          <div class="fbr-fluss-zeile is-${z.art}">
            <span class="fbr-fluss-label">${esc(z.label)}<small>${esc(z.hinweis)}</small></span>
            <span class="fbr-fluss-balken"><i style="width:${breite(z.wert)}"></i></span>
            <b class="fbr-fluss-wert">${euro(z.wert)}</b>
          </div>`).join("")}
      </div>

      <p class="fbr-text fbr-text--mitte">${negativ
    ? "Das ist kein Urteil, sondern der Ausgangspunkt. Alles Weitere hängt daran, dass hier zuerst ein Plus steht."
    : "Dieser frei verfügbare Betrag ist die wichtigste Zahl deines Blueprints. An ihm entscheidet sich, was möglich ist."}</p>

      ${s.expensesAbgeleitet ? `
        <p class="fbr-hinweis"><b>Woher diese Zahlen kommen</b> Du hast angegeben, dass du
        ${euro(s.affordableSaving)} im Monat zurücklegen kannst. Deine Lebenshaltung haben
        wir daraus abgeleitet — sie ist eine Herleitung, keine Angabe. Für dein
        Freiheitsbudget rechnen wir mit deinem heutigen Nettoeinkommen: die vorsichtigere
        Annahme, denn in der Freiheit hast du mehr Zeit, und Zeit kostet Geld.</p>` : ""}

      ${(() => {
    // Der Zielkonflikt in Jahren. „Schon verplant: 250 €" sagt nichts darüber, was diese
    // 250 € tatsächlich kosten — dieser Block sagt es.
    const kosten = (bp.wishCosts || []).filter((w) => w.jahreFrueher > 0);
    if (!kosten.length) return "";
    return `
      <div class="fbr-wunschkosten">
        <h3>Was deine Wünsche an Zeit kosten</h3>
        <ul>${kosten.map((w) => `<li><b>${esc(w.label)}</b> ${esc(w.text)}</li>`).join("")}</ul>
        <p>Das ist kein Vorwurf. Es ist der Preis, den du kennen solltest, bevor du ihn
        bezahlst — oder bewusst in Kauf nimmst.</p>
      </div>`;
  })()}
    </div>`;
}

/* ── Seite 3 · Mein Freiheitsziel ───────────────────────────────────────── */

function seiteZiel(bp) {
  const f = bp.freedomTarget;
  const a = bp.assumptions;
  const MODUS = {
    heute: "dein heutiger Lebensstandard", einfach: "einfacher als heute",
    komfort: "komfortabler als heute", eigen: "dein eigener Betrag"
  };
  const abgeleitet = bp.currentSituation.expensesAbgeleitet;
  const posten = [
    {
      label: abgeleitet
        ? "dein heutiges Nettoeinkommen als Maßstab"
        : (MODUS[a.budgetMode] || "dein Lebensstandard"),
      wert: f.budgetBase
    },
    { label: "Ausgaben, die bis dahin wegfallen", wert: -f.expensesDropping },
    { label: "Ausgaben, die neu hinzukommen", wert: f.expensesAdding },
    { label: "Wünsche, die weiterlaufen", wert: a.wishesInFreedom ? f.wishSumFreedom : 0 },
    { label: `Sicherheitspuffer ${a.freedomBuffer} %`, wert: f.freedomNeed - f.freedomNeedBase }
  ].filter((p) => Math.abs(p.wert) >= 1);

  return `
    <div class="fbr-inner">
      <p class="fbr-kicker">Mein Freiheitsziel</p>
      <h2 class="fbr-titel">In deiner Freiheit brauchst du ${euro(f.freedomNeed)} im Monat.</h2>

      <div class="fbr-herleitung">
        ${posten.map((p) => `
          <div class="fbr-herl-zeile">
            <span>${esc(p.label)}</span>
            <b>${p.wert > 0 ? "+ " : "− "}${euro(Math.abs(p.wert))}</b>
          </div>`).join("")}
        <div class="fbr-herl-zeile is-summe">
          <span>Dein Freiheitsbudget</span><b>${euro(f.freedomNeed)}</b>
        </div>
      </div>

      <p class="fbr-text fbr-text--mitte">Frei sein willst du mit ${bp.profile.targetAge},
      also in ${bp.profile.years} Jahren — im Jahr ${freiheitsJahr(bp)}.
      Dieser Betrag hängt an deinem Lebensstandard, nicht an deinem Einkommen.</p>
    </div>`;
}

/* ── Seite 4 · Meine Freiheitslücke ─────────────────────────────────────── */

function seiteLuecke(bp) {
  const f = bp.freedomTarget;
  const b = bp.bridgePhase;
  const ziel = Math.max(f.freedomNeed, 1);
  const gedeckt = pct((b.incomeAtStart / ziel) * 100);
  const luecke = 100 - gedeckt;

  return `
    <div class="fbr-inner">
      <p class="fbr-kicker">Meine Freiheitslücke</p>
      <h2 class="fbr-titel">${b.exists
    ? "Dein Plan besteht aus zwei Phasen."
    : "Ein Stück der Brücke fehlt noch."}</h2>

      <div class="fbr-bruecke" role="img"
        aria-label="Brücke: ${gedeckt} Prozent des Freiheitsziels sind zu Beginn gedeckt, ${luecke} Prozent fehlen">
        <div class="fbr-bruecke-deck">
          <span class="fbr-deck-fest" style="width:${gedeckt}%"></span>
          <span class="fbr-deck-luecke" style="width:${luecke}%">
            <b>${euro(f.freedomGapMonthly)}<i>/Monat</i></b>
            <small>das fehlt zu Beginn</small>
          </span>
        </div>
        <div class="fbr-bruecke-pfeiler">
          <div class="fbr-pfeiler">
            <b>${euro(b.incomeAtStart)}<i>/M</i></b>
            <span>fließt ab Alter ${bp.profile.targetAge}</span>
            <small>${bp.futureIncome.sources.filter((s) => s.fromAge <= bp.profile.targetAge)
    .map((s) => s.label).join(", ") || "noch nichts"}</small>
          </div>
          <div class="fbr-pfeiler is-ziel">
            <b>${euro(f.freedomNeed)}<i>/M</i></b>
            <span>dein Freiheitsziel</span>
            <small>der Betrag, von dem du leben willst</small>
          </div>
        </div>
      </div>

      ${b.exists ? `
        <div class="fbr-phasen">
          <div class="fbr-phase">
            <b>Alter ${b.fromAge} bis ${b.toAge}</b>
            <span>${b.years} Jahre Überbrückung</span>
            <p>Du finanzierst deinen Lebensunterhalt überwiegend aus eigenem Kapital.
            Allein dafür ist ein Kapital von rund ${euro(f.bridgeCapital)} nötig.</p>
          </div>
          <div class="fbr-phase is-danach">
            <b>Ab Alter ${b.toAge}</b>
            <span>Renten greifen</span>
            <p>Deine späteren Einkünfte von ${euro(b.incomeAfter)} senken die notwendige
            Entnahme auf rund ${euro(b.monthlyNeedAfter)} im Monat.</p>
          </div>
        </div>`
    : `<p class="fbr-text fbr-text--mitte">Deine späteren Einkünfte beginnen rechtzeitig —
        eine Überbrückungsphase entsteht nicht. Die Lücke ist der Teil, den du selbst baust.</p>`}
    </div>`;
}

/* ── Seite 5 · Mein Zielkapital ─────────────────────────────────────────── */

function seiteKapital(bp) {
  const f = bp.freedomTarget;
  const a = bp.assets;
  const bruecke = f.bridgeCapital;
  const dauer = f.permCapital;
  const summe = Math.max(f.targetCapital, 1);

  return `
    <div class="fbr-inner">
      <p class="fbr-kicker">Mein Zielkapital</p>
      <h2 class="fbr-titel">Du brauchst ${euro(f.targetCapital)} — so setzt es sich zusammen.</h2>

      <div class="fbr-stapel" role="img" aria-label="Zusammensetzung des Zielkapitals">
        ${bruecke > 0 ? `
          <div class="fbr-stapel-teil is-bruecke" style="flex-grow:${Math.max(bruecke / summe, 0.08)}">
            <b>${euro(bruecke)}</b><span>für die Überbrückung</span>
          </div>` : ""}
        <div class="fbr-stapel-teil is-dauer" style="flex-grow:${Math.max(dauer / summe, 0.08)}">
          <b>${euro(dauer)}</b><span>für die Zeit danach</span>
        </div>
      </div>

      <div class="fbr-herleitung">
        <div class="fbr-herl-zeile">
          <span>Entnahme aus dem Kapital</span><b>${bp.assumptions.withdrawal} % pro Jahr</b>
        </div>
        <div class="fbr-herl-zeile">
          <span>Dein Kapital heute, das dafür angerechnet werden kann</span><b>${euro(a.investable)}</b>
        </div>
        <div class="fbr-herl-zeile">
          <span>Daraus in ${bp.profile.years} Jahren bei ${Math.round(bp.assumptions.existingReturn * 10) / 10} %</span>
          <b>${euro(a.existingFuture)}</b>
        </div>
        <div class="fbr-herl-zeile is-summe">
          <span>Was du noch aufbauen musst</span><b>${euro(bp.plan.remainingCapital)}</b>
        </div>
      </div>

      ${a.breakdown.filter((x) => !x.counted && Math.abs(x.amount) >= 1).length ? `
        <div class="fbr-nichtgezaehlt">
          <b>Nicht angerechnet</b>
          <ul>${a.breakdown.filter((x) => !x.counted && Math.abs(x.amount) >= 1)
    .map((x) => `<li>${esc(x.label)}: ${euro(Math.abs(x.amount))} — ${esc(x.reason)}</li>`).join("")}</ul>
        </div>` : ""}

      ${hinweisBox(bp, "nicht-beruecksichtigt")}
    </div>`;
}

/* ── Seite 6 · Ist mein Ziel erreichbar? ────────────────────────────────── */

const STATUS_TEXT = {
  gruen: "Erreichbar", gelb: "Erreichbar, aber angespannt",
  orange: "Nur mit Veränderungen", rot: "Fundament zuerst", blau: "Rechnerisch finanziert"
};

function seiteMachbarkeit(bp) {
  const fs = bp.feasibility;
  const p = bp.plan;
  // Bei sehr kurzem Zeitraum wäre eine Monatsrate Scheingenauigkeit — dann zählt die Summe.
  const kacheln = p.shortHorizon
    ? [
      { wert: euro(p.lumpSumNeeded), label: "fehlender Betrag", hinweis: `bis Alter ${bp.profile.targetAge}` },
      { wert: euro(p.availableContribution), label: "verfügbar pro Monat", hinweis: "dein frei verfügbarer Überschuss" },
      { wert: `${bp.profile.years}`, label: bp.profile.years === 1 ? "Jahr Zeit" : "Jahre Zeit", hinweis: "zu kurz für eine Sparrate" }
    ]
    : [
      { wert: euro(p.requiredContribution), label: "nötig pro Monat", hinweis: "für dein Zielkapital" },
      { wert: euro(p.availableContribution), label: "verfügbar pro Monat", hinweis: "dein frei verfügbarer Überschuss" },
      {
        wert: euro(p.implementationGap), label: "Umsetzungslücke",
        hinweis: p.implementationGap > 0 ? "so viel fehlt im Monat" : "keine Lücke"
      }
    ];

  return `
    <div class="fbr-inner">
      <p class="fbr-kicker">Ist mein Ziel heute erreichbar?</p>
      <h2 class="fbr-titel">${esc(fs.headline)}</h2>

      <div class="fbr-ampel is-${fs.status}">
        <span class="fbr-ampel-punkt" aria-hidden="true"></span>
        <b>${esc(STATUS_TEXT[fs.status] || "")}</b>
      </div>

      <p class="fbr-text fbr-text--mitte">${esc(fs.detail)}</p>

      <div class="fbr-kennzahlen">
        ${kacheln.map((k) => `
          <div class="fbr-kz">
            <b>${esc(k.wert)}</b><span>${esc(k.label)}</span><small>${esc(k.hinweis)}</small>
          </div>`).join("")}
      </div>

      ${fs.reasons.length ? `
        <div class="fbr-gruende">
          <b>Warum das Fundament zuerst zählt</b>
          <ul>${fs.reasons.map((r) => `<li>${esc(r.text)}</li>`).join("")}</ul>
        </div>` : ""}

      <p class="fbr-fuss">Dieser Machbarkeitsstatus ist etwas anderes als dein Freedom
      Blueprint Score. Der Score sagt, wo du stehst. Der Status sagt, ob dein Ziel mit deinen
      heutigen Angaben erreichbar ist. Datengrundlage: ${esc(bp.calculationMeta.dataQualityText)}.</p>
    </div>`;
}
