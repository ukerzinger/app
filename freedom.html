<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Journey of Money · Freedom Blueprint Komplett</title><style>/**
 * FREEDOM BLUEPRINT — Styles der Stadt-Oberfläche.
 *
 * Namensraum: .fbm-*  (das alte Formular nutzt .fb-*, keine Überschneidung).
 * Bewusst OHNE @layer game — gleiche Begründung wie in lifeflow-map.css: Es sind eigenständige
 * neue Komponenten, keine Overrides von brand-v2.css, und sie müssen sich gegen die ungelayerten
 * Regeln der Legacy-Kaskade (participant-game-shell.css) durchsetzen.
 *
 * Aufbau:
 *   #fb-map-root   liegt fixiert über der Seite — dadurch keine 100vw-Tricks, kein Scrollen.
 *   .fbm-stage     die Bühne. Trägt den unscharfen Rahmen aus demselben Stadtbild.
 *   .fbm-viewport  der Ausschnitt, in dem die Stadt liegt (unten um die Statusleiste verkürzt).
 *   .fbm-map       der Deckungsrahmen — genau die Fläche, die das Stadtbild einnimmt. Bild UND
 *                  Pins liegen darin, deshalb beziehen sich alle Prozentwerte auf dieselbe
 *                  Fläche und wandern bei jeder Fenstergröße gemeinsam mit.
 *   .fbm-hud       eigene Ebene AN DER BÜHNE: Kopf, Anspruch, Aktionen, Statusleiste. Liegt
 *                  außerhalb von .fbm-map und verschiebt deshalb keinen Pin.
 *
 * FORMATFÜLLEND UND TROTZDEM VOLLSTÄNDIG BEDIENBAR:
 * Die Stadt füllt den Bildschirm randlos aus (cover) — kein Rahmen, kein Rand. Weil das Bild
 * dabei je nach Bildschirmformat über den Rand hinausragt, ist der Ausschnitt SCHIEBBAR: mit
 * der Maus ziehen, mit dem Rad rollen, auf dem Handy wischen. Die zehn Pins reichen von 8,5 %
 * bis 88,5 % in der Breite und von 21,5 % bis 86 % in der Höhe; ohne Schieben lägen auf breiten
 * Schirmen die unteren außerhalb und wären nicht mehr anklickbar.
 *
 * Beim Öffnen zeigt der Ausschnitt die MITTE DER PINS (48,5 % / 53,75 %), nicht die Bildmitte —
 * so ist ohne eine einzige Bewegung so viel wie möglich erreichbar.
 *
 * Alle Maße hängen an --fbm-u (ein Prozent der KARTENBREITE). Es ist auf der Wurzel .fbm
 * definiert, damit sowohl die Pins in der Karte als auch das HUD daneben damit rechnen können.
 */

.fbm {
  /* Höhe der Statusleiste — wird nach dem Zeichnen aus dem echten Element gesetzt (JS),
     damit die Stadt darüber vollständig Platz hat, auch wenn die Leiste umbricht. */
  --fbm-barh: 0px;
  --fbm-vh: calc(100dvh - var(--fbm-barh));
  /* Kartenbreite: formatfüllend. Was über den Rand ragt, wird geschoben. */
  --fbm-mapw: max(100vw, calc(var(--fbm-vh) * 1586 / 992));
  --fbm-u: calc(var(--fbm-mapw) / 100);

  --fbm-navy: #071A2F;
  --fbm-navy-2: #0E2A47;
  --fbm-gold: #C9A24A;
  --fbm-gold-hell: #E8C87A;
  --fbm-cream: #F7F3E8;
  --fbm-teal: #007C89;
  --fbm-teal-hell: #0096A3;
  --fbm-ink: #F1E9DA;
  --fbm-dim: #9FB6C6;
  --fbm-line: rgba(247, 243, 232, .14);

  position: absolute; inset: 0;
  color: var(--fbm-ink);
  font-family: Inter, "Plus Jakarta Sans", system-ui, sans-serif;
}

/* ── Bühne mit unscharfem Rahmen ──────────────────────────────────────────── */
.fbm-stage {
  position: absolute; inset: 0; overflow: hidden;
  background: var(--fbm-navy);
}
/* Derselbe Stadtausschnitt als Rahmen: Der freie Rand wirkt dadurch wie Tiefenschärfe statt
   wie eine leere Fläche. Rein dekorativ.

   WICHTIG — hier liegt eine bewusste Entscheidung: Die Weichzeichnung kommt aus einer WINZIGEN
   vorab verkleinerten Datei (city-blur.jpg, 64 × 40 px, 1,6 KB), die der Browser hochskaliert.
   Sie darf NICHT durch `filter: blur()` auf dieser Fläche ersetzt werden: Ein Vollbild-Blur
   erzeugt eine eigene Compositing-Ebene, und Chrome hat dann das eigentliche Stadtbild in der
   Nachbarschicht zeitweise nicht mehr gezeichnet (reproduzierbar getestet, 2026-07-30). Ohne
   Filter gibt es diese Ebene nicht — und die Optik ist dieselbe. */
.fbm-stage::before {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: url("assets/freedom-blueprint/map/city-blur.jpg") center / cover no-repeat;
}
/* Abdunkeln übernimmt ein Verlauf, nicht brightness() — aus demselben Grund. */
.fbm-stage::after {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(7, 26, 47, .82) 0%, rgba(7, 26, 47, .68) 100%),
    radial-gradient(90% 70% at 50% 45%, rgba(7, 26, 47, .35) 0%, rgba(7, 26, 47, .8) 100%);
}

/* Der Ausschnitt: oben bis zum Rand, unten bis über die Statusleiste.
   Schiebbar in beide Richtungen — das Bild ist formatfüllend und ragt darüber hinaus.
   Die Bildlaufleisten sind ausgeblendet: Es soll sich wie eine Karte anfühlen, nicht wie eine
   Seite. Gezogen wird mit der Maus (siehe wirePan in freedom-blueprint-map-ui.js), gerollt und
   gewischt geht über den normalen Bildlauf. */
.fbm-viewport {
  position: absolute; top: 0; left: 0; right: 0; bottom: var(--fbm-barh);
  z-index: 1;
  overflow: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  cursor: grab;
  touch-action: pan-x pan-y;
}
.fbm-viewport::-webkit-scrollbar { display: none; }
.fbm-viewport.is-panning { cursor: grabbing; }

.fbm-map {
  position: relative;
  width: var(--fbm-mapw);
  aspect-ratio: 1586 / 992;
  background: var(--fbm-navy-2);
}

.fbm-pic { position: absolute; inset: 0; display: block; }
.fbm-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: center center;
  user-select: none; -webkit-user-select: none; pointer-events: none;
}

/* Ruhige Abdunklung an Ober- und Unterkante, damit Kopfzeile und Statusleiste lesbar bleiben.
   Die Bildmitte bleibt frei — die Stadt ist die Hauptfigur. */
.fbm-scrim {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background:
    linear-gradient(180deg, rgba(4, 14, 26, .5) 0%, rgba(4, 14, 26, 0) 20%,
      rgba(4, 14, 26, 0) 74%, rgba(4, 14, 26, .5) 100%);
}

/* ── Pins ─────────────────────────────────────────────────────────────────────
   Ausschließlich die gelieferten PNG-Grafiken. Keine Textblasen, keine dauerhaften
   Beschriftungen — der Titel erscheint erst beim Überfahren.

   Die Grafiken sind aufbereitet (siehe scratchpad/pins-install.ps1): Fremdfragmente entfernt,
   auf gleichen Kopfdurchmesser skaliert, in eine gemeinsame Leinwand 228 × 277 gesetzt —
   waagerecht zentriert, Spitze exakt auf der Unterkante. Deshalb --fbm-tip: 100 %.
   Wird der Pin-Satz erneuert, muss das Skript neu laufen ODER Seitenverhältnis und Spitze
   hier angepasst werden. */
.fbm-marks { position: absolute; inset: 0; z-index: 2; }

.fbm-pin {
  --fbm-tip: 100%;
  position: absolute; transform: translate(-50%, calc(-1 * var(--fbm-tip)));
  width: calc(var(--fbm-u) * 5.0); aspect-ratio: 228 / 277; height: auto;
  border: 0; padding: 0; cursor: pointer; font: inherit;
  -webkit-tap-highlight-color: transparent;
  /* Dunkler Hof hinter dem Pinkopf. Das Stadtbild ist an jeder Stelle anders hell — heller
     Beton, gleißendes Wasser, dunkles Grün. Ohne diesen Hof geht der Pin dort verloren, wo der
     Untergrund zufällig dieselbe Helligkeit hat. Kostet keine eigene Ebene: ein Verlauf auf
     dem Knopf selbst, hinter der Grafik. */
  background: radial-gradient(54% 45% at 50% var(--fbm-head-y, 41%),
    rgba(4, 12, 22, .6) 0%, rgba(4, 12, 22, .32) 55%, rgba(4, 12, 22, 0) 80%);
}
.fbm-pin-img {
  display: block; width: 100%; height: 100%; object-fit: contain;
  /* Zwei Schatten: ein enger für die Kontur, ein weiter für die Ablösung vom Bild. */
  filter:
    drop-shadow(0 0 calc(var(--fbm-u) * 0.12) rgba(0, 0, 0, .95))
    drop-shadow(0 calc(var(--fbm-u) * 0.3) calc(var(--fbm-u) * 0.6) rgba(0, 0, 0, .7));
  transition: transform .18s ease, filter .18s ease;
}

/* Beim Überfahren: Pin vergrößert sich leicht. Nicht mehr — ruhig und hochwertig. */
.fbm-pin:hover, .fbm-pin:focus-visible { z-index: 5; }
.fbm-pin:hover .fbm-pin-img,
.fbm-pin:focus-visible .fbm-pin-img {
  transform: scale(1.16);
  filter:
    drop-shadow(0 0 calc(var(--fbm-u) * 0.14) rgba(0, 0, 0, .95))
    drop-shadow(0 calc(var(--fbm-u) * 0.5) calc(var(--fbm-u) * 0.9) rgba(0, 0, 0, .75));
}
.fbm-pin:focus, .fbm-pin:focus-visible { outline: none; }

/* Titel — erscheint NUR beim Überfahren oder Tastaturfokus, sonst unsichtbar. */
.fbm-pin-name {
  position: absolute; left: 50%; top: calc(var(--fbm-tip) + var(--fbm-u) * 0.3);
  transform: translate(-50%, 0) scale(.92);
  display: block; white-space: nowrap; pointer-events: none;
  padding: calc(var(--fbm-u) * 0.32) calc(var(--fbm-u) * 0.8);
  background: rgba(7, 26, 47, .9);
  border: 1px solid rgba(201, 162, 74, .55); border-radius: calc(var(--fbm-u) * 0.42);
  box-shadow: 0 calc(var(--fbm-u) * 0.3) calc(var(--fbm-u) * 0.9) rgba(0, 0, 0, .55);
  font-family: Cormorant, Georgia, serif; font-weight: 700;
  font-size: max(11px, calc(var(--fbm-u) * 1.25)); letter-spacing: .07em;
  text-transform: uppercase; color: var(--fbm-cream); line-height: 1.1;
  opacity: 0; transition: opacity .16s ease, transform .16s ease;
}
.fbm-pin:hover .fbm-pin-name,
.fbm-pin:focus-visible .fbm-pin-name { opacity: 1; transform: translate(-50%, 0) scale(1); }

/* Pins am rechten Rand: Titel nach links ausrichten, damit er im Bild bleibt. */
.fbm-pin--flip .fbm-pin-name { left: auto; right: 50%; transform: translate(0, 0) scale(.92); }
.fbm-pin--flip:hover .fbm-pin-name,
.fbm-pin--flip:focus-visible .fbm-pin-name { transform: translate(0, 0) scale(1); }

/* ── Die drei Zustände ────────────────────────────────────────────────────────
   offen  = unberührt, der Pin steht schlicht da
   aktiv  = angefangen, ein ruhiger Teal-Ring
   fertig = Goldring, kleines Häkchen, leichter Glow

   Ring und Häkchen sitzen auf dem KOPF des Pins. Wo der Kopf liegt, ist je Pin verschieden —
   die Spitzen sind unterschiedlich lang. Die Höhe kommt deshalb aus --fbm-head-y, das die
   Oberfläche je Pin aus FB_AREAS (kopfY) setzt. Der Kopfdurchmesser ist bei allen gleich
   (87,7 % der Pinbreite), der Ring liegt bewusst knapp darüber. */
.fbm-pin-ring {
  position: absolute; left: 50%; top: var(--fbm-head-y, 45%);
  transform: translate(-50%, -50%);
  width: 94%; aspect-ratio: 1; border-radius: 50%; pointer-events: none;
  opacity: 0; transition: opacity .2s ease;
}
.fbm-pin.is-aktiv .fbm-pin-ring {
  opacity: 1;
  border: max(1.5px, calc(var(--fbm-u) * 0.13)) solid rgba(0, 170, 184, .9);
  box-shadow: 0 0 calc(var(--fbm-u) * 0.8) rgba(0, 170, 184, .55);
}
.fbm-pin.is-fertig .fbm-pin-ring {
  opacity: 1;
  border: max(2px, calc(var(--fbm-u) * 0.16)) solid var(--fbm-gold);
  box-shadow:
    0 0 calc(var(--fbm-u) * 1) rgba(201, 162, 74, .7),
    inset 0 0 calc(var(--fbm-u) * 0.7) rgba(232, 200, 122, .4);
}

/* Häkchen — klein, an der rechten Schulter des Kopfes, nicht über dem Symbol.
   16 % der Pinhöhe über der Kopfmitte entspricht etwa 35 % des Kopfradius. */
.fbm-pin-check {
  position: absolute; left: 82%; top: calc(var(--fbm-head-y, 45%) - 16%);
  width: 32%; aspect-ratio: 1;
  display: grid; place-items: center; border-radius: 50%; pointer-events: none;
  background: var(--fbm-gold); color: #1a1206;
  font-size: max(8px, calc(var(--fbm-u) * 0.9)); font-weight: 700; line-height: 1;
  box-shadow: 0 0 calc(var(--fbm-u) * 0.5) rgba(201, 162, 74, .85);
  opacity: 0; transform: scale(.5); transition: opacity .2s ease, transform .2s ease;
}
.fbm-pin.is-fertig .fbm-pin-check { opacity: 1; transform: scale(1); }

/* Unberührte Bereiche atmen einmal ruhig durch, damit erkennbar bleibt, dass es weitergeht.
   Sehr zurückhaltend — keine überladene Animation. */
.fbm-pin.is-offen .fbm-pin-img { animation: fbm-atem 4.5s ease-in-out infinite; }
@keyframes fbm-atem {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4%); }
}
.fbm-pin.is-offen:hover .fbm-pin-img,
.fbm-pin.is-offen:focus-visible .fbm-pin-img { animation: none; }

/* Einrichtungsmodus (?pins=1): Fadenkreuz auf der Spitze plus Prozentwerte. */
.fbm.is-pindebug .fbm-pin { cursor: grab; touch-action: none; }
.fbm.is-pindebug .fbm-pin::before,
.fbm.is-pindebug .fbm-pin::after {
  content: ""; position: absolute; left: 50%; top: var(--fbm-tip); background: #ff2d55; z-index: 9;
}
.fbm.is-pindebug .fbm-pin::before { width: calc(var(--fbm-u) * 2.4); height: 1px; transform: translate(-50%, 0); }
.fbm.is-pindebug .fbm-pin::after { width: 1px; height: calc(var(--fbm-u) * 2.4); transform: translate(0, -50%); }
.fbm-pin-dbg {
  position: absolute; left: 50%; top: calc(var(--fbm-tip) + var(--fbm-u) * 1.2);
  transform: translateX(-50%);
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  color: #ff2d55; background: rgba(0, 0, 0, .75); padding: 1px 4px; border-radius: 3px;
  white-space: nowrap; pointer-events: none;
}
.fbm:not(.is-pindebug) .fbm-pin-dbg { display: none; }

/* ── HUD ──────────────────────────────────────────────────────────────────────
   Eigene Ebene über der Karte. pointer-events: none, damit die Stadt bedienbar bleibt —
   nur die Kinder fangen Klicks.

   Die Maße im HUD stehen in Pixeln und clamp(), NICHT in --fbm-u: Das HUD sitzt am
   Bildschirmrand, nicht auf dem Bild, und soll auf jedem Gerät gleich gut lesbar sein.
   Dasselbe Vorgehen wie im HUD von LifeFlow. */
.fbm-hud { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.fbm-hud > * { pointer-events: auto; }

.fbm-top { position: absolute; top: 14px; left: 18px; max-width: min(52%, 460px); }
.fbm-top h1 {
  margin: 0; font-family: Cormorant, Georgia, serif; font-weight: 700;
  font-size: clamp(1.45rem, 2.4vw, 2.5rem);
  letter-spacing: .04em; color: var(--fbm-cream); line-height: 1.05;
  text-shadow: 0 2px 16px rgba(0, 0, 0, .8);
}
.fbm-top p {
  margin: .3em 0 0; font-size: clamp(.72rem, .9vw, .95rem);
  color: var(--fbm-gold-hell); letter-spacing: .16em; text-transform: uppercase;
  text-shadow: 0 1px 12px rgba(0, 0, 0, .9);
}

/* Mitte: der Anspruch. Verschwindet, sobald der erste Bereich beantwortet ist —
   danach gehört die Bildmitte der Stadt. */
.fbm-claim {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
  text-align: center; pointer-events: none;
  font-family: Cormorant, Georgia, serif; font-weight: 700;
  font-size: clamp(1.15rem, 2.6vw, 2.4rem);
  line-height: 1.5; color: var(--fbm-cream);
  text-shadow: 0 2px 24px rgba(0, 0, 0, .95), 0 0 60px rgba(0, 0, 0, .8);
  animation: fbm-auf .9s ease both;
}
/* Weiche Abdunklung hinter dem Anspruch: Über der hellen Skyline wäre er sonst schlecht
   lesbar. Nur ein Schleier, kein Kasten — die Stadt bleibt sichtbar. */
.fbm-claim::before {
  content: ""; position: absolute; inset: -60% -40%; z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, rgba(4, 12, 22, .78) 0%, rgba(4, 12, 22, 0) 100%);
}
.fbm-claim span { display: block; position: relative; }
.fbm-claim span + span { color: var(--fbm-gold-hell); }
@keyframes fbm-auf { from { opacity: 0; transform: translate(-50%, -44%); } to { opacity: 1; } }

/* Hinweis aufs Schieben. Erscheint nur, wenn wirklich etwas außerhalb liegt, und nur einmal.
   Bewusst klein und ruhig — er soll informieren, nicht die Stadt überlagern. */
.fbm-panhint {
  position: absolute; left: 50%; bottom: calc(var(--fbm-barh) + 16px);
  transform: translateX(-50%);
  padding: .5em 1.05em; border-radius: 999px; white-space: nowrap;
  background: rgba(7, 26, 47, .9); border: 1px solid rgba(201, 162, 74, .5);
  color: var(--fbm-cream); font-size: clamp(.7rem, .85vw, .86rem);
  box-shadow: 0 2px 14px rgba(0, 0, 0, .6);
  pointer-events: none;
  animation: fbm-fade .5s ease both;
}
.fbm-panhint[hidden] { display: none; }

/* Oben rechts: „Blueprint berechnen“.
   Er steht jetzt auf derselben Höhe wie der plattformweite Zurück-Knopf aus game-bridge.js und
   weicht ihm nach LINKS aus, statt darunter zu rutschen. Wie weit, misst die Oberfläche selbst
   (--fbm-actions-right, gesetzt in measureBar) — die Breite des Knopfes hängt an Sprache und
   Punktestand. Ohne Plattform, also in der Standalone-Fassung, bleibt es beim Standardwert. */
.fbm-actions {
  position: absolute; top: 12px; right: var(--fbm-actions-right, 14px);
  display: flex; gap: 8px; align-items: center;
}

/* ── Knöpfe ───────────────────────────────────────────────────────────────────
   Die Knöpfe liegen AUF einem Bild, das an jeder Stelle eine andere Helligkeit hat: heller
   Himmel, dunkles Wasser, gleißende Sonne. Ein zurückhaltender dunkler Knopf mit feinem Rand
   verschwindet darin — genau das war der Fehler der ersten Fassung.

   Deshalb tragen alle Knöpfe drei Dinge: eine deckende Fläche, einen erkennbaren Goldrand und
   einen Schatten, der sie vom Bild abhebt. Sie sollen wie eingelegte Messingschilder wirken,
   nicht wie Beschriftung. */
.fbm-btn {
  font: inherit; font-weight: 650; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  padding: .68em 1.2em; border-radius: 12px;
  border: 1px solid rgba(201, 162, 74, .5);
  background: rgba(10, 32, 54, .94);
  color: var(--fbm-cream);
  font-size: clamp(.78rem, .95vw, .96rem); line-height: 1.2;
  letter-spacing: .01em;
  box-shadow: 0 2px 12px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(247, 243, 232, .08);
  transition: background .15s ease, border-color .15s ease, transform .12s ease,
    box-shadow .15s ease;
}
.fbm-btn:hover {
  background: rgba(18, 52, 84, .98); border-color: var(--fbm-gold);
  box-shadow: 0 3px 16px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(247, 243, 232, .12);
}
.fbm-btn:active { transform: translateY(1px); }
.fbm-btn:focus-visible {
  outline: 2px solid var(--fbm-gold-hell); outline-offset: 2px;
}

/* Teal — die verbindende Handlungsfarbe der Marke. Dunkler Rand, damit sie auch auf hellem
   Wasser eine Kante hat. */
.fbm-btn--teal {
  background: var(--fbm-teal); border-color: rgba(4, 12, 22, .5); color: #fff;
  box-shadow: 0 2px 14px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .18);
}
.fbm-btn--teal:hover { background: var(--fbm-teal-hell); border-color: rgba(4, 12, 22, .55); }

/* Gold — nur für den einen großen Moment: den Blueprint berechnen. */
.fbm-btn--gold {
  background: linear-gradient(180deg, var(--fbm-gold-hell) 0%, var(--fbm-gold) 100%);
  border-color: rgba(90, 66, 18, .6); color: #221806; font-weight: 700;
  box-shadow: 0 2px 14px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.fbm-btn--gold:hover {
  background: linear-gradient(180deg, #F2D89A 0%, var(--fbm-gold-hell) 100%);
  border-color: rgba(90, 66, 18, .7);
}

/* Umrandet gold — sichtbare Zweitrangigkeit für „Beratungstermin vereinbaren“: klar ein
   Knopf, aber nicht laut wie die Hauptaktion. */
.fbm-btn--outline-gold {
  background: rgba(201, 162, 74, .18);
  border: 1.5px solid var(--fbm-gold); color: #F5E4B8;
}
.fbm-btn--outline-gold:hover {
  background: rgba(201, 162, 74, .3); border-color: var(--fbm-gold-hell); color: #FFF3D4;
}

/* Ghost — für „Hilfe“ und „Zurück“. Bleibt zurückhaltend, aber der Rand ist jetzt sichtbar. */
.fbm-btn--ghost {
  background: rgba(10, 32, 54, .82); border-color: rgba(247, 243, 232, .5);
}
.fbm-btn--ghost:hover { background: rgba(247, 243, 232, .16); border-color: var(--fbm-cream); }

.fbm-btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ── Untere Statusleiste ──────────────────────────────────────────────────────
   Fortschritt, Vision, Zeithorizont, abgeschlossene Bereiche — dann die zwei Knöpfe.

   RECHTS bleibt Platz frei: Dort sitzt das schwebende „Goldene Buch" der Plattform
   (gb-widget, ca. 224 × 48 px, Standardecke unten rechts — siehe defaultPos() in
   glossary-book.js). Ohne diesen Freiraum würde es den Knopf „Beratungstermin vereinbaren"
   verdecken. Das Widget ist verschiebbar; wer es umstellt, hat das selbst entschieden. */
.fbm-bottom {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 31;
  display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
  padding: 12px 240px 12px 18px;
  background: linear-gradient(180deg, rgba(7, 26, 47, .45) 0%, rgba(7, 26, 47, .95) 42%);
  border-top: 1px solid rgba(201, 162, 74, .22);
  backdrop-filter: blur(6px);
}
.fbm-stats {
  display: flex; flex-wrap: wrap; align-items: center; gap: 20px;
  flex: 1 1 auto; min-width: 0;
}
.fbm-stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fbm-stat > span {
  font-size: clamp(.58rem, .68vw, .72rem);
  letter-spacing: .14em; text-transform: uppercase; color: var(--fbm-dim); white-space: nowrap;
}
.fbm-stat > b {
  font-family: "IBM Plex Mono", monospace; font-weight: 600;
  font-size: clamp(.8rem, 1.05vw, 1.1rem); color: var(--fbm-cream);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28ch;
}
.fbm-stat--vision > b { font-family: Inter, system-ui, sans-serif; font-style: italic; }

/* Fortschrittsbalken — Gold steht im Projekt für Wert und Fortschritt. */
.fbm-stat--prog { flex: 0 1 clamp(110px, 11vw, 165px); }
.fbm-bar {
  height: 5px; border-radius: 999px; overflow: hidden;
  background: rgba(247, 243, 232, .18); margin-top: 3px;
}
.fbm-bar i {
  display: block; height: 100%; width: 0; border-radius: 999px;
  background: linear-gradient(90deg, var(--fbm-gold) 0%, var(--fbm-gold-hell) 100%);
  transition: width .5s cubic-bezier(.4, 0, .2, 1);
}
.fbm-bottom-cta { display: flex; gap: 8px; flex: 0 0 auto; flex-wrap: wrap; }

/* ── Modal ────────────────────────────────────────────────────────────────────
   Ein Bereich = ein Fenster. Höchstens fünf Fragen pro Seite, Zurück/Weiter/Speichern. */
.fbm-modal {
  position: fixed; inset: 0; z-index: 120;
  display: grid; place-items: center; padding: 16px;
  background: rgba(4, 12, 22, .74); backdrop-filter: blur(4px);
  animation: fbm-fade .18s ease both;
}
@keyframes fbm-fade { from { opacity: 0; } to { opacity: 1; } }

.fbm-card {
  width: min(680px, 100%); max-height: min(88dvh, 900px);
  display: flex; flex-direction: column; overflow: hidden;
  background: linear-gradient(165deg, var(--fbm-navy-2) 0%, var(--fbm-navy) 100%);
  border: 1px solid rgba(201, 162, 74, .36); border-radius: 20px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .65);
  animation: fbm-hoch .22s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes fbm-hoch { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; } }

.fbm-card-head {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 20px 24px 14px; border-bottom: 1px solid var(--fbm-line);
}
.fbm-card-pin { flex: 0 0 auto; width: 42px; height: 53px; object-fit: contain; }
.fbm-card-head > div { flex: 1 1 auto; min-width: 0; }
.fbm-card-head h2 {
  margin: 0; font-family: Cormorant, Georgia, serif; font-weight: 700;
  font-size: 1.42rem; color: var(--fbm-cream); letter-spacing: .02em; line-height: 1.15;
}
.fbm-card-head p { margin: .3em 0 0; font-size: .86rem; color: var(--fbm-dim); line-height: 1.45; }
.fbm-card-ort {
  display: inline-block; margin-top: .6em; padding: .2em .65em;
  font-size: .66rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--fbm-gold-hell); border: 1px solid rgba(201, 162, 74, .4); border-radius: 999px;
}
/* Beantwortet-Zähler: macht sichtbar, warum der Pin noch kein Häkchen trägt. */
.fbm-card-zaehler {
  display: inline-block; margin: .6em 0 0 .5em; padding: .2em .65em;
  font-family: "IBM Plex Mono", monospace; font-size: .68rem;
  color: var(--fbm-dim); border: 1px solid var(--fbm-line); border-radius: 999px;
}
.fbm-x {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  background: rgba(247, 243, 232, .08); border: 1px solid var(--fbm-line);
  color: var(--fbm-cream); font-size: 1.25rem; line-height: 1;
}
.fbm-x:hover { background: rgba(247, 243, 232, .18); }

.fbm-card-body { padding: 18px 24px; overflow-y: auto; flex: 1 1 auto; }

/* Seitenanzeige, wenn ein Bereich mehr als eine Seite hat. */
.fbm-steps { display: flex; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
.fbm-steps li { height: 3px; flex: 1 1 0; border-radius: 999px; background: rgba(247, 243, 232, .16); }
.fbm-steps li.is-now { background: var(--fbm-gold); }
.fbm-steps li.is-done { background: rgba(201, 162, 74, .5); }

.fbm-page-title {
  margin: 0 0 14px; font-size: .7rem; letter-spacing: .15em; text-transform: uppercase;
  color: var(--fbm-gold-hell);
}

/* Kurzer Satz unter der Seitenüberschrift — erklärt vorbelegte Seiten. */
.fbm-page-hinweis {
  margin: -6px 0 16px;
  padding: 10px 13px;
  border-radius: 10px;
  background: rgba(198, 161, 91, .10);
  border-left: 3px solid var(--fbm-gold);
  font-size: .88rem; line-height: 1.55;
  color: var(--fbm-ink);
}

.fbm-field { margin-bottom: 16px; }
.fbm-field > label {
  display: block; margin-bottom: .4em; font-size: .93rem; font-weight: 600; color: var(--fbm-cream);
}
.fbm-field > p { margin: 0; font-size: .92rem; line-height: 1.6; color: var(--fbm-ink); }
.fbm-req { color: var(--fbm-gold); margin-left: .2em; }
.fbm-input-wrap { display: flex; align-items: stretch; }
.fbm-field input, .fbm-field select {
  width: 100%; min-width: 0; font: inherit; font-size: .96rem;
  padding: .68em .8em; border-radius: 10px;
  background: rgba(4, 12, 22, .6); color: var(--fbm-cream);
  border: 1px solid rgba(247, 243, 232, .22);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.fbm-field input:focus, .fbm-field select:focus {
  outline: none; border-color: var(--fbm-gold);
  box-shadow: 0 0 0 3px rgba(201, 162, 74, .2);
}
.fbm-field select { cursor: pointer; }
.fbm-field select option { background: var(--fbm-navy-2); color: var(--fbm-cream); }
.fbm-unit {
  flex: 0 0 auto; display: grid; place-items: center; padding: 0 .85em;
  margin-left: -1px; border: 1px solid rgba(247, 243, 232, .22);
  border-left: 0; border-radius: 0 10px 10px 0;
  background: rgba(247, 243, 232, .07); color: var(--fbm-dim);
  font-family: "IBM Plex Mono", monospace; font-size: .8rem; white-space: nowrap;
}
.fbm-input-wrap:has(.fbm-unit) input,
.fbm-input-wrap:has(.fbm-unit) select { border-radius: 10px 0 0 10px; }
.fbm-hint { margin: .4em 0 0; font-size: .8rem; color: var(--fbm-dim); line-height: 1.5; }

/* Fehlende Angabe: Das Feld wird markiert, statt still eine 0 anzunehmen. */
.fbm-field.is-fehlt > label { color: #F5B3A3; }
.fbm-field.is-fehlt input,
.fbm-field.is-fehlt select {
  border-color: rgba(232, 115, 92, .85);
  box-shadow: 0 0 0 3px rgba(232, 115, 92, .16);
}
.fbm-fehlt-hinweis {
  margin: .4em 0 0; font-size: .8rem; line-height: 1.5; color: #F5B3A3;
}
.fbm-fehlt-hinweis b { color: #FFD9D3; }
.fbm-hint b { color: var(--fbm-cream); }

.fbm-card-foot {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 14px 24px 18px; border-top: 1px solid var(--fbm-line);
  background: rgba(4, 12, 22, .4);
}
.fbm-card-foot .fbm-spacer { flex: 1 1 auto; }

/* ── Ergebnis-Modal: nimmt das bestehende Ergebnis-HTML unverändert auf ───────── */
.fbm-card--wide { width: min(1040px, 100%); }
.fbm-result { color: var(--fbm-cream); }
.fbm-result :where(h2, h3, h4) { color: var(--fbm-cream); }
.fbm-result a { color: var(--fbm-gold-hell); }

.fbm-errors {
  margin: 0 0 16px; padding: 12px 16px; border-radius: 12px;
  background: rgba(184, 74, 74, .18); border: 1px solid rgba(184, 74, 74, .55);
  color: #FFD9D3; font-size: .88rem;
}
.fbm-errors ul { margin: .4em 0 0; padding-left: 1.2em; }
.fbm-note {
  margin: 0 0 16px; padding: 12px 16px; border-radius: 12px;
  background: rgba(0, 124, 137, .16); border: 1px solid rgba(0, 150, 163, .5);
  color: #CFEDF1; font-size: .88rem; line-height: 1.5;
}
.fbm-muted { color: var(--fbm-dim); }
.fbm-card-body code {
  font-family: "IBM Plex Mono", monospace; font-size: .88em;
  background: rgba(247, 243, 232, .1); padding: .1em .4em; border-radius: 5px;
}

/* ── Responsiv ────────────────────────────────────────────────────────────────

   Hochformat und schmale Geräte: Die Stadt ist ein Querformat (1586 × 992). Vollständig in ein
   Hochformat eingepasst wäre sie nur noch ein schmales Band mit briefmarkengroßen Pins. Deshalb
   füllt sie dort die HÖHE und wird seitlich geschoben — die Pins bleiben prozentual auf ihrem
   Ort und damit alle erreichbar. Nur der Ausschnitt wandert, nicht die Marken.

   Schwelle 3:4: Darüber (Tablet quer 4:3, Handy quer, jeder Desktop) bleibt die ganze Stadt
   sichtbar, weil der freie Rand dort klein ist. Darunter (Tablet hoch, Handy hoch) wäre die
   eingepasste Stadt nur noch ein halb so hohes Band — dort ist Schieben das bessere Bild. */
/* Hochformat braucht keine Sonderregel mehr: Formatfüllend heißt dort automatisch, dass die
   Stadt die Höhe füllt und seitlich übersteht — geschoben wird ohnehin in beide Richtungen. */

/* Tablet und aufwärts: etwas kompaktere Pins, damit die Stadt Raum behält. */
@media (min-width: 1024px) {
  .fbm-pin { width: calc(var(--fbm-u) * 4.6); }
}

/* Handy: größere Pins (Fingerziel), Statusleiste gestapelt. */
@media (max-width: 640px) {
  .fbm-pin { width: calc(var(--fbm-u) * 6.4); }
  .fbm-top { top: 10px; left: 12px; max-width: 62%; }
  .fbm-claim { top: 38%; }
  .fbm-actions { top: 44px; right: 10px; gap: 6px; }
  .fbm-actions .fbm-btn { padding: .5em .7em; }
  /* Auf dem Handy ist neben der Leiste kein Platz. Stattdessen bleibt UNTEN ein Streifen frei,
     in dem das Goldene Buch liegt — der Leisteninhalt sitzt darüber. */
  .fbm-bottom { gap: 10px; padding: 10px 12px 62px; }
  .fbm-stats { gap: 14px; }
  .fbm-stat > b { max-width: 16ch; }
  .fbm-stat--prog { flex: 1 1 100%; }
  .fbm-bottom-cta { flex: 1 1 100%; }
  .fbm-bottom-cta .fbm-btn { flex: 1 1 0; justify-content: center; text-align: center; }
  .fbm-card { max-height: 92dvh; border-radius: 16px; }
  .fbm-card-head { padding: 16px 16px 12px; }
  .fbm-card-body { padding: 14px 16px; }
  .fbm-card-foot { padding: 12px 16px 14px; }
  .fbm-card-foot .fbm-btn { flex: 1 1 auto; justify-content: center; }
  .fbm-card-foot .fbm-spacer { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .fbm-pin.is-offen .fbm-pin-img { animation: none; }
  .fbm-pin-img, .fbm-pin-name, .fbm-bar i { transition: none; }
  .fbm-claim, .fbm-modal, .fbm-card { animation: none; }
}

/* Leinwandansicht (?screen=1): Die Stadt ist eine Teilnehmer-Oberfläche, kein Beamer-Bild.
   Auf der Leinwand bleibt sie ruhig stehen — keine Eingabe, keine Statusleiste. */
html.screen-view .fbm-bottom, html.screen-view .fbm-actions { display: none !important; }

/* ══ AUSWERTUNG — acht Vollbildseiten ═══════════════════════════════════════════
   Die Auswertung ist kein Fenster über der Stadt, sondern tritt an ihre Stelle. Jede Seite
   füllt den Bildschirm und trägt EINEN Gedanken. Navigation unten (Zurück · Punkte · Weiter),
   Überspringen oben rechts.

   Alle acht Seiten liegen im DOM, sichtbar ist nur die aktuelle. Das kostet nichts und macht
   den Ausdruck möglich: @media print zeigt sie untereinander (Blueprint herunterladen). */

/* BEWUSST OHNE Einblend-Animation auf dieser Ebene: Jeder Seitenwechsel zeichnet sie neu, die
   Animation liefe also jedes Mal — und während sie läuft, ist die Ebene halbdurchsichtig und
   die Fußzeile der Seite darunter scheint durch. Eingeblendet wird nur der Seiteninhalt. */
.fbr {
  position: fixed; inset: 0; z-index: 140;
  display: flex; flex-direction: column;
  background: var(--fbm-navy);
  color: var(--fbm-ink);
}

.fbr-skip {
  position: absolute; top: 48px; right: 14px; z-index: 3;
  font: inherit; font-size: clamp(.74rem, .9vw, .9rem); cursor: pointer;
  padding: .5em 1em; border-radius: 12px;
  background: rgba(10, 32, 54, .88); border: 1px solid rgba(247, 243, 232, .4);
  color: var(--fbm-cream);
  box-shadow: 0 2px 12px rgba(0, 0, 0, .5);
}
.fbr-skip:hover { background: rgba(247, 243, 232, .16); border-color: var(--fbm-cream); }

.fbr-pages { position: relative; flex: 1 1 auto; min-height: 0; }
.fbr-page {
  position: absolute; inset: 0;
  display: none; overflow-y: auto; overscroll-behavior: contain;
}
.fbr-page.is-now { display: block; animation: fbr-auf .35s ease both; }
@keyframes fbr-auf { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

/* Inhaltsspalte für die Textseiten. */
.fbr-inner {
  min-height: 100%;
  display: flex; flex-direction: column; justify-content: center;
  gap: clamp(14px, 2.2vh, 26px);
  /* box-sizing ist Pflicht: Ohne sie zählt der Innenabstand ZUSÄTZLICH zu den 100 %,
     und auf dem Handy steht jede Ergebnisseite rund 40 px über den Bildschirmrand hinaus.
     Sichtbar wurde das erst beim Mobiltest — die Seite scrollt dann waagerecht. */
  width: min(880px, 100%); box-sizing: border-box; margin: 0 auto;
  padding: clamp(64px, 9vh, 96px) clamp(18px, 4vw, 40px) clamp(24px, 4vh, 40px);
}

/* Bildseiten (1 und 8): die ausgebaute Stadt im Abendlicht als ganze Fläche. */
.fbr-hero {
  position: relative; min-height: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: clamp(64px, 9vh, 96px) clamp(18px, 4vw, 40px) clamp(24px, 4vh, 40px);
  background: var(--fbm-navy-2) var(--fbr-bild) center / cover no-repeat;
}
/* Nur so viel abdunkeln, wie die Schrift braucht: ein weicher Kreis hinter dem Text, dazu
   eine leichte Kante oben und unten. Das Abendlicht soll die Hauptfigur bleiben. */
.fbr-hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(56% 44% at 50% 50%, rgba(4, 12, 22, .6) 0%, rgba(4, 12, 22, .16) 68%, rgba(4, 12, 22, 0) 100%),
    linear-gradient(180deg, rgba(4, 12, 22, .38) 0%, rgba(4, 12, 22, 0) 30%, rgba(4, 12, 22, 0) 70%, rgba(4, 12, 22, .45) 100%);
}
.fbr-hero-inner {
  position: relative; width: min(760px, 100%); text-align: center;
  display: flex; flex-direction: column; gap: clamp(12px, 2vh, 22px);
}

/* ── Typografie der Seiten ──────────────────────────────────────────────────── */
.fbr-kicker {
  margin: 0; font-size: clamp(.66rem, .85vw, .82rem);
  letter-spacing: .2em; text-transform: uppercase; color: var(--fbm-gold-hell);
}
.fbr-titel {
  margin: 0; font-family: Cormorant, Georgia, serif; font-weight: 700;
  font-size: clamp(1.7rem, 4vw, 3.1rem); line-height: 1.12; color: var(--fbm-cream);
  letter-spacing: .01em;
}
.fbr-text {
  margin: 0; font-size: clamp(.92rem, 1.15vw, 1.08rem); line-height: 1.65;
  color: var(--fbm-ink); opacity: .92;
}
.fbr-text--mitte { text-align: center; max-width: 60ch; margin-inline: auto; }
.fbr-leitsatz {
  margin: 0; font-family: Cormorant, Georgia, serif; font-style: italic;
  font-size: clamp(1.1rem, 2.1vw, 1.6rem); color: var(--fbm-gold-hell); line-height: 1.4;
}

/* ── Seite 2 · Vergleich Heute ↔ Vision ─────────────────────────────────────── */
.fbr-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fbr-split-half { margin: 0; position: relative; }
/* Die Höhe ist gedeckelt: Sonst schieben die beiden Bilder auf flachen Fenstern die
   Vergleichszeilen darunter aus dem Bild. */
.fbr-split-bild {
  display: block; width: 100%; aspect-ratio: 16 / 9; max-height: 26vh; border-radius: 14px;
  background-size: cover; background-position: center;
  border: 1px solid rgba(247, 243, 232, .18);
  filter: saturate(.55) brightness(.7);
}
.fbr-split-half.is-vision .fbr-split-bild {
  filter: none; border-color: rgba(201, 162, 74, .6);
  box-shadow: 0 0 26px rgba(201, 162, 74, .25);
}
.fbr-split-half figcaption {
  margin-top: 8px; text-align: center;
  font-size: clamp(.7rem, .9vw, .84rem); letter-spacing: .16em; text-transform: uppercase;
  color: var(--fbm-dim);
}
.fbr-split-half.is-vision figcaption { color: var(--fbm-gold-hell); }

.fbr-vergleich { display: flex; flex-direction: column; gap: 2px; }
.fbr-vgl-zeile {
  display: grid; grid-template-columns: 1fr auto auto auto; align-items: center;
  gap: clamp(8px, 2vw, 20px);
  padding: clamp(10px, 1.6vh, 16px) 0;
  border-bottom: 1px solid var(--fbm-line);
}
.fbr-vgl-zeile:last-child { border-bottom: 0; }
.fbr-vgl-label {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
  font-size: clamp(.86rem, 1.05vw, 1rem); font-weight: 600; color: var(--fbm-cream);
}
.fbr-vgl-label small { font-weight: 400; font-size: .76rem; color: var(--fbm-dim); line-height: 1.35; }
.fbr-vgl-heute, .fbr-vgl-vision {
  font-family: "IBM Plex Mono", monospace; white-space: nowrap;
  font-size: clamp(.9rem, 1.3vw, 1.2rem);
}
.fbr-vgl-heute { color: var(--fbm-dim); }
.fbr-vgl-vision { color: var(--fbm-gold-hell); }
.fbr-vgl-pfeil { color: rgba(247, 243, 232, .35); }

/* ── Seite 3 · Die Brücke ───────────────────────────────────────────────────────
   Links steht, was ohnehin kommt. Rechts das Ziel. Dazwischen fehlt Fahrbahn. */
.fbr-bruecke { width: min(760px, 100%); margin: clamp(30px, 6vh, 60px) auto 0; }

.fbr-bruecke-deck { display: flex; align-items: flex-end; height: 20px; }
.fbr-deck-fest {
  height: 20px; border-radius: 5px 0 0 5px;
  background: linear-gradient(180deg, var(--fbm-gold-hell) 0%, var(--fbm-gold) 55%, #9A7626 100%);
  box-shadow: 0 3px 20px rgba(201, 162, 74, .5);
}
/* Das fehlende Stück: angedeutete Fahrbahn, nicht gebaut. */
.fbr-deck-luecke {
  position: relative; height: 20px; border-radius: 0 5px 5px 0;
  background: repeating-linear-gradient(90deg,
    rgba(247, 243, 232, .22) 0 9px, transparent 9px 20px);
  border-top: 2px dashed rgba(247, 243, 232, .5);
  border-bottom: 2px dashed rgba(247, 243, 232, .22);
}
.fbr-deck-luecke b {
  position: absolute; left: 50%; bottom: calc(100% + 14px); transform: translateX(-50%);
  display: block; white-space: nowrap;
  font-family: "IBM Plex Mono", monospace; font-weight: 600;
  font-size: clamp(1.3rem, 3.2vw, 2.4rem); color: var(--fbm-cream);
  text-shadow: 0 2px 16px rgba(0, 0, 0, .8);
}
.fbr-deck-luecke b i { font-style: normal; font-size: .45em; color: var(--fbm-dim); }
.fbr-deck-luecke small {
  position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%);
  font-size: clamp(.66rem, .85vw, .8rem); letter-spacing: .18em; text-transform: uppercase;
  color: var(--fbm-gold-hell); white-space: nowrap;
}

/* Unter der Fahrbahn: die beiden Pfeiler. Sie stehen genau an den Enden des Decks und tragen
   die Beschriftung. Die dünne Linie darunter ist der Grund, auf dem sie stehen. */
.fbr-bruecke-pfeiler {
  position: relative; display: flex; justify-content: space-between;
  align-items: flex-start; gap: 16px;
}
.fbr-bruecke-pfeiler::after {
  content: ""; position: absolute; left: 0; right: 0; top: clamp(46px, 7.5vh, 74px); height: 1px;
  background: linear-gradient(90deg,
    rgba(247, 243, 232, .28), rgba(247, 243, 232, .08) 50%, rgba(247, 243, 232, .28));
}
.fbr-pfeiler {
  position: relative; flex: 0 1 clamp(150px, 34%, 260px);
  padding-top: clamp(56px, 9vh, 88px);
  display: flex; flex-direction: column; gap: 3px;
}
/* Die Säule, die die Fahrbahn trägt. */
.fbr-pfeiler::before {
  content: ""; position: absolute; top: 0; left: 0; width: 11px;
  height: clamp(46px, 7.5vh, 74px); border-radius: 0 0 3px 3px;
  background: linear-gradient(180deg, var(--fbm-gold) 0%, rgba(201, 162, 74, .55) 60%, rgba(201, 162, 74, .2) 100%);
}
.fbr-pfeiler.is-ziel { text-align: right; align-items: flex-end; }
.fbr-pfeiler.is-ziel::before { left: auto; right: 0; }
.fbr-pfeiler b {
  font-family: "IBM Plex Mono", monospace; font-size: clamp(1rem, 1.7vw, 1.4rem);
  color: var(--fbm-cream);
}
.fbr-pfeiler b i { font-style: normal; font-size: .6em; color: var(--fbm-dim); }
.fbr-pfeiler > span {
  font-size: clamp(.76rem, .95vw, .9rem); font-weight: 600; color: var(--fbm-gold-hell);
}
.fbr-pfeiler small { font-size: .74rem; color: var(--fbm-dim); line-height: 1.4; }

/* ── Seite 4 · Der Weg ──────────────────────────────────────────────────────── */
.fbr-weg { list-style: none; margin: 0; padding: 0 0 0 30px; position: relative; }
.fbr-weg::before {
  content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 2px;
  background: linear-gradient(180deg, rgba(0, 150, 163, .7), rgba(201, 162, 74, .85));
}
.fbr-weg-punkt { position: relative; padding: 0 0 clamp(16px, 2.6vh, 26px); }
.fbr-weg-punkt:last-child { padding-bottom: 0; }
.fbr-weg-marke {
  position: absolute; left: -30px; top: 4px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--fbm-navy); border: 2px solid rgba(247, 243, 232, .45);
}
.fbr-weg-punkt.is-start .fbr-weg-marke { border-color: var(--fbm-teal-hell); background: var(--fbm-teal); }
.fbr-weg-punkt.is-ziel .fbr-weg-marke {
  border-color: var(--fbm-gold); background: var(--fbm-gold);
  box-shadow: 0 0 14px rgba(201, 162, 74, .7);
}
.fbr-weg-punkt b {
  display: block; font-size: clamp(.72rem, .9vw, .86rem);
  letter-spacing: .16em; text-transform: uppercase; color: var(--fbm-gold-hell);
}
.fbr-weg-punkt.is-start b { color: var(--fbm-teal-hell); }
.fbr-weg-punkt p {
  margin: 3px 0 0; font-size: clamp(.9rem, 1.1vw, 1.05rem); line-height: 1.5; color: var(--fbm-cream);
}

/* ── Seite 5 · Vier Kennzahlen ──────────────────────────────────────────────── */
/* Früher immer zwei Spalten — das stammte aus der Seite mit genau vier Kennzahlen. Die
   Machbarkeitsseite zeigt drei; die dritte stünde sonst allein in einer zweiten Reihe. */
.fbr-kennzahlen {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
  gap: clamp(10px, 1.8vw, 18px); width: 100%;
}
.fbr-kz {
  display: flex; flex-direction: column; gap: 4px;
  padding: clamp(16px, 2.6vh, 28px) clamp(14px, 2vw, 24px);
  border-radius: 18px; border: 1px solid rgba(201, 162, 74, .3);
  background: linear-gradient(165deg, rgba(14, 42, 71, .9), rgba(7, 26, 47, .9));
}
.fbr-kz b {
  font-family: "IBM Plex Mono", monospace; font-weight: 600;
  font-size: clamp(1.5rem, 3.4vw, 2.6rem); line-height: 1.05; color: var(--fbm-gold-hell);
}
.fbr-kz b i { font-style: normal; font-size: .42em; color: var(--fbm-dim); margin-left: .25em; }
.fbr-kz > span { font-size: clamp(.82rem, 1vw, .96rem); font-weight: 600; color: var(--fbm-cream); }
.fbr-kz small { font-size: .78rem; color: var(--fbm-dim); line-height: 1.45; }

/* ── Seite 6 · Schutzschild ─────────────────────────────────────────────────── */
.fbr-schilde { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 1.8vw, 18px); }
.fbr-schild {
  display: flex; flex-direction: column; gap: 6px;
  padding: clamp(14px, 2.4vh, 24px) clamp(14px, 2vw, 22px);
  border-radius: 18px; border: 1px solid var(--fbm-line);
  background: rgba(14, 42, 71, .7);
}
.fbr-schild-status {
  align-self: flex-start; padding: .2em .7em; border-radius: 999px;
  font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
}
.fbr-schild.is-ok { border-color: rgba(109, 175, 123, .55); }
.fbr-schild.is-ok .fbr-schild-status { background: rgba(109, 175, 123, .2); color: #A8DDB4; }
.fbr-schild.is-teil { border-color: rgba(224, 162, 58, .55); }
.fbr-schild.is-teil .fbr-schild-status { background: rgba(224, 162, 58, .2); color: #F2CE86; }
.fbr-schild.is-offen { border-color: rgba(232, 115, 92, .55); }
.fbr-schild.is-offen .fbr-schild-status { background: rgba(232, 115, 92, .2); color: #F5B3A3; }
.fbr-schild b { font-size: clamp(.98rem, 1.3vw, 1.15rem); color: var(--fbm-cream); }
.fbr-schild-wert { font-family: "IBM Plex Mono", monospace; font-size: .88rem; color: var(--fbm-gold-hell); }
.fbr-schild p { margin: 0; font-size: .86rem; line-height: 1.5; color: var(--fbm-dim); }

/* ── Seite 7 · Drei Schritte ────────────────────────────────────────────────── */
.fbr-schritte { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: clamp(10px, 1.8vh, 18px); }
.fbr-schritt {
  display: flex; gap: clamp(14px, 2vw, 22px); align-items: flex-start;
  padding: clamp(14px, 2.4vh, 24px) clamp(14px, 2vw, 24px);
  border-radius: 18px; border: 1px solid rgba(201, 162, 74, .28);
  background: linear-gradient(165deg, rgba(14, 42, 71, .9), rgba(7, 26, 47, .9));
}
.fbr-schritt-nr {
  flex: 0 0 auto; width: clamp(38px, 5vw, 52px); aspect-ratio: 1;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--fbm-gold); color: #221806;
  font-family: "IBM Plex Mono", monospace; font-weight: 700;
  font-size: clamp(1.1rem, 1.9vw, 1.5rem);
}
.fbr-schritt b { display: block; font-size: clamp(1rem, 1.35vw, 1.2rem); color: var(--fbm-cream); }
.fbr-schritt p { margin: 5px 0 0; font-size: .9rem; line-height: 1.55; color: var(--fbm-dim); }

/* ── Seite 8 · Blueprint ────────────────────────────────────────────────────── */
.fbr-urkunde {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px clamp(14px, 3vw, 30px);
  align-items: baseline; text-align: left;
  width: min(520px, 100%); box-sizing: border-box; margin: clamp(10px, 2vh, 20px) auto 0;
  padding: clamp(16px, 2.6vh, 26px) clamp(16px, 3vw, 28px);
  border-radius: 18px; border: 1px solid rgba(201, 162, 74, .5);
  background: rgba(7, 26, 47, .78); backdrop-filter: blur(4px);
}
.fbr-urkunde span {
  font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--fbm-dim);
}
.fbr-urkunde b {
  font-family: "IBM Plex Mono", monospace; font-size: clamp(.95rem, 1.3vw, 1.15rem);
  color: var(--fbm-gold-hell); min-width: 0; overflow-wrap: anywhere;
}
.fbr-urkunde-vision {
  font-family: Cormorant, Georgia, serif !important; font-style: italic;
  font-size: clamp(1rem, 1.5vw, 1.25rem) !important; color: var(--fbm-cream) !important;
}
.fbr-cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: clamp(8px, 1.6vh, 16px); }
.fbr-fuss { margin: 0; font-size: .86rem; color: var(--fbm-dim); }

/* ── Navigation ─────────────────────────────────────────────────────────────── */
.fbr-nav {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: clamp(12px, 2vh, 18px) clamp(14px, 3vw, 28px);
  border-top: 1px solid rgba(201, 162, 74, .22);
  background: rgba(4, 12, 22, .9);
}
.fbr-punkte { display: flex; gap: 7px; }
.fbr-punkt {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(247, 243, 232, .22);
}
.fbr-punkt.is-done { background: rgba(201, 162, 74, .55); }
.fbr-punkt.is-now { background: var(--fbm-gold); box-shadow: 0 0 8px rgba(201, 162, 74, .8); }

@media (max-width: 640px) {
  .fbr-split { grid-template-columns: 1fr; }
  .fbr-kennzahlen, .fbr-schilde { grid-template-columns: 1fr; }
  .fbr-vgl-zeile { grid-template-columns: 1fr auto; row-gap: 4px; }
  .fbr-vgl-label { grid-column: 1 / -1; }
  .fbr-vgl-pfeil { display: none; }
  .fbr-skip { top: 44px; right: 10px; }
  .fbr-nav .fbm-btn { flex: 0 0 auto; }
  .fbr-bruecke-pfeiler { gap: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  .fbr, .fbr-page.is-now { animation: none; }
}

/* ═══════════════════════════════════════════════════════════════════════════════
   Auswertung v2 — die zusätzlichen Seiten (Zahlen, Ziel, Kapital, Machbarkeit,
   Engpässe, Dialog, Routen, Cockpit, 90-Tage-Plan, Meilensteine).
   Farben und Radien stammen aus denselben Tokens wie die bestehenden Seiten.
   ═══════════════════════════════════════════════════════════════════════════════ */

/* Seiten mit Listen und Karten brauchen mehr Breite als die Kennzahlenseiten. */
.fbr-inner--weit { width: min(1180px, 100%); max-width: none; }

/* ── Hinweise ────────────────────────────────────────────────────────────────── */
.fbr-hinweis {
  margin: 12px 0 0; padding: 12px 16px; border-radius: 14px;
  border: 1px solid rgba(201, 162, 74, .28); background: rgba(7, 26, 47, .55);
  font-size: .84rem; line-height: 1.55; color: var(--fbm-dim);
}
.fbr-hinweis b { color: var(--fbm-gold-hell); font-weight: 700; }
.fbr-hinweise { display: flex; flex-direction: column; gap: 8px; margin-top: clamp(14px, 2.2vh, 24px); }
/* ── Schutzschild auf Seite 7 ───────────────────────────────────────────────── */
.fbr-schutz { width: 100%; margin-top: clamp(8px, 1.4vh, 16px); }
.fbr-schutz-titel {
  margin: 0; font-family: Cormorant, Georgia, serif;
  font-size: clamp(1.15rem, 2vw, 1.5rem); color: var(--fbm-cream); font-weight: 600;
}
.fbr-schutz-frage {
  margin: 2px 0 10px; font-size: clamp(.9rem, 1.1vw, 1rem); color: var(--fbm-gold-hell);
}

/* ── Einwilligung und PDF-Rückmeldung ───────────────────────────────────────── */
.fbr-einwilligung { margin-top: clamp(10px, 1.8vh, 18px); }
.fbr-einwilligung .fbr-optionen { justify-content: center; }
.fbr-einwilligung-hinweis {
  margin: 8px 0 0; font-size: .78rem; line-height: 1.5; color: var(--fbm-dim); text-align: center;
}
.fbr-kontakt {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
  gap: 10px; margin-top: 12px; text-align: left;
}
.fbr-kontakt label {
  display: flex; flex-direction: column; gap: 4px;
  font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--fbm-dim);
}
.fbr-kontakt input {
  font: inherit; font-size: .95rem; padding: .55em .7em; border-radius: 10px;
  border: 1px solid var(--fbm-line); background: rgba(7, 26, 47, .6); color: var(--fbm-ink);
  text-transform: none; letter-spacing: normal;
}
.fbr-kontakt input:focus-visible { outline: 2px solid var(--fbm-teal-hell); outline-offset: 2px; }
.fbr-kontakt p {
  grid-column: 1 / -1; margin: 0; font-size: .76rem; line-height: 1.5;
  color: var(--fbm-dim); text-align: center; text-transform: none; letter-spacing: normal;
}
.fbr-uebergabe { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.fbr-code {
  width: 100%; box-sizing: border-box; font-family: "IBM Plex Mono", monospace;
  font-size: .68rem; line-height: 1.5; padding: 10px; border-radius: 10px;
  border: 1px solid rgba(201, 162, 74, .4); background: rgba(7, 26, 47, .75);
  color: var(--fbm-gold-hell); resize: vertical; word-break: break-all;
}
.fbr-uebergabe p { margin: 0; font-size: .76rem; line-height: 1.5; color: var(--fbm-dim); text-align: center; }
.fbr-pdf-status {
  margin: 6px 0 0; font-size: .84rem; color: var(--fbm-gold-hell); text-align: center;
}
.fbr-urkunde-fuss {
  margin: 8px 0 0; font-size: .82rem; line-height: 1.5; color: var(--fbm-dim); text-align: center;
}
.fbr-kennung {
  margin: 4px 0 0; font-family: "IBM Plex Mono", monospace;
  font-size: .72rem; color: var(--fbm-dim); letter-spacing: .04em;
}

/* ── Seite 2 · Mein Leben in Zahlen ──────────────────────────────────────────── */
.fbr-fluss { display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 14px); width: 100%; }
.fbr-fluss-zeile {
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) auto;
  align-items: center; gap: clamp(10px, 1.6vw, 20px);
  padding: clamp(10px, 1.6vh, 16px) clamp(12px, 1.8vw, 20px);
  border-radius: 16px; border: 1px solid var(--fbm-line); background: rgba(14, 42, 71, .6);
}
.fbr-fluss-label { display: flex; flex-direction: column; gap: 2px; font-weight: 600; color: var(--fbm-cream); }
.fbr-fluss-label small { font-weight: 400; font-size: .76rem; color: var(--fbm-dim); line-height: 1.4; }
.fbr-fluss-balken { display: block; height: 10px; border-radius: 999px; background: rgba(247, 243, 232, .1); overflow: hidden; }
.fbr-fluss-balken i { display: block; height: 100%; border-radius: 999px; background: var(--fbm-teal-hell); transition: width .5s ease; }
.fbr-fluss-wert { font-family: "IBM Plex Mono", monospace; font-size: clamp(1rem, 1.7vw, 1.35rem); color: var(--fbm-cream); white-space: nowrap; }
.fbr-fluss-zeile.is-aus .fbr-fluss-balken i { background: rgba(232, 115, 92, .75); }
.fbr-fluss-zeile.is-summe { border-color: rgba(201, 162, 74, .35); }
.fbr-fluss-zeile.is-summe .fbr-fluss-balken i { background: var(--fbm-gold); }
.fbr-fluss-zeile.is-frei { border-color: rgba(201, 162, 74, .6); background: rgba(7, 26, 47, .85); }
.fbr-fluss-zeile.is-frei .fbr-fluss-wert { color: var(--fbm-gold-hell); font-weight: 600; }
.fbr-fluss-zeile.is-frei .fbr-fluss-balken i { background: var(--fbm-gold-hell); }

/* ── Was die Wünsche an Zeit kosten (Seite 2) ────────────────────────────────── */
.fbr-wunschkosten {
  width: 100%; box-sizing: border-box; margin-top: clamp(6px, 1.2vh, 12px);
  padding: clamp(12px, 1.8vh, 18px) clamp(14px, 2vw, 22px);
  border-radius: 16px; border: 1px solid rgba(232, 115, 92, .4); background: rgba(232, 115, 92, .07);
}
.fbr-wunschkosten h3 {
  margin: 0 0 8px; font-family: Cormorant, Georgia, serif; font-weight: 600;
  font-size: clamp(1.05rem, 1.7vw, 1.3rem); color: var(--fbm-cream);
}
.fbr-wunschkosten ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.fbr-wunschkosten li { font-size: .89rem; line-height: 1.5; color: var(--fbm-ink); }
.fbr-wunschkosten li b { color: var(--fbm-gold-hell); font-weight: 600; }
.fbr-wunschkosten p { margin: 8px 0 0; font-size: .8rem; line-height: 1.5; color: var(--fbm-dim); }

/* ── Herleitungen (Seite 3 und 5) ────────────────────────────────────────────── */
.fbr-herleitung {
  width: 100%; display: flex; flex-direction: column;
  border-radius: 18px; border: 1px solid var(--fbm-line); overflow: hidden;
  background: rgba(14, 42, 71, .6);
}
.fbr-herl-zeile {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: clamp(9px, 1.5vh, 14px) clamp(14px, 2vw, 22px);
  border-bottom: 1px solid var(--fbm-line); font-size: clamp(.86rem, 1.1vw, 1rem);
}
.fbr-herl-zeile:last-child { border-bottom: none; }
.fbr-herl-zeile span { color: var(--fbm-dim); }
.fbr-herl-zeile b { font-family: "IBM Plex Mono", monospace; color: var(--fbm-cream); white-space: nowrap; }
.fbr-herl-zeile.is-summe { background: rgba(201, 162, 74, .1); }
.fbr-herl-zeile.is-summe span { color: var(--fbm-cream); font-weight: 600; }
.fbr-herl-zeile.is-summe b { color: var(--fbm-gold-hell); font-size: 1.15em; }

/* ── Seite 4 · Zwei Phasen ───────────────────────────────────────────────────── */
.fbr-phasen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 1.8vw, 18px); width: 100%; }
.fbr-phase {
  display: flex; flex-direction: column; gap: 6px;
  padding: clamp(14px, 2.2vh, 22px) clamp(14px, 2vw, 22px);
  border-radius: 18px; border: 1px solid rgba(232, 115, 92, .4); background: rgba(14, 42, 71, .7);
}
.fbr-phase.is-danach { border-color: rgba(109, 175, 123, .45); }
.fbr-phase b { font-size: clamp(1rem, 1.4vw, 1.2rem); color: var(--fbm-gold-hell); font-family: "IBM Plex Mono", monospace; }
.fbr-phase > span { font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fbm-dim); font-weight: 700; }
.fbr-phase p { margin: 0; font-size: .88rem; line-height: 1.55; color: var(--fbm-cream); }

/* ── Seite 5 · Zielkapital ───────────────────────────────────────────────────── */
.fbr-stapel { display: flex; width: 100%; gap: 8px; min-height: clamp(90px, 14vh, 150px); }
.fbr-stapel-teil {
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;
  border-radius: 18px; padding: 12px; text-align: center; min-width: 0;
  border: 1px solid rgba(201, 162, 74, .35);
  background: linear-gradient(165deg, rgba(14, 42, 71, .9), rgba(7, 26, 47, .9));
}
.fbr-stapel-teil.is-bruecke { border-color: rgba(232, 115, 92, .45); }
.fbr-stapel-teil b { font-family: "IBM Plex Mono", monospace; font-size: clamp(1.1rem, 2.2vw, 1.8rem); color: var(--fbm-gold-hell); }
.fbr-stapel-teil span { font-size: .8rem; color: var(--fbm-dim); }
.fbr-nichtgezaehlt {
  width: 100%; box-sizing: border-box; padding: clamp(12px, 1.8vh, 18px) clamp(14px, 2vw, 22px);
  border-radius: 16px; border: 1px dashed var(--fbm-line); background: rgba(7, 26, 47, .5);
}
.fbr-nichtgezaehlt b { display: block; margin-bottom: 6px; font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fbm-dim); }
.fbr-nichtgezaehlt ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.fbr-nichtgezaehlt li { font-size: .85rem; line-height: 1.5; color: var(--fbm-cream); }

/* ── Ampel (Seite 6 und Cockpit) ─────────────────────────────────────────────── */
.fbr-ampel, .fbr-cockpit-ampel {
  display: inline-flex; align-items: center; gap: 10px;
  padding: .45em 1.1em; border-radius: 999px; border: 1px solid var(--fbm-line);
  background: rgba(7, 26, 47, .7);
}
.fbr-ampel b, .fbr-cockpit-ampel b { font-size: clamp(.86rem, 1.1vw, 1rem); letter-spacing: .04em; }
.fbr-ampel-punkt { width: 12px; height: 12px; border-radius: 50%; background: var(--fbm-dim); flex: none; }
.is-gruen .fbr-ampel-punkt { background: #6DAF7B; box-shadow: 0 0 12px rgba(109, 175, 123, .7); }
.is-gruen b { color: #A8DDB4; }
.is-gelb .fbr-ampel-punkt { background: #E0A23A; box-shadow: 0 0 12px rgba(224, 162, 58, .7); }
.is-gelb b { color: #F2CE86; }
.is-orange .fbr-ampel-punkt { background: #E8735C; box-shadow: 0 0 12px rgba(232, 115, 92, .7); }
.is-orange b { color: #F5B3A3; }
.is-rot .fbr-ampel-punkt { background: #C94C4C; box-shadow: 0 0 12px rgba(201, 76, 76, .7); }
.is-rot b { color: #F0A9A9; }
.is-blau .fbr-ampel-punkt { background: #23B7C7; box-shadow: 0 0 12px rgba(35, 183, 199, .7); }
.is-blau b { color: #9BE2EC; }

.fbr-gruende {
  width: 100%; box-sizing: border-box; padding: clamp(12px, 1.8vh, 18px) clamp(14px, 2vw, 22px);
  border-radius: 16px; border: 1px solid rgba(201, 76, 76, .4); background: rgba(201, 76, 76, .08);
}
.fbr-gruende b { display: block; margin-bottom: 6px; color: #F0A9A9; font-size: .9rem; }
.fbr-gruende ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.fbr-gruende li { font-size: .88rem; line-height: 1.5; color: var(--fbm-cream); }

/* ── Seite 7 · Engpässe und Dialog ───────────────────────────────────────────── */
.fbr-engpaesse { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: clamp(8px, 1.3vh, 13px); }
.fbr-engpass {
  display: flex; gap: clamp(12px, 1.6vw, 18px); align-items: flex-start;
  padding: clamp(12px, 1.8vh, 18px) clamp(14px, 2vw, 20px);
  border-radius: 16px; border: 1px solid var(--fbm-line); background: rgba(14, 42, 71, .65);
}
.fbr-engpass.is-hoch { border-color: rgba(232, 115, 92, .5); }
.fbr-engpass.is-mittel { border-color: rgba(224, 162, 58, .4); }
.fbr-engpass-nr {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-family: "IBM Plex Mono", monospace; font-weight: 600;
  background: rgba(201, 162, 74, .18); color: var(--fbm-gold-hell); font-size: .9rem;
}
.fbr-engpass b { display: block; margin-bottom: 3px; color: var(--fbm-cream); font-size: clamp(.95rem, 1.2vw, 1.08rem); }
.fbr-engpass p { margin: 0; font-size: .87rem; line-height: 1.55; color: var(--fbm-dim); }

.fbr-dialog { width: 100%; display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 16px); margin-top: clamp(10px, 1.8vh, 20px); }
.fbr-dialog-kopf { margin: 0; font-size: .9rem; line-height: 1.55; color: var(--fbm-dim); }
.fbr-frage { border: none; margin: 0; padding: 0; min-width: 0; }
.fbr-frage legend { padding: 0 0 8px; font-size: clamp(.95rem, 1.2vw, 1.1rem); font-weight: 600; color: var(--fbm-cream); }
.fbr-optionen { display: flex; flex-wrap: wrap; gap: 8px; }
.fbr-option {
  font: inherit; cursor: pointer; padding: .55em 1.1em; border-radius: 999px;
  border: 1px solid var(--fbm-line); background: rgba(14, 42, 71, .7); color: var(--fbm-cream);
  font-size: .88rem; transition: border-color .18s ease, background .18s ease, color .18s ease;
}
.fbr-option:hover { border-color: rgba(201, 162, 74, .5); }
.fbr-option.is-gewaehlt { border-color: var(--fbm-gold); background: rgba(201, 162, 74, .18); color: var(--fbm-gold-hell); font-weight: 600; }
.fbr-frage--hell legend { color: var(--fbm-ink); }

/* ── Seite 8 · Routen ────────────────────────────────────────────────────────── */
.fbr-routen { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: clamp(10px, 1.6vw, 18px); width: 100%; }
.fbr-route {
  display: flex; flex-direction: column; gap: 10px;
  padding: clamp(14px, 2.2vh, 22px) clamp(14px, 2vw, 20px);
  border-radius: 18px; border: 1px solid var(--fbm-line); background: rgba(14, 42, 71, .7);
}
.fbr-route.is-gewaehlt { border-color: var(--fbm-gold); background: rgba(201, 162, 74, .1); }
.fbr-route.is-offen { border-style: dashed; }
.fbr-route-kopf b { display: block; font-size: clamp(1rem, 1.3vw, 1.15rem); color: var(--fbm-cream); }
.fbr-route-kopf span { font-size: .83rem; line-height: 1.5; color: var(--fbm-dim); }
.fbr-route-liste { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.fbr-route-liste li { font-size: .88rem; line-height: 1.5; color: var(--fbm-ink); }
.fbr-route-zahlen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: auto; }
.fbr-route-zahlen div { min-width: 0; }
.fbr-route-zahlen div { display: flex; flex-direction: column; gap: 2px; }
.fbr-route-zahlen b {
  font-family: "IBM Plex Mono", monospace; font-size: clamp(.82rem, 1.1vw, 1.05rem);
  color: var(--fbm-gold-hell); overflow-wrap: anywhere;
}
/* „Rechenannahme“ ist länger als die schmale Spalte. Deutsche Trennung zuerst, hartes
   Umbrechen nur als letzter Ausweg — sonst schiebt ein einzelnes Wort die Karte auf. */
.fbr-route-zahlen span {
  font-size: .72rem; color: var(--fbm-dim);
  hyphens: auto; overflow-wrap: anywhere;
}
.fbr-route-hinweis { margin: 0; font-size: .82rem; line-height: 1.5; color: var(--fbm-dim); }
.fbr-weg-liste { margin: 0 0 clamp(12px, 2vh, 20px); padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.fbr-weg-liste li { font-size: clamp(.92rem, 1.2vw, 1.05rem); color: var(--fbm-ink); }

/* ── Seite 9 · Cockpit ───────────────────────────────────────────────────────── */
.fbr-cockpit {
  width: 100%; display: grid; gap: clamp(12px, 2vw, 22px);
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  align-items: start;
}
.fbr-cockpit-regler { display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 14px); }
.fbr-regler {
  display: flex; flex-direction: column; gap: 5px;
  padding: clamp(10px, 1.5vh, 15px) clamp(12px, 1.6vw, 18px);
  border-radius: 16px; border: 1px solid var(--fbm-line); background: rgba(14, 42, 71, .6);
}
.fbr-regler-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.fbr-regler-kopf b { font-size: .92rem; color: var(--fbm-cream); }
.fbr-regler-kopf i {
  font-style: normal; font-family: "IBM Plex Mono", monospace;
  font-size: .86rem; color: var(--fbm-gold-hell); text-align: right;
}
.fbr-regler small { font-size: .74rem; color: var(--fbm-dim); line-height: 1.4; }
.fbr-regler input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 22px;
  background: transparent; cursor: pointer; margin: 0;
}
.fbr-regler input[type="range"]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 999px; background: rgba(247, 243, 232, .16);
}
.fbr-regler input[type="range"]::-moz-range-track {
  height: 6px; border-radius: 999px; background: rgba(247, 243, 232, .16);
}
.fbr-regler input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 20px; height: 20px; margin-top: -7px;
  border-radius: 50%; background: var(--fbm-gold); border: 2px solid var(--fbm-navy);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .45);
}
.fbr-regler input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--fbm-gold); border: 2px solid var(--fbm-navy);
}
.fbr-regler input[type="range"]:focus-visible { outline: 2px solid var(--fbm-teal-hell); outline-offset: 4px; }

.fbr-cockpit-ausgabe {
  display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 16px); align-items: flex-start;
  padding: clamp(14px, 2.2vh, 22px) clamp(14px, 2vw, 20px);
  border-radius: 18px; border: 1px solid rgba(201, 162, 74, .3);
  background: linear-gradient(165deg, rgba(14, 42, 71, .9), rgba(7, 26, 47, .92));
  position: sticky; top: 0;
}
.fbr-cockpit-werte { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; }
.fbr-cw { display: flex; flex-direction: column; gap: 2px; }
.fbr-cw b { font-family: "IBM Plex Mono", monospace; font-size: clamp(1.05rem, 1.9vw, 1.5rem); color: var(--fbm-cream); }
.fbr-cw span { font-size: .76rem; color: var(--fbm-dim); }
.fbr-cw.is-betont { grid-column: 1 / -1; padding-top: 8px; border-top: 1px solid var(--fbm-line); }
.fbr-cw.is-betont b { color: var(--fbm-gold-hell); font-size: clamp(1.3rem, 2.6vw, 2rem); }
.fbr-cockpit-extra {
  grid-column: 1 / -1; margin: 0; padding: 8px 14px; border-radius: 12px;
  border: 1px dashed rgba(201, 162, 74, .4); background: rgba(201, 162, 74, .07);
  font-size: .82rem; color: var(--fbm-gold-hell);
}
.fbr-cockpit-fuss { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.fbr-cockpit-fuss p { margin: 0; flex: 1 1 320px; font-size: .78rem; line-height: 1.5; color: var(--fbm-dim); }
.fbr-cockpit-fuss .fbm-btn[disabled] { opacity: .4; pointer-events: none; }

/* ── Seite 10 · 90-Tage-Plan ─────────────────────────────────────────────────── */
.fbr-plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: clamp(10px, 1.6vw, 18px); width: 100%; }
.fbr-plan-block {
  display: flex; flex-direction: column; gap: 8px;
  padding: clamp(14px, 2.2vh, 20px) clamp(14px, 2vw, 20px);
  border-radius: 18px; border: 1px solid var(--fbm-line); background: rgba(14, 42, 71, .65);
}
.fbr-plan-block h3 {
  margin: 0; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--fbm-gold-hell); font-weight: 700;
}
.fbr-plan-block ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.fbr-plan-block li { display: flex; flex-direction: column; gap: 2px; }
.fbr-plan-block li b { font-size: .9rem; line-height: 1.45; color: var(--fbm-cream); font-weight: 600; }
.fbr-plan-block li small { font-size: .78rem; line-height: 1.45; color: var(--fbm-dim); }

/* ── Seite 11 · Meilensteine ─────────────────────────────────────────────────── */
.fbr-meilensteine { list-style: none; margin: 0 0 clamp(12px, 2vh, 20px); padding: 0; width: 100%; display: flex; flex-direction: column; gap: clamp(7px, 1.1vh, 11px); }
.fbr-ms {
  display: flex; flex-direction: column; gap: 5px;
  padding: clamp(10px, 1.5vh, 15px) clamp(13px, 1.8vw, 18px);
  border-radius: 14px; border: 1px solid var(--fbm-line); background: rgba(14, 42, 71, .6);
}
.fbr-ms.is-erreicht { border-color: rgba(109, 175, 123, .45); background: rgba(109, 175, 123, .08); }
.fbr-ms-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.fbr-ms-kopf b { font-size: .93rem; color: var(--fbm-cream); }
.fbr-ms-jahr { font-family: "IBM Plex Mono", monospace; font-size: .82rem; color: var(--fbm-gold-hell); white-space: nowrap; }
.fbr-ms.is-erreicht .fbr-ms-jahr { color: #A8DDB4; }
.fbr-ms-balken { display: block; height: 5px; border-radius: 999px; background: rgba(247, 243, 232, .12); overflow: hidden; }
.fbr-ms-balken i { display: block; height: 100%; border-radius: 999px; background: var(--fbm-gold); transition: width .6s ease; }
.fbr-ms.is-erreicht .fbr-ms-balken i { background: #6DAF7B; }
.fbr-ms-stand { margin: 0; font-size: .8rem; line-height: 1.45; color: var(--fbm-dim); }

/* ── Schmale Geräte ──────────────────────────────────────────────────────────── */
@media (max-width: 780px) {
  .fbr-cockpit { grid-template-columns: minmax(0, 1fr); }
  .fbr-cockpit-ausgabe { position: static; }
  .fbr-phasen, .fbr-route-zahlen { grid-template-columns: minmax(0, 1fr); }
  .fbr-fluss-zeile { grid-template-columns: minmax(0, 1fr) auto; }
  .fbr-fluss-balken { display: none; }
  .fbr-stapel { flex-direction: column; min-height: 0; }
}

/* ── Blueprint herunterladen ────────────────────────────────────────────────────
   Beim Drucken erscheinen ALLE zwölf Seiten untereinander, je eine pro Blatt. Stadt, HUD und
   Navigation verschwinden. Über „Als PDF speichern“ entsteht daraus die Datei zum Mitnehmen. */
@media print {
  html.fb-mapmode, html.fb-mapmode body { overflow: visible; height: auto; background: #fff; }
  .fbm-stage, .fbm-hud, .fbr-nav, .fbr-skip, .gb-widget,
  #mge-back-btn-container, .fbm-modal { display: none !important; }
  .fbr { position: static; display: block; background: #fff; color: #12212e; }
  .fbr-pages { position: static; }
  .fbr-page {
    position: static; display: block !important; overflow: visible;
    break-after: page; page-break-after: always;
  }
  .fbr-page:last-child { break-after: auto; page-break-after: auto; }
  .fbr-hero { background-image: none !important; min-height: 0; padding: 24px 0; }
  .fbr-hero::before { display: none; }
  .fbr-inner { min-height: 0; padding: 24px 0; display: block; }
  .fbr-titel, .fbr-text, .fbr-vgl-label, .fbr-schild b, .fbr-schritt b,
  .fbr-weg-punkt p, .fbr-pfeiler b, .fbr-kz > span { color: #12212e !important; }
  .fbr-kicker, .fbr-kz b, .fbr-urkunde b, .fbr-vgl-vision { color: #8A6B1F !important; }
  .fbr-text, .fbr-kz small, .fbr-schild p, .fbr-schritt p, .fbr-vgl-heute { color: #44586b !important; }
  .fbr-kz, .fbr-schild, .fbr-schritt, .fbr-urkunde {
    background: #fff !important; border-color: #C9A24A !important;
  }
  .fbr-split-bild { filter: none !important; }
  .fbr-cta { display: none; }

  /* Auswertung v2 im Druck: Alles, was nur zum Ausprobieren da ist, verschwindet.
     Die Regler selbst sind im Papier sinnlos — ihr Ergebnis bleibt stehen. */
  .fbr-cockpit-regler, .fbr-cockpit-fuss, .fbr-dialog-kopf { display: none !important; }
  .fbr-cockpit { grid-template-columns: minmax(0, 1fr) !important; }
  .fbr-cockpit-ausgabe { position: static !important; }
  .fbr-option { border-color: #C9A24A !important; color: #44586b !important; background: #fff !important; }
  .fbr-option.is-gewaehlt { background: #F7F3E8 !important; color: #12212e !important; font-weight: 700; }
  .fbr-fluss-zeile, .fbr-herleitung, .fbr-phase, .fbr-stapel-teil, .fbr-nichtgezaehlt,
  .fbr-gruende, .fbr-engpass, .fbr-route, .fbr-plan-block, .fbr-ms, .fbr-cockpit-ausgabe,
  .fbr-ampel, .fbr-cockpit-ampel, .fbr-hinweis {
    background: #fff !important; border-color: #C9A24A !important;
    break-inside: avoid; page-break-inside: avoid;
  }
  .fbr-fluss-label, .fbr-fluss-wert, .fbr-herl-zeile b, .fbr-phase p, .fbr-engpass b,
  .fbr-route-kopf b, .fbr-route-liste li, .fbr-plan-block li b, .fbr-ms-kopf b,
  .fbr-cw b, .fbr-weg-liste li, .fbr-nichtgezaehlt li, .fbr-gruende li {
    color: #12212e !important;
  }
  .fbr-fluss-label small, .fbr-herl-zeile span, .fbr-engpass p, .fbr-route-kopf span,
  .fbr-route-hinweis, .fbr-plan-block li small, .fbr-ms-stand, .fbr-cw span,
  .fbr-stapel-teil span, .fbr-hinweis, .fbr-kennung, .fbr-dialog-kopf, .fbr-fuss {
    color: #44586b !important;
  }
  .fbr-herl-zeile.is-summe b, .fbr-stapel-teil b, .fbr-phase b, .fbr-ms-jahr,
  .fbr-plan-block h3, .fbr-cw.is-betont b, .fbr-hinweis b, .fbr-route-zahlen b {
    color: #8A6B1F !important;
  }
  .fbr-fluss-balken, .fbr-ms-balken { background: #E8DFCC !important; }
  .fbr-fluss-balken i, .fbr-ms-balken i { background: #C9A24A !important; }
  .fbr-ampel-punkt { border: 1px solid #12212e; }
}

/* ── Umschaltung Stadt ↔ Formular ─────────────────────────────────────────────
   Die Stadt ist der Standard. Das bisherige Formular bleibt als Notausgang erreichbar
   (?map=0 oder localStorage fb_map_mode=0) — dasselbe Muster wie ?map=0 in LifeFlow. Es wird
   nicht gelöscht, nur ausgeblendet, damit im Seminar jederzeit zurückgeschaltet werden kann.

   Die Klasse sitzt auf <html>, nicht auf <body>: Ein kurzes Skript im <head> setzt sie noch
   VOR dem ersten Zeichnen, damit weder Einleitung noch Formular aufblitzen. */
#fb-map-root { display: none; }
html.fb-mapmode #fb-map-root { display: block; position: fixed; inset: 0; z-index: 1; }
html.fb-mapmode .fb-hero,
html.fb-mapmode .fb-wrap,
html.fb-mapmode #fb-sticky-cta,
html.fb-mapmode #fb-bg { display: none !important; }
/* Die Stadt füllt den Bildschirm — kein Scrollen, keine Innenabstände der Teilnehmer-Shell. */
html.fb-mapmode, html.fb-mapmode body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--fbm-navy, #071A2F);
}
html.fb-mapmode body.participant-game-shell { padding: 0; }
/* game-bridge.js schiebt den Seiteninhalt für seinen Zurück-Knopf nach unten (!important).
   Im Stadtmodus ist das falsch: Die Bühne füllt den Bildschirm, zusätzliche Polsterung würde
   sie nur verschieben. Der Knopf liegt fixed und braucht keinen Platz im Fluss — die HUD-Knöpfe
   weichen ihm stattdessen über .fbm-actions aus. */
html.fb-mapmode body.mge-has-back-btn--top { padding-top: 0 !important; }


:root{
 --fbm-navy:#071A2F;--fbm-navy-2:#0E2A47;--fbm-gold:#C9A24A;--fbm-gold-hell:#E8C87A;
 --fbm-cream:#F7F3E8;--fbm-teal:#007C89;--fbm-teal-hell:#0096A3;--fbm-ink:#F1E9DA;
 --fbm-dim:#9FB6C6;--fbm-line:rgba(247,243,232,.14);
 --paper:#fffdf9;--ink:#17362f;--muted:#61726c;--forest:#21483d;--teal:#0d8c91;--gold:#d7ab38
}
*{box-sizing:border-box}html,body{margin:0;background:#e8e3da;color:var(--ink);font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}.app{width:min(430px,100%);min-height:100dvh;margin:auto;background:#071a2f;display:flex;flex-direction:column;overflow:hidden;position:relative}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:14px 14px 10px;background:linear-gradient(180deg,#0a2239,#071a2f)}
.brand h1{margin:0;color:#fff;font:800 24px/1 Georgia,serif}.brand p{margin:4px 0 0;color:#e5bd56;font-size:8px;font-weight:950;letter-spacing:.14em;text-transform:uppercase}
.calc{border:0;border-radius:13px;padding:10px 11px;background:linear-gradient(145deg,#f1cf71,#d5a83c);color:#33270d;font-size:8px;font-weight:950;box-shadow:0 6px 16px #0004;cursor:pointer}
.mapwrap{
  width:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at top, rgba(255,224,160,.20), transparent 32%),

  min-height:45dvh;
  display:flex;
  align-items:stretch;
}.map{position:relative;width:100%;aspect-ratio:1586/992;background-position:center;background-size:100% 100%;background-repeat:no-repeat}
.pin{position:absolute;width:42px;height:51px;transform:translate(-50%,-100%);border:0;background:transparent;padding:0;z-index:3;filter:drop-shadow(0 3px 4px #0008);cursor:pointer}.pin img{width:42px;display:block;position:relative;z-index:2}.pin::before{content:"";position:absolute;left:50%;top:16px;width:29px;height:29px;border-radius:50%;transform:translate(-50%,-50%);z-index:1}.pin.active::before{background:radial-gradient(circle,#25d4dc77 0,#25d4dc2b 48%,transparent 74%);box-shadow:0 0 18px #25d4dc66}.pin.done::before{background:radial-gradient(circle,#f0c64d55 0,#f0c64d22 48%,transparent 74%)}.pin.next{animation:pinPulse 2.2s ease-in-out infinite}.pin.next::before{background:radial-gradient(circle,#25d4dc88 0,#25d4dc33 48%,transparent 74%);box-shadow:0 0 22px #25d4dc77}@keyframes pinPulse{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-105%)}}
.check{display:none;position:absolute;right:-4px;top:-2px;width:16px;height:16px;border-radius:50%;place-items:center;background:#f0c64d;color:#17324a;font-size:9px;font-weight:950;z-index:4;box-shadow:0 2px 6px #0004}.pin.done .check{display:grid}.pin-name{position:absolute;left:50%;top:45px;transform:translateX(-50%);white-space:nowrap;padding:3px 6px;border-radius:999px;background:#071a2fee;border:1px solid #ffffff3a;color:#fff;font-size:6.8px;font-weight:900}
.dashboard{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;padding:10px 13px 80px;background:linear-gradient(180deg,#08223a,#071a2f)}
.miraDash{display:grid;grid-template-columns:58px 1fr;gap:9px;align-items:center;padding:9px 10px 9px 5px;border-radius:16px;background:linear-gradient(145deg,#10384d,#0d5060);border:1px solid #65d0da2a}.miraDash img{width:58px;height:58px;object-fit:contain}.miraDash small{display:block;color:#ecc65f;font-size:7px;font-weight:950;text-transform:uppercase;letter-spacing:.1em}.miraDash b{display:block;margin-top:2px;color:#fff;font-size:10px;line-height:1.32}.miraDash p{margin:3px 0 0;color:#bae4e8;font-size:7.8px;line-height:1.4}
.progress{padding:9px 10px;border-radius:13px;background:#0a2743;border:1px solid #ffffff14}.progressHead{display:flex;justify-content:space-between;gap:8px;color:#fff;font-size:8px;font-weight:900}.progressHead span:first-child{color:#6ed0db}.bar{height:5px;margin-top:6px;border-radius:99px;background:#ffffff18;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0d9ca7,#e4bd54)}
.nextCard,.estimate{padding:10px 11px;border-radius:14px;background:#fffdf9;color:#17362f;border:1px solid #e6dfd4}.nextCard{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.nextCard small,.estimate small{display:block;color:#0d8c91;font-size:6.8px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}.nextCard b,.estimate b{display:block;margin-top:3px;font-size:10px;line-height:1.32}.nextCard p,.estimate p{margin:3px 0 0;color:#61726c;font-size:7.5px;line-height:1.4}.nextCard button{height:32px;border:0;border-radius:10px;background:#21483d;color:#fff;padding:0 10px;font-size:7px;font-weight:950}.estimate{background:linear-gradient(145deg,#fff8e5,#f8efcf);border-color:#ead99d}.estimate small{color:#97731d}.estimate b{font:800 15px/1.15 Georgia,serif}

  }
  const possibleFreedomIncome = lo;
  /** Was über dem gewünschten Budget hinaus getragen würde. */
  const freedomHeadroom = Math.max(possibleFreedomIncome - freedomNeed, 0);

  /* ── Schutz und Kennzahlen für die Bewertung ─────────────────────────── */
  const needsLifeCover = brauchtHinterbliebenenschutz(txt("family", "single"));
  const currentFreedomDegree = expenses > 0 ? (passive / expenses) * 100 : 0;
  const freedomGapMonthly = Math.max(freedomNeed - incomeAt(targetAge), 0);

  /* ── Kurzer Zeitraum ─────────────────────────────────────────────────────
     Unter drei Jahren ist die „notwendige Sparrate" keine sinnvolle Größe mehr: Sie nähert
     sich der vollen Restsumme geteilt durch wenige Monate. Ein Betrag wie „48.416 € pro
     Monat" ist rechnerisch richtig und als Aussage unbrauchbar. */
  const shortHorizon = years < D.redMinYears && remainingCapital > 0;

  return {
    version: FB_ENGINE_VERSION,
    unknownFields,
    profile: { name: txt("name", "Teilnehmer"), age, targetAge, years, family: txt("family", "single"), job: txt("job", "office") },

      freedomNeedBase, freedomNeed, freedomGapMonthly,
      targetCapital, bridgeCapital: targetDetail.bridgeCapital,
      permCapital: targetDetail.permCapital, permCapitalAtStart: targetDetail.permCapitalAtStart
    },
    bridgePhase: {
      exists: bridgeYears > 0, fromAge: targetAge, toAge: perpetuityAge, years: bridgeYears,
      segments: targetDetail.segments,

      emergencyMonths, emergencyTarget, reserveShortfall
