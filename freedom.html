/* Das Schutzschild — vier Statuskarten, kein Angebot, keine Preise, keine Links.
   Es beantwortet die Frage, die keine Rechnung beantwortet: Was, wenn etwas dazwischenkommt? */

function schildKarte(titel, zustand, wert, satz) {
  const label = zustand === "ok" ? "Angegeben" : zustand === "teil" ? "Teilweise" : "Offen";
  return `
    <div class="fbr-schild is-${zustand}">
      <span class="fbr-schild-status">${label}</span>
      <b>${esc(titel)}</b>
      ${wert ? `<span class="fbr-schild-wert">${esc(wert)}</span>` : ""}
      <p>${esc(satz)}</p>
    </div>`;
}

function schutzschild(bp) {
  const p = bp.protection;
  const monate = bp.assets.emergencyMonths;
  const liq = monate >= 3 ? "ok" : monate >= 1 ? "teil" : "offen";
  const karten = [
    schildKarte("Deine Arbeitskraft", p.bu === "yes" ? "ok" : "offen", "",
      p.bu === "yes"
        ? "Du hast angegeben, dass eine Absicherung besteht. Ob Höhe und Bedingungen zu deinem Bedarf passen, sollte regelmäßig überprüft werden."
        : "Dieser ganze Plan steht auf deinem Einkommen. Fällt es aus, fällt die Sparrate mit ihm."),
    schildKarte("Liquidität", liq, `${monate.toFixed(1).replace(".", ",")} Monatsausgaben`,
      monate >= 3
        ? "Du kannst einen Rückschlag überbrücken, ohne etwas zum falschen Zeitpunkt verkaufen zu müssen."
        : monate >= 1
          ? "Ein kleiner Puffer ist da. Drei Monatsausgaben geben echte Ruhe."
          : "Ohne Puffer wird jeder unerwartete Betrag zum Problem."),
    schildKarte("Privathaftpflicht", p.liability === "yes" ? "ok" : "offen", "",
      p.liability === "yes"
        ? "Du hast angegeben, dass sie besteht. Deckungssumme und Bedingungen solltest du regelmäßig überprüfen."
        : "Ein Schaden bei anderen träfe dich bisher unbegrenzt.")
  ];
  karten.push(p.needsLifeCover
    ? schildKarte("Die Menschen um dich", p.life === "yes" ? "ok" : "offen", "",
      p.life === "yes"
        ? "Du hast angegeben, dass eine Absicherung besteht. Ob die Höhe noch zum Bedarf passt, sollte regelmäßig überprüft werden — Bedarf ändert sich mit dem Leben."
        : "Es leben Menschen von deinem Einkommen. Ob und in welcher Höhe eine Absicherung nötig ist, lässt sich nur individuell klären.")
    : schildKarte("Rechtsschutz", p.legal === "yes" ? "ok" : "offen", "",
      p.legal === "yes"
        ? "Du hast angegeben, dass er besteht. Welche Bereiche er abdeckt, solltest du regelmäßig überprüfen."
        : "Ein Rechtsstreit müsste bisher aus eigener Tasche getragen werden."));

  return `
    <div class="fbr-schutz">
      <h3 class="fbr-schutz-titel">Was auf dem Weg dazwischenkommen kann</h3>
      <p class="fbr-schutz-frage">Bist du darauf vorbereitet?</p>
      <div class="fbr-schilde">${karten.join("")}</div>
    </div>`;
}

function seiteFehlt(bp, ui) {
  const dialog = ui.dialog || {};
  // Ohne Lücke sind Fragen nach Einschränkung sinnlos — egal ob gar nichts mehr zu sparen
  // ist oder die Rate schlicht bezahlbar bleibt. Das sind aber zwei verschiedene Lagen.
  const ohneLuecke = bp.plan.implementationGap <= 0;
  const nichtsZuSparen = ohneLuecke && bp.plan.reached;
  const oben = bp.bottlenecks.slice(0, ohneLuecke ? 3 : 4);
  const fragen = ohneLuecke ? DIALOG_FRAGEN_GEDECKT : DIALOG_FRAGEN;

  return `
    <div class="fbr-inner fbr-inner--weit">
      <p class="fbr-kicker">Was fehlt mir wirklich?</p>
      <h2 class="fbr-titel">${nichtsZuSparen
    ? "Das Geld steht. Der Rest nicht automatisch."
    : ohneLuecke ? "Die Zahlen tragen. Und sonst?"
      : "Nicht nur Kapital."}</h2>

      ${ohneLuecke ? `<p class="fbr-text fbr-text--mitte">${nichtsZuSparen
    ? "Rechnerisch bist du da — du müsstest dafür nichts mehr zurücklegen."
    : "Deine Rate ist finanzierbar, an der Mathematik scheitert es nicht."} Genau deshalb geht
      es jetzt um das, was eine Rechnung nicht abdeckt.</p>` : ""}

      ${oben.length ? `
        <ol class="fbr-engpaesse">
          ${oben.map((b, i) => `
            <li class="fbr-engpass is-${esc(b.schwere)}">
              <span class="fbr-engpass-nr" aria-hidden="true">${i + 1}</span>
              <div><b>${esc(b.titel)}</b><p>${esc(b.text)}</p></div>
            </li>`).join("")}
        </ol>` : ""}

      ${schutzschild(bp)}

      <div class="fbr-dialog">
        <p class="fbr-dialog-kopf">${ohneLuecke
    ? "Zwei kurze Fragen. Deine Antworten verändern nur, worauf wir zuerst schauen — nicht die Rechnung."
    : "Bevor wir dir Wege zeigen — drei kurze Fragen. Deine Antworten verändern die Reihenfolge der Vorschläge, nicht die Rechnung."}</p>
        ${fragen.map((f) => `
          <fieldset class="fbr-frage">
            <legend>${esc(f.frage)}</legend>
            <div class="fbr-optionen">
              ${f.optionen.map((o) => `
                <button type="button" class="fbr-option ${dialog[f.id] === o.id ? "is-gewaehlt" : ""}"
                  data-fb-act="dialog" data-frage="${esc(f.id)}" data-wert="${esc(o.id)}"
                  aria-pressed="${dialog[f.id] === o.id ? "true" : "false"}">${esc(o.label)}</button>`).join("")}
            </div>
          </fieldset>`).join("")}
      </div>
    </div>`;
}

/* ── Seite 8 · Meine möglichen Routen ───────────────────────────────────── */

function routeKarte(r, gewaehlt) {
  return `
    <article class="fbr-route ${gewaehlt ? "is-gewaehlt" : ""} ${r.geloest ? "" : "is-offen"}">
      <header class="fbr-route-kopf">
        <b>${esc(r.titel)}</b>
        <span>${esc(r.beschreibung)}</span>
      </header>
      <ul class="fbr-route-liste">
        ${r.veraenderungen.length
    ? r.veraenderungen.map((v) => `<li>${esc(v.text)}</li>`).join("")
    : "<li>Keine Veränderung nötig</li>"}
      </ul>
      <div class="fbr-route-zahlen">
        <div><b>${euro(r.freiheitsbeitrag)}</b><span>pro Monat</span></div>
        <div><b>${r.zielalter}</b><span>Freiheitsalter</span></div>
        <div><b>${r.renditeannahme} %</b><span>Rechenannahme</span></div>
      </div>
      <p class="fbr-route-hinweis">${esc(r.hinweis)}</p>
      <button type="button" class="fbm-btn ${gewaehlt ? "fbm-btn--gold" : "fbm-btn--outline-gold"}"
        data-fb-act="route" data-route="${esc(r.id)}">
        ${gewaehlt ? "Ausgewählt" : "Diesen Weg wählen"}
      </button>
    </article>`;
}

/**
 * Wenn es keine Lücke gibt, gibt es auch keine Routen — dann steht hier, was den Plan
 * jetzt wirklich sichert. Leere Routenkarten mit „0 € nötig" wären eine Scheinauswahl.
 */
function seiteGesichert(bp) {
  const p = bp.plan;
  const spielraum = p.freedomHeadroom;
  // Zwei verschiedene Lagen, die beide keine Route brauchen — aber nicht dasselbe bedeuten:
  // „nichts mehr zu sparen" ist etwas anderes als „die Rate ist bezahlbar".
  const nichtsZuSparen = p.reached;
  const punkte = [
    {
      titel: nichtsZuSparen
        ? "Trägt das Kapital wirklich so lange?"
        : "Bleibt die Rate über all die Jahre bezahlbar?",
      text: nichtsZuSparen
        ? "Diese Rechnung prüft, ob dein Kapital am Freiheitstag ausreicht. Ob es dreißig "
          + "Jahre Entnahme aushält, hängt zusätzlich davon ab, wann welche Marktphase kommt."
        : "Die Rechnung geht davon aus, dass du diesen Betrag jeden Monat aufbringst — auch "
          + "in den Jahren, in denen etwas dazwischenkommt."
    },
    {
      titel: "Kommst du im richtigen Moment heran?",
      text: "Rechnerisch verfügbar und tatsächlich verfügbar sind nicht dasselbe. Entscheidend "
        + "ist, was du im Ernstfall verkaufen müsstest — und zu welchem Kurs."
    },
    {
      titel: "Was Steuern und Kosten davon abziehen",
      text: "Diese Modellrechnung enthält weder Besteuerung noch Produktkosten. Beide "
        + "verringern die Summe, die dir tatsächlich zur Verfügung steht."
    },
    {
      titel: "Einmal im Jahr nachrechnen",
      text: "Einkommen, Ausgaben und Vermögen verändern sich schneller als dein Ziel. Ein "
        + "erreichtes Ziel bleibt nur erreicht, wenn es überprüft wird."
    }
  ];

  return `
    <div class="fbr-inner fbr-inner--weit">
      <p class="fbr-kicker">Was deinen Plan jetzt sichert</p>
      <h2 class="fbr-titel">${nichtsZuSparen
    ? "Es geht nicht mehr ums Sparen."
    : "Du brauchst keinen Umweg."}</h2>
      <p class="fbr-text fbr-text--mitte">${nichtsZuSparen
    ? `Dein vorhandenes Kapital deckt dein Freiheitsziel unter den gewählten Annahmen bereits.
      ${spielraum >= 10
    ? `Rechnerisch trüge es sogar ${euro(p.possibleFreedomIncome)} im Monat — das sind
        ${euro(spielraum)} mehr, als du dir vorgenommen hast.`
    : "Viel Spielraum darüber hinaus besteht allerdings nicht."}`
    : `Deine notwendige Rate von ${euro(p.requiredContribution)} im Monat liegt innerhalb
      dessen, was dir zur Verfügung steht — es bleiben ${euro(Math.max(p.availableContribution - p.requiredContribution, 0))}
      übrig. Deshalb zeigen wir dir hier keine Umwege, sondern das, worauf es jetzt ankommt.`}</p>

      <div class="fbr-routen">
        ${punkte.map((k) => `
          <article class="fbr-route">
            <header class="fbr-route-kopf"><b>${esc(k.titel)}</b></header>
            <p class="fbr-route-hinweis">${esc(k.text)}</p>
          </article>`).join("")}
      </div>
    </div>`;
}

function seiteRouten(bp, ui) {
  const routen = bp.recommendedRoutes;
  if (!routen.length) return seiteGesichert(bp);
  return `
    <div class="fbr-inner">
      <p class="fbr-kicker">Meine möglichen Routen</p>
      <h2 class="fbr-titel">${routen.length > 2
    ? "Drei gerechnete Wege zu deinem Ziel."
    : "Gerechnete Wege zu deinem Ziel."}</h2>
      <p class="fbr-text fbr-text--mitte">Keiner dieser Wege ist eine Empfehlung. Es sind
      rechnerische Möglichkeiten — wähle den, der zu deinem Leben passt.</p>
      <div class="fbr-routen">
        ${routen.map((r) => routeKarte(r, ui.selectedRouteId === r.id)).join("")}
      </div>
    </div>`;
}

/* ── Seite 9 · Mein gewählter Weg + Cockpit ─────────────────────────────── */

function seiteWeg(bp, ui) {
  const route = bp.recommendedRoutes.find((r) => r.id === ui.selectedRouteId);
  const ohneLuecke = bp.plan.implementationGap <= 0;

  const kopf = route
    ? `<h2 class="fbr-titel">${esc(route.titel)}</h2>
       <ul class="fbr-weg-liste">${route.veraenderungen.map((v) => `<li>${esc(v.text)}</li>`).join("")}</ul>`
    : ohneLuecke
      // Wer nichts schließen muss, will nicht wissen, wie er sich einschränkt — sondern
      // wie viel Luft er hat: früher aufhören oder mehr ausgeben.
      ? `<h2 class="fbr-titel">Wie viel Spielraum hast du?</h2>
         <p class="fbr-text fbr-text--mitte">Dein Ziel ist gedeckt — hier kannst du
         ausprobieren, was das bedeutet. Zieh das Freiheitsbudget nach oben oder das
         Freiheitsalter nach vorn und sieh, wo die Rechnung kippt.</p>`
      : `<h2 class="fbr-titel">Probier deine Stellschrauben aus.</h2>
         <p class="fbr-text fbr-text--mitte">Du hast noch keinen Weg gewählt. Du kannst hier
         frei ausprobieren, wie sich einzelne Veränderungen auswirken.</p>`;

  return `
    <div class="fbr-inner fbr-inner--weit">
      <p class="fbr-kicker">${ohneLuecke && !route ? "Mein Spielraum" : "Mein gewählter Weg"}</p>
      ${kopf}
      ${cockpitHtml(bp, ui)}
      ${hinweisBox(bp, "rendite")}
    </div>`;
}

/* ── Seite 10 · Mein 90-Tage-Plan ───────────────────────────────────────── */

function seitePlan90(bp) {
  const bloecke = bp.actionPlan90Days.filter((b) => b.id !== "monate12");
  return `
    <div class="fbr-inner fbr-inner--weit">
      <p class="fbr-kicker">Mein 90-Tage-Plan</p>
      <h2 class="fbr-titel">Was du ab morgen tun kannst.</h2>
      <div class="fbr-plan">
        ${bloecke.map((b) => `
          <section class="fbr-plan-block">
            <h3>${esc(b.titel)}</h3>
            <ul>${b.schritte.map((s) => `
              <li><b>${esc(s.text)}</b><small>${esc(s.grund)}</small></li>`).join("")}</ul>
          </section>`).join("")}
      </div>
    </div>`;
}

/* ── Seite 11 · Mein Meilensteinplan ────────────────────────────────────── */

function seiteMeilensteine(bp) {
  const jetzt = new Date(bp.calculationMeta.calculatedAt).getFullYear();
  const zwoelf = bp.actionPlan90Days.find((b) => b.id === "monate12");
  return `
    <div class="fbr-inner fbr-inner--weit">
      <p class="fbr-kicker">Mein langfristiger Meilensteinplan</p>
      <h2 class="fbr-titel">Von ${jetzt} bis ${freiheitsJahr(bp)}.</h2>

      <ol class="fbr-meilensteine">
        ${bp.milestones.map((m) => `
          <li class="fbr-ms ${m.erreicht ? "is-erreicht" : ""}">
            <div class="fbr-ms-kopf">
              <b>${esc(m.titel)}</b>
              <span class="fbr-ms-jahr">${m.erreicht ? "erreicht"
    : m.jahr ? esc(String(m.jahr)) : "noch nicht bestimmbar"}</span>
            </div>
            <span class="fbr-ms-balken"><i style="width:${pct(m.anteil * 100)}%"></i></span>
            <p class="fbr-ms-stand">${m.erreicht
    ? esc(m.standText)
    : `${esc(m.standText)} von ${esc(m.zielwertText)}`} — ${esc(m.naechsteHandlung)}</p>
          </li>`).join("")}
      </ol>

      ${zwoelf ? `
        <section class="fbr-plan-block">
          <h3>${esc(zwoelf.titel)}</h3>
          <ul>${zwoelf.schritte.map((s) => `
            <li><b>${esc(s.text)}</b><small>${esc(s.grund)}</small></li>`).join("")}</ul>
        </section>` : ""}
    </div>`;
}

/* ── Seite 12 · Mein persönlicher Blueprint ─────────────────────────────── */

function seiteBlueprint(bp, ui) {
  const leitsatz = bp.vision.leitsatz;
  const route = bp.recommendedRoutes.find((r) => r.id === ui.selectedRouteId);
  const naechste = [
    { id: "selbst", label: "Meinen Plan selbst starten" },
    { id: "annahmen", label: "Meine Annahmen überprüfen lassen" },
    { id: "absicherung", label: "Meine Absicherung prüfen" },
    { id: "invest", label: "Meine Investmentstrategie besprechen" },
    { id: "finanzplan", label: "Einen vollständigen Finanzplan erarbeiten" },
    { id: "offen", label: "Noch nicht entscheiden" }
  ];

  return `
    <div class="fbr-hero" style="--fbr-bild:url('${bildBasis()}city-evening.jpg?v=${FB_MAP_BUILD}')">
      <div class="fbr-hero-inner">
        <p class="fbr-kicker">Mein persönlicher Blueprint</p>
        <h2 class="fbr-titel">Glückwunsch, ${esc(bp.profile.name)}.</h2>
        <p class="fbr-text">${bp.plan.implementationGap <= 0 && bp.plan.reached
    ? "Du kennst jetzt dein Ziel, deinen Spielraum und die Fragen, die eine Rechnung nicht beantwortet. Das ist mehr, als die meisten Menschen über ihr Geld wissen."
    : "Du kennst jetzt dein Ziel, deine Lücke, deine Stellschrauben und deinen nächsten Schritt. Das ist mehr, als die meisten Menschen über ihr Geld wissen."}</p>

        ${(() => {
    // Ist ein Weg gewählt, MUSS die Urkunde seine Zahlen zeigen. Sonst stünde unter
    // „Dein Weg: Zielalter um drei Jahre verschieben" weiter das alte Freiheitsdatum —
    // die Zusammenfassung widerspräche der Entscheidung, die gerade getroffen wurde.
    const jetzt = new Date(bp.calculationMeta.calculatedAt).getFullYear();
    const jahr = route ? jetzt + Math.round(route.jahre) : freiheitsJahr(bp);
    const kapital = route ? route.zielkapital : bp.freedomTarget.targetCapital;
    const beitrag = route ? route.freiheitsbeitrag : bp.plan.requiredContribution;
    // „Freiheitsbeitrag 0 € / Monat" liest sich wie ein vergessener Wert. Wenn nichts mehr
    // zurückgelegt werden muss, gehört genau das dorthin — als Aussage, nicht als Null.
    const beitragText = beitrag >= 10
      ? `${euro(beitrag)} / Monat`
      : "kein weiterer nötig";
    return `
        <div class="fbr-urkunde">
          <span>Freiheitsdatum</span><b>${jahr}</b>
          <span>Freiheitsbudget</span><b>${euro(bp.freedomTarget.freedomNeed)} / Monat</b>
          <span>Zielkapital</span><b>${euro(kapital)}</b>
          <span>Freiheitsbeitrag</span><b>${beitragText}</b>
          ${beitrag < 10 && bp.plan.freedomHeadroom >= 10
    ? `<span>Rechnerischer Spielraum</span><b>${euro(bp.plan.possibleFreedomIncome)} / Monat</b>` : ""}
          <span>Machbarkeit</span><b>${esc(STATUS_TEXT[bp.feasibility.status] || "")}</b>
          ${route ? `<span>Dein Weg</span><b>${esc(route.titel)}</b>` : ""}
          ${leitsatz ? `<span>Deine Vision</span><b class="fbr-urkunde-vision">„${esc(leitsatz)}“</b>` : ""}
        </div>
        ${route ? `<p class="fbr-urkunde-fuss">Die Zahlen oben zeigen deinen gewählten Weg.
          Ohne Veränderung wären es ${euro(bp.plan.requiredContribution)} im Monat und
          Freiheit ab ${freiheitsJahr(bp)}.</p>` : ""}`;
  })()}

        <fieldset class="fbr-frage fbr-frage--hell">
          <legend>Was möchtest du als Nächstes tun?</legend>
          <div class="fbr-optionen">
            ${naechste.map((n) => `
              <button type="button" class="fbr-option ${ui.dialog?.next === n.id ? "is-gewaehlt" : ""}"
                data-fb-act="dialog" data-frage="next" data-wert="${esc(n.id)}"
                aria-pressed="${ui.dialog?.next === n.id ? "true" : "false"}">${esc(n.label)}</button>`).join("")}
          </div>
        </fieldset>

        ${(() => {
    // Die Einwilligung entscheidet, ob dem PDF ein Beraterblatt beiliegt. Sie ist bewusst
    // dreigeteilt und standardmäßig AUS: Wer nur seinen Plan mitnehmen will, gibt nichts frei.
    const e = ui.einwilligung || {};
    const felder = [
      { id: "kontakt", label: "Meinen Namen und meine Kontaktdaten weitergeben" },
      { id: "finanzen", label: "Meine Finanzdaten für das Gespräch freigeben" },
      { id: "termin", label: "Ich möchte einen Beratungstermin" }
    ];
    return `
        <fieldset class="fbr-frage fbr-frage--hell fbr-einwilligung">
          <legend>Was darf dein Berater sehen?</legend>
          <div class="fbr-optionen">
            ${felder.map((f) => `
              <button type="button" class="fbr-option ${e[f.id] ? "is-gewaehlt" : ""}"
                data-fb-act="einwilligung" data-art="${esc(f.id)}"
                aria-pressed="${e[f.id] ? "true" : "false"}">
                ${e[f.id] ? "✓ " : ""}${esc(f.label)}</button>`).join("")}
          </div>
          <p class="fbr-einwilligung-hinweis">Ohne Freigabe enthält dein PDF nur deinen eigenen
          Plan. Es wird nichts übertragen — die Datei bleibt bei dir, und du entscheidest,
          wem du sie gibst.</p>

          ${e.kontakt ? `
            <div class="fbr-kontakt">
              <label>Name
                <input type="text" data-fb-kontaktfeld="name" autocomplete="name"
                  value="${esc(ui.kontakt?.name ?? bp.profile.name ?? "")}"></label>
              <label>E-Mail
                <input type="email" data-fb-kontaktfeld="email" autocomplete="email"
                  value="${esc(ui.kontakt?.email || "")}" placeholder="damit man dich erreicht"></label>
              <label>Telefon
                <input type="tel" data-fb-kontaktfeld="telefon" autocomplete="tel"
                  value="${esc(ui.kontakt?.telefon || "")}" placeholder="freiwillig"></label>
              <p>Diese Angaben werden <b>nicht gespeichert und nicht gesendet</b>. Sie stehen nur
              in dem PDF und dem Übergabecode, die du selbst weitergibst.</p>
            </div>` : ""}

          ${(e.kontakt || e.finanzen) ? `
            <div class="fbr-uebergabe">
              <button type="button" class="fbm-btn fbm-btn--ghost" data-fb-act="code-zeigen">
                ${ui.uebergabeCode ? "Code neu erzeugen" : "Übergabecode für meinen Berater"}
              </button>
              ${ui.uebergabeCode ? `
                <textarea class="fbr-code" readonly rows="3"
                  aria-label="Übergabecode">${esc(ui.uebergabeCode)}</textarea>
                <p>Diesen Code kann dein Berater in seiner Ansicht einlesen. Er enthält genau
                das, was du oben freigegeben hast — nicht mehr. Wer den Code hat, kann ihn
                lesen: Gib ihn nur weiter, wem du ihn geben willst.</p>` : ""}
            </div>` : ""}
        </fieldset>`;
  })()}

        <div class="fbr-cta">
          <button type="button" class="fbm-btn fbm-btn--gold" data-fb-act="blueprint-laden">
            Blueprint als PDF herunterladen
          </button>
          <button type="button" class="fbm-btn fbm-btn--outline-gold" data-fb-act="beratung">
            Beratungstermin vereinbaren
          </button>
        </div>
        ${ui.pdfStatus ? `<p class="fbr-pdf-status">${esc(ui.pdfStatus)}</p>` : ""}

        <p class="fbr-fuss">Ein qualifizierter Finanzberater kann mit dir prüfen, ob die
        Annahmen zu deiner Situation passen, welche Risiken du tragen kannst und wie aus der
        Modellrechnung eine konkrete Umsetzung wird.</p>

        <div class="fbr-hinweise">
          ${bp.disclosures.filter((d) => d.gewicht === "hoch")
    .map((d) => `<p class="fbr-hinweis"><b>${esc(d.titel)}</b> ${esc(d.text)}</p>`).join("")}
          <p class="fbr-kennung">Blueprint ${esc(bp.calculationMeta.blueprintId)} ·
          Rechenlogik ${esc(bp.calculationMeta.engineVersion)} ·
          ${esc(new Date(bp.calculationMeta.calculatedAt).toLocaleDateString("de-DE"))}</p>
        </div>
      </div>
    </div>`;
}

/* ── Zusammenbau ────────────────────────────────────────────────────────── */

const SEITEN = [
  { titel: "Meine Vision", bau: seiteVision },
  { titel: "Mein Leben in Zahlen", bau: seiteZahlen },
  { titel: "Mein Freiheitsziel", bau: seiteZiel },
  { titel: "Meine Freiheitslücke", bau: seiteLuecke },
  { titel: "Mein Zielkapital", bau: seiteKapital },
  { titel: "Ist mein Ziel erreichbar?", bau: seiteMachbarkeit },
  { titel: "Was fehlt mir wirklich?", bau: seiteFehlt },
  { titel: "Meine möglichen Routen", bau: seiteRouten },
  { titel: "Mein gewählter Weg", bau: seiteWeg },
  { titel: "Mein 90-Tage-Plan", bau: seitePlan90 },
  { titel: "Mein Meilensteinplan", bau: seiteMeilensteine },
  { titel: "Mein persönlicher Blueprint", bau: seiteBlueprint }
];

/**
 * Die komplette Auswertung. ALLE zwölf Seiten liegen im DOM, sichtbar ist nur die aktuelle —
 * dadurch bleibt der Zustand erhalten und der Ausdruck kann sie in einem Rutsch untereinander
 * setzen.
 *
 *   bp = Ergebnis von buildFreedomBlueprint()
 *   ui = { seite, dialog, cockpit, cockpitPlan, selectedRouteId }
 */
function renderFreedomBlueprintPages(bp, ui = {}) {
  const idx = Math.max(0, Math.min(ui.seite | 0, SEITEN.length - 1));
  const seiten = SEITEN.map((s, i) => `
    <section class="fbr-page ${i === idx ? "is-now" : ""}" data-fb-page="${i}"
      aria-label="${esc(s.titel)}" ${i === idx ? "" : "aria-hidden=\"true\""}>
      ${s.bau(bp, ui)}
    </section>`).join("");

  const punkte = SEITEN.map((s, i) =>
    `<span class="fbr-punkt ${i === idx ? "is-now" : i < idx ? "is-done" : ""}"
      title="${esc(s.titel)}"></span>`).join("");

  const zurueck = idx > 0
    ? `<button type="button" class="fbm-btn fbm-btn--ghost" data-fb-act="erg-zurueck">Zurück</button>`
    : `<span></span>`;
  const weiter = idx < SEITEN.length - 1
    ? `<button type="button" class="fbm-btn fbm-btn--gold" data-fb-act="erg-weiter">Weiter</button>`
    : `<button type="button" class="fbm-btn fbm-btn--teal" data-fb-act="schliessen">Zurück zur Stadt</button>`;

  return `
    <div class="fbr" data-fb-stop="1">
      <button type="button" class="fbr-skip" data-fb-act="schliessen">Überspringen</button>
      <div class="fbr-pages">${seiten}</div>
      <nav class="fbr-nav" aria-label="Auswertung">
        ${zurueck}
        <div class="fbr-punkte" role="img"
          aria-label="Seite ${idx + 1} von ${SEITEN.length}">${punkte}</div>
        ${weiter}
      </nav>
    </div>`;
}


exports.default=({ renderFreedomBlueprintPages, FB_RESULT_PAGES, DIALOG_FRAGEN });

exports.renderFreedomBlueprintPages=renderFreedomBlueprintPages;
exports.FB_RESULT_PAGES=FB_RESULT_PAGES;

function rbEuro(n){
  const v=Number(n)||0;
  return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);
}

function miraResultMessage(){
  const modal=document.getElementById('modal');
  if(!modal) return null;
  const txt=modal.textContent || '';
  try{
    if(/Mein Leben in Zahlen/.test(txt) && resultData?.bp?.monthlyCashflow){
      const m=resultData.bp.monthlyCashflow;
      const free=Number(m.freeSurplus)||0;
      const net=Number(values.net)||0;

      if(free>=0){
        return {
          title:`Dir bleiben aktuell ${rbEuro(free)} pro Monat frei.`,
          text:'Das ist dein echter Spielraum. Aus genau dieser Zahl wachsen Rate, Schutz und Freiheit.'
        };
      }

      const deficit=Math.abs(free);
      const share=net>0 ? deficit/net : 1;

      if(share<=0.05){
        return {
          title:`Dir fehlen aktuell ${rbEuro(deficit)} pro Monat.`,
          text:'Das ist noch eine kleine Korrektur. Prüfe ein oder zwei Ausgabenposten oder schaffe etwas zusätzlichen Spielraum – dann ist dein Cashflow wieder im Plus.'
        };
      }

      if(share<=0.10){
        return {
          title:`Dein frei verfügbarer Cashflow liegt ${rbEuro(deficit)} im Minus.`,
          text:'Das ist mehr als eine Kleinigkeit. Prüfe jetzt gezielt Einnahmen und Ausgaben und passe deinen Monatsplan an, bevor du die Freiheitsrate fest einplanst.'
        };
      }

      return {
        title:`Achtung: Dir fehlen aktuell ${rbEuro(deficit)} pro Monat.`,
        text:'Hier solltest du dringend Einnahmen und Ausgaben prüfen und anpassen. Bevor wir über Zielkapital oder Sparrate sprechen, braucht dein laufender Cashflow zuerst wieder stabilen positiven Spielraum.'
      };
    }
    if(/Mein Zielkapital/.test(txt) && resultData?.bp?.freedomTarget){
      const t=resultData.bp.freedomTarget.targetCapital||0;
      return {title:`Deine große Zahl lautet ${rbEuro(t)}.`,text:'Das Zielkapital ist kein Fantasiewert. Es entsteht aus deinem Freiheitsbedarf, späteren Einkünften und der Überbrückungsphase.'};
    }
    if(/Ist mein Ziel erreichbar\?/.test(txt) && resultData?.bp?.feasibility){
      const f=resultData.bp.feasibility;
      return {title:f.headline||'Jetzt sehen wir die Machbarkeit.',text:f.detail || 'Diese Seite zeigt dir, wie tragfähig dein Weg mit den heutigen Angaben wirkt.'};
    }
    if(/Was fehlt mir wirklich\?/.test(txt)){
      const top=(resultData?.bp?.bottlenecks||[])[0];
      return top
        ? {title:top.titel || 'Hier sitzt gerade der größte Hebel.',text:top.text || 'Wenn du diesen Punkt bewegst, verändert sich dein Plan oft spürbar.'}
        : {title:'Dein Fundament wirkt bereits stabil.',text:'Jetzt geht es eher um Feinschliff, Klarheit und das bewusste Gestalten deines Weges.'};
    }
    if(/Meine möglichen Routen/.test(txt)){
      return {title:'Es gibt mehr als einen Weg in Richtung Freiheit.',text:'Darum schauen wir nicht nur auf eine Lösung, sondern auf Wege, die zu deinem Leben passen.'};
    }
    if(/Mein gewählter Weg/.test(txt)){
      return {title:'Jetzt darfst du mit den Hebeln spielen.',text:'Hier siehst du direkt, welche Stellschraube wirklich etwas verändert – Zeit, Einkommen, Ausgaben, Budget oder Renditeannahme.'};
    }
    if(/Mein 90-Tage-Plan/.test(txt)){
      return {title:'Große Ziele werden durch kleine nächste Schritte echt.',text:'Ein guter Plan fühlt sich nicht schwer an. Er macht nur den ersten Schritt konkret.'};
    }
    if(/Mein persönlicher Blueprint/.test(txt) && resultData?.bp?.freedomTarget){
      return {title:`Du hast jetzt einen echten Plan in der Hand.`,text:`Nimm ihn mit, verändere ihn später – oder geh ihn gemeinsam mit mir durch. Dein Freiheitsbedarf liegt bei ${rbEuro(resultData.bp.freedomTarget.freedomNeed||0)} pro Monat.`};
    }
  }catch(e){}
  return null;
}

function injectCashflowAlert(){
  const modal=document.getElementById('modal');
  if(!modal || !/Mein Leben in Zahlen/.test(modal.textContent||'')) return;

  const page=modal.querySelector('.fbr-page.is-now') || modal.querySelector('.fbr-page');
  if(!page || page.querySelector('#cashflowAlert')) return;

  const free=Number(resultData?.bp?.monthlyCashflow?.freeSurplus)||0;
  if(free>=0) return;

  const deficit=Math.abs(free);
  const net=Number(values.net)||0;
  const share=net>0 ? deficit/net : 1;

  let cls='minor', kicker='Kleine Korrektur nötig', title=`${rbEuro(deficit)} pro Monat fehlen aktuell.`;
  let text='Ein oder zwei Anpassungen reichen wahrscheinlich, um deinen Cashflow wieder ins Plus zu bringen.';

  if(share>0.10){
    cls='urgent';
    kicker='Dringend prüfen';
    title=`Dein frei verfügbarer Cashflow liegt ${rbEuro(deficit)} im Minus.`;
    text='Einnahmen und Ausgaben jetzt dringend prüfen und anpassen. Ein stabil positiver Cashflow kommt vor zusätzlicher Freiheitsrate oder neuen langfristigen Verpflichtungen.';
  }else if(share>0.05){
    cls='medium';
    kicker='Jetzt gezielt anpassen';
    title=`Dein frei verfügbarer Cashflow liegt ${rbEuro(deficit)} im Minus.`;
    text='Das ist mehr als eine kleine Abweichung. Prüfe deine größten Ausgabenblöcke und mögliche zusätzliche Einnahmen, bevor du mit der geplanten Sparrate weiterrechnest.';
  }

  const block=`<section class="cashflow-alert ${cls}" id="cashflowAlert">
    <small>${kicker}</small>
    <b>${title}</b>
    <p>${text}</p>
  </section>`;

  const spotlight=page.querySelector('#miraSpotlight');
  if(spotlight) spotlight.insertAdjacentHTML('afterend',block);
  else page.insertAdjacentHTML('afterbegin',block);
}

renderCity();setTimeout(()=>showIntro(false),180);

document.addEventListener('click',function(e){
  if(e.target.closest('[data-fb-act]') || e.target.closest('.fbr-next') || e.target.closest('.fbr-back') || e.target.closest('.fbr-stepbtn') || e.target.closest('.fbr-route button')){
    setTimeout(()=>{injectRiskBlock();injectMiraSpotlight();injectCashflowAlert();},40);
  }
});

</script>
<style id="v9-upgrade-style">
/* ===== V9 Upgrade Layer ===== */
:root{
  --v9-shadow:0 14px 32px rgba(0,0,0,.12);
  --v9-soft:rgba(255,255,255,.08);
}
body{
  background:
    radial-gradient(circle at top, rgba(255,232,178,.18), transparent 34%),
    linear-gradient(180deg,#dfe7ec 0%,#ece0d2 100%);
}
.top{
  position:sticky!important; top:0; z-index:30;
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.mapwrap{
  position:relative;
}
.mapwrap:before{
  content:"";
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:
    linear-gradient(180deg, rgba(255,223,160,.12) 0%, transparent 30%),
    linear-gradient(180deg, transparent 0%, transparent 70%, rgba(7,26,47,.18) 100%);
}
.map{
  transition:background-image .4s ease, transform .4s ease;
}
.map.v9-enter{
  animation:v9MapFade .4s ease;
}
@keyframes v9MapFade{
  from{opacity:.7; transform:scale(1.012)}
  to{opacity:1; transform:scale(1)}
}
.pin,.calc-btn,.next-card,.estimate-card,.sheet .nextbtn,.sheet .savebtn,.sheet .back{
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.pin:hover,.pin:active{filter:drop-shadow(0 10px 12px rgba(0,0,0,.26))}
.calc-btn:hover,.next-card:hover,.estimate-card:hover,.sheet .nextbtn:hover,.sheet .savebtn:hover,.sheet .back:hover{
  transform:translateY(-1px);
}
.mira-dash,.progress-card,.next-card,.estimate-card,.mira-guide,.mira-spotlight,.hero-result,.risk-block,.cashflow-alert{
  box-shadow:var(--v9-shadow);
}
.dashboard{
  gap:10px!important;
  border-top-left-radius:22px;
  border-top-right-radius:22px;
  margin-top:-8px;
}
.mira-dash{position:relative; overflow:hidden}
.mira-dash:after{
  content:""; position:absolute; right:-30px; top:-26px; width:120px; height:120px;
  border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.13), rgba(255,255,255,0));
}
.kpi-chip-row{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px}
.kpi-chip{
  padding:6px 8px; border-radius:999px; background:#f2f7f5; border:1px solid #d9e3df;
  color:#335148; font-size:.72rem; font-weight:850;
}
.v9-note{
  margin-top:8px; color:#6b7b76; font-size:.76rem; line-height:1.45;
}
.field.v9-core label:after{
  content:"wichtig";
  display:inline-block; margin-left:6px; padding:2px 6px;
  border-radius:999px; background:#edf8f5; color:#0d8c91;
  font-size:.64rem; font-weight:950; letter-spacing:.04em; text-transform:uppercase;
}
.overlay{animation:v9Overlay .2s ease-out}
@keyframes v9Overlay{from{opacity:0}to{opacity:1}}
.sheet{animation:v9Sheet .22s ease-out}
@keyframes v9Sheet{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:translateY(0)}}
.result-page,.fbr-page{animation:v9Page .2s ease}
@keyframes v9Page{from{opacity:.62; transform:translateY(5px)}to{opacity:1; transform:translateY(0)}}
.v9-divider{
  margin:14px 0 10px; height:1px;
  background:linear-gradient(90deg, transparent, rgba(23,54,47,.16), transparent);
}
.v9-celebrate{animation:v9Celebrate .55s ease}
@keyframes v9Celebrate{
  0%{transform:scale(1)}
  50%{transform:scale(1.015)}
  100%{transform:scale(1)}
}
.v9-mira-inline{
  margin:10px 0 4px;
  padding:10px 12px;
  border-radius:14px;
  background:#eef8f4;
  border:1px solid #d6e7df;
  color:#224139;
  font-size:.84rem;
  line-height:1.48;
}
.v9-mira-inline b{color:#0d8c91}
.v9-ready{
  border-left:5px solid #0d8c91;
}
.v9-warn{
  border-left:5px solid #c97845;
  background:#fff1e8;
  border-color:#c97845;
}
.v9-urgent{
  border-left:5px solid #b85a4e;
  background:#fdebea;
  border-color:#b85a4e;
}
</style>

<script id="v9-upgrade-script">
(function(){
  const MIRA_SAVE_VARIANTS=[
    ['Stark. Wieder ein Stück Klarheit.','Dein Plan bekommt echte Konturen.'],
    ['Sauber. Das sitzt.','Mira nickt anerkennend. Nur ganz dezent natürlich.'],
    ['Gut gemacht.','Noch ein Bereich weniger, der im Nebel herumstand.'],
    ['Gefällt mir.','Aus Bauchgefühl wird Schritt für Schritt ein belastbarer Plan.'],
    ['Sehr schön.','Du sammelst hier keine Felder – du baust Richtung auf.'],
    ['Das war wertvoll.','Später dankst du dir für diese paar Minuten Klarheit.'],
    ['Klug.','Genau diese Stelle wird von vielen übersprungen – und später fehlt sie.'],
    ['Da ist Musik drin.','Deine Stadt klingt schon deutlich geordneter.'],
    ['Aha.','Jetzt wird aus grob irgendwann langsam ziemlich konkret.'],
    ['Positiv verdächtig gut.','Wenn das so weitergeht, werde ich noch richtig begeistert.']
  ];
  const CORE_IDS=['age','targetAge','net','expenses','currentSaving'];

  function randomSaveLine(seed){
    const idx = Math.abs(seed||0) % MIRA_SAVE_VARIANTS.length;
    return MIRA_SAVE_VARIANTS[idx];
  }
  function doneAreas(){
    try{
      if(typeof Areas!=='undefined' && Areas.completedAreas && typeof values!=='undefined') return Areas.completedAreas(values)||0;
    }catch(e){}
    return 0;
  }
  function coreFieldsPresent(){
    try{
      const v=window.values||{};
      return !!((+v.age) && (+v.targetAge) && (+v.net) && ((+v.expenses) || (+v.currentSaving)));
    }catch(e){ return false; }
  }
  function updateMapMood(){
    const map=document.getElementById('map');
    if(!map) return;
    try{
      const useEvening = doneAreas() >= 7;
      const img = useEvening && window.CITY_EVENING ? window.CITY_EVENING : window.CITY_IMG;
      if(img){
        map.style.backgroundImage = `url('${img}')`;
        map.classList.remove('v9-enter'); void map.offsetWidth; map.classList.add('v9-enter');
      }
    }catch(e){}
  }
  function decorateDashboard(){
    const estimate=document.getElementById('estimate');
    if(estimate){
      estimate.querySelectorAll('.kpi-chip-row').forEach(x=>x.remove());
      const card=estimate.querySelector('.estimate-card');
      if(card){
        const row=document.createElement('div');
        row.className='kpi-chip-row';
        if(coreFieldsPresent()){
          row.innerHTML = `<span class="kpi-chip">Grundlage steht</span><span class="kpi-chip">${doneAreas()} von 10 Orten gestaltet</span>`;
        }else{
          row.innerHTML = `<span class="kpi-chip">Alter</span><span class="kpi-chip">Zielalter</span><span class="kpi-chip">Netto</span><span class="kpi-chip">Lebenshaltung</span>`;
        }
        const p=card.querySelector('p');
        card.insertBefore(row, p || null);
      }
    }
    const next=document.getElementById('next');
    if(next && !next.querySelector('.v9-note')){
      const note=document.createElement('div');
      note.className='v9-note';
      const d=doneAreas();
      note.textContent = d===0 ? 'Mira-Tipp: Fang mit Vision, Wohnen oder Karriere an – das bringt am schnellsten Richtung.' :
                        d<3 ? 'Mira-Tipp: Noch zwei bis drei Orte – dann steht die erste belastbare Richtung.' :
                        d<6 ? 'Mira-Tipp: Jetzt wird dein Blueprint wirklich persönlich.' :
                        d<10 ? 'Mira-Tipp: Die letzten Orte bringen Feinschliff und Stabilität.' :
                        'Mira-Tipp: Alles da. Jetzt wartet die Ergebnisreise.';
      next.appendChild(note);
    }
  }
  function markCoreFields(){
    document.querySelectorAll('.field').forEach(el=>{
      const inp=el.querySelector('[data-field]');
      if(inp && CORE_IDS.includes(inp.dataset.field)) el.classList.add('v9-core');
    });
  }
  function addResultDividers(){
    const page=document.querySelector('.fbr-page.is-now, .result-page, .fbr-page');
    if(!page) return;
    page.querySelectorAll('.v9-divider').forEach(x=>x.remove());
    page.querySelectorAll('h3').forEach(h=>{
      const d=document.createElement('div');
      d.className='v9-divider';
      h.before(d);
    });
  }
  function addInlineResultMira(){
    const page=document.querySelector('.fbr-page.is-now, .result-page, .fbr-page');
    if(!page) return;
    page.querySelectorAll('.v9-mira-inline').forEach(x=>x.remove());
    const txt=(page.textContent||'').replace(/\s+/g,' ');
    let title='', text='', cls='v9-ready';
    try{
      const bp=window.resultData?.bp;
      if(/Mein Leben in Zahlen/.test(txt) && bp?.monthlyCashflow){
        const free=Number(bp.monthlyCashflow.freeSurplus)||0;
        const net=Number(window.values?.net)||0;
        const share=net>0 ? Math.abs(free)/net : 1;
        if(free>=0){
          title='Das ist dein echter Spielraum.';
          text=`Aus ${window.rbEuro?rbEuro(free):free+' €'} frei verfügbar entstehen später Rate, Schutz und Freiheit.`;
        }else if(share<=0.05){
          cls='v9-warn'; title='Kleine Korrektur nötig.';
          text='Ein oder zwei Anpassungen reichen wahrscheinlich, um den laufenden Cashflow wieder ins Plus zu bringen.';
        }else if(share<=0.10){
          cls='v9-warn'; title='Jetzt gezielt nachschärfen.';
          text='Prüfe die größten Ausgabenblöcke und mögliche zusätzliche Einnahmen, bevor du mit einer festen Freiheitsrate weiterrechnest.';
        }else{
          cls='v9-urgent'; title='Hier braucht dein Alltag zuerst Luft.';
          text='Einnahmen und Ausgaben jetzt dringend prüfen und anpassen. Ein stabil positiver Cashflow kommt vor Zielkapital und Sparrate.';
        }
      }else if(/Mein Zielkapital/.test(txt) && bp?.freedomTarget){
        title='Die große Zahl darf groß wirken.';
        text='Entscheidend ist: Sie ist nachvollziehbar hergeleitet – aus deinem Freiheitsbedarf, späteren Einkünften und der möglichen Überbrückungsphase.';
      }else if(/Ist mein Ziel erreichbar/.test(txt) && bp?.feasibility){
        title=bp.feasibility.headline || 'Jetzt sehen wir die Machbarkeit.';
        text=bp.feasibility.detail || 'Diese Seite zeigt dir, wie tragfähig dein Weg mit den heutigen Angaben wirkt.';
      }else if(/Was fehlt mir wirklich/.test(txt)){
        const top=(bp?.bottlenecks||[])[0];
        title=top?.titel || 'Hier sitzt gerade der größte Hebel.';
        text=top?.text || 'Wenn du diesen Punkt bewegst, verändert sich dein Plan oft spürbar.';
      }else if(/Meine möglichen Routen/.test(txt)){
        title='Es gibt mehr als einen Weg in Richtung Freiheit.';
        text='Darum schauen wir nicht auf eine einzige Lösung, sondern auf Wege, die zu deinem Leben passen.';
      }else if(/Mein gewählter Weg/.test(txt)){
        title='Jetzt darfst du spielen.';
        text='Zeit, Einkommen, Ausgaben, Freiheitsbudget oder Renditeannahme – hier siehst du, welcher Hebel bei dir wirklich wirkt.';
      }else if(/Mein 90-Tage-Plan/.test(txt)){
        title='Große Ziele werden durch kleine nächste Schritte echt.';
        text='Ein guter Plan fühlt sich nicht schwer an. Er macht nur den ersten Schritt konkret.';
      }else if(/Mein persönlicher Blueprint/.test(txt)){
        title='Du hast jetzt einen echten Plan in der Hand.';
        text='Nimm ihn mit, verändere ihn später – oder geh ihn gemeinsam mit mir durch.';
      }
    }catch(e){}
    if(!title) return;
    const block=document.createElement('section');
    block.className='v9-mira-inline '+cls;
    block.innerHTML=`<b>Mira sagt:</b> ${title}<br>${text}`;
    const target = page.querySelector('#miraSpotlight,.mira-spotlight,.hero-result,h2');
    if(target) target.insertAdjacentElement('afterend', block);
    else page.prepend(block);
  }

  // Wrap existing renderCity if available
  if(typeof window.renderCity==='function'){
    const _renderCity = window.renderCity;
    window.renderCity = function(){
      const out = _renderCity.apply(this, arguments);
      setTimeout(()=>{
        updateMapMood();
        decorateDashboard();
      }, 30);
      return out;
    }
  }

  // Wrap existing renderArea if available
  if(typeof window.renderArea==='function'){
    const _renderArea = window.renderArea;
    window.renderArea = function(){
      const out = _renderArea.apply(this, arguments);
      setTimeout(markCoreFields, 20);
      return out;
    }
  }

  // Wrap toast for nicer save messages
  if(typeof window.toast==='function'){
    const _toast = window.toast;
    window.toast = function(text){
      try{
        const m = String(text||'').match(/^(.+?) gespeichert\./);
        if(m){
          const area = m[1];
          const line = randomSaveLine((area||'').length + doneAreas());
          text = `${line[0]} ${area} ist jetzt im Blueprint. ${line[1]}`;
        }
      }catch(e){}
      return _toast.call(this, text);
    }
  }

  // Small celebration after successful area save via DOM observation
  let lastDone = doneAreas();
  function afterPossibleSave(){
    const nowDone = doneAreas();
    if(nowDone > lastDone){
      const app=document.querySelector('.app');
      if(app){ app.classList.remove('v9-celebrate'); void app.offsetWidth; app.classList.add('v9-celebrate'); }
      if(nowDone===10 && typeof window.toast==='function'){
        setTimeout(()=>window.toast('Alle 10 Orte stehen. Sehr stark. Jetzt wartet die Ergebnisreise auf dich.'), 500);
      }
    }
    lastDone = nowDone;
  }

  // Mutation observer for result / modal decoration
  const obs = new MutationObserver(()=>{
    try{
      markCoreFields();
      decorateDashboard();
      addResultDividers();
      addInlineResultMira();
      afterPossibleSave();
    }catch(e){}
  });
  obs.observe(document.body, {childList:true, subtree:true});

  // initial
  setTimeout(()=>{
    updateMapMood();
    decorateDashboard();
    markCoreFields();
    addResultDividers();
    addInlineResultMira();
  },150);

})();
</script>
